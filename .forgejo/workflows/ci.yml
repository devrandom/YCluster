name: CI

on: [push, pull_request]

jobs:
  python-lint:
    runs-on: docker
    container: python:3.13
    env:
      YAMLLINT_RULES: "{extends: relaxed, rules: {line-length: disable, indentation: disable, comments-indentation: disable, comments: disable, truthy: disable, braces: disable, octal-values: disable, empty-lines: disable, empty-values: disable, quoted-strings: disable, trailing-spaces: disable}}"
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Install
        run: |
          python -m pip install -r config/ansible/admin/files/ycluster/requirements.txt argon2-cffi
          python -m pip install -e config/ansible/admin/files/ycluster/
          python -m pip install yamllint 'ty==0.0.77'

      - name: Lint
        run: |
          yamllint -d "$YAMLLINT_RULES" config/ansible
          for file in config.yml docker-compose.yaml opencode.json pyrightconfig.json; do
            if [ -f "$file" ]; then
              yamllint -d "$YAMLLINT_RULES" "$file"
            fi
          done
          ty check

  jinja-lint:
    runs-on: docker
    container: python:3.13
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Lint
        run: |
          python -m pip install 'j2lint==1.3.0'
          # The Prometheus rule templates use custom [% %] delimiters in
          # their template tasks, so j2lint cannot parse those expressions.
          find config/ansible -type f \( -name '*.j2' -o -name '*.jinja' -o -name '*.jinja2' \) \
            ! -path 'config/ansible/monitoring/templates/ycluster-alerts*.j2' \
            ! -path 'config/ansible/monitoring/templates/ycluster-federated-alerts.yml.j2' \
            -print0 | xargs -0 j2lint --ignore single-space-decorator operator-enclosed-by-spaces jinja-statements-single-space jinja-statements-indentation jinja-statements-no-tabs single-statement-per-line jinja-statements-delimiter jinja-variable-lower-case jinja-variable-format --

  ansible-lint:
    runs-on: docker
    container: python:3.13
    env:
      ANSIBLE_HOME: "${{ forgejo.workspace }}/.cache/ansible"
      ANSIBLE_LOCAL_TMP: "${{ forgejo.workspace }}/.cache/ansible/tmp"
      TMPDIR: "${{ forgejo.workspace }}/.cache/tmp"
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Lint
        run: |
          python -m pip install 'ansible==13.2.0' 'ansible-lint==26.6.0'
          mkdir -p "$ANSIBLE_HOME" "$ANSIBLE_LOCAL_TMP" "$TMPDIR"
          # A fresh checkout has neither the cluster inventory nor vault secrets.
          # files/ holds runtime assets such as Authentik blueprints, not playbooks.
          ansible-lint --profile min --offline --nocolor \
            --exclude config/ansible/vault \
            --exclude 'config/ansible/*/files' \
            config/ansible

  go-lint:
    runs-on: docker
    container: golang:1.25
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Vet
        run: make -C local-ai-proxy vet

  python-tests:
    runs-on: docker
    container: python:3.13
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Install
        run: |
          python -m pip install -r config/ansible/admin/files/ycluster/requirements.txt argon2-cffi
          python -m pip install -e config/ansible/admin/files/ycluster/

      - name: Test
        run: ./run-tests.sh

  go-tests:
    runs-on: docker
    container: golang:1.25
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git"
          git config http.extraheader "Authorization: Bearer ${FORGEJO_TOKEN}"
          git fetch --depth 1 origin "${FORGEJO_REF:-$FORGEJO_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset http.extraheader

      - name: Test
        run: make -C local-ai-proxy test
