[environment]
extra-paths = [
    "config/ansible/admin/files/ycluster",
    "mcp/cluster-exec/src",
]

[src]
include = [
    "config/ansible/admin/files",
    "contrib",
    "mcp/cluster-exec",
]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/venv",
    # Vendored upstream patch sources, not maintained as first-party code.
    "config/ansible/admin/files/glm53-sglang/patches/**",
]

# Python deps come from apt, not pip (see AGENTS.md "Python Package
# Installation"). The venv has only ansible + dev tooling; deps like
# psycopg2 / waitress / uvicorn live in apt packages and the mineru
# container image. Tell ty to ignore missing imports — they'd otherwise
# be a noisy false-positive every time someone runs `just lint-python`
# without first apt-installing the full runtime.
[rules]
unresolved-import = "ignore"

# Test files monkey-patch module-level functions (get_etcd_client,
# get_inference_status, check_gateway, etc.) to swap in fakes — that's
# the whole point of the FakeEtcd DAL seam. Type checkers can't infer
# that the test's lambda matches the production signature (they're
# stubs returning Unknown), so every monkey-patch line flags
# invalid-assignment. Dynamic test scaffolding also patches attributes
# onto ModuleType placeholders and indexes fake-client records that are
# deliberately Optional. Suppress those noisy categories for tests only.
[[overrides]]
include = [
    "config/ansible/admin/files/tests/**",
    "config/ansible/admin/files/ycluster/tests/**",
    "mcp/cluster-exec/tests/**",
]
rules = {
    invalid-assignment = "ignore",
    unresolved-attribute = "ignore",
    invalid-argument-type = "ignore",
    not-subscriptable = "ignore",
}
