[defaults]
inventory = inventory.yml
forks = 10
# etcd_nodes plugin lives in the main tree (used later by site-dev.yml).
inventory_plugins = ../../config/ansible/inventory_plugins
host_key_checking = False
remote_user = root
private_key_file = .ssh/id_dev
stdout_callback = default
result_format = yaml
# Containers always have a system python here.
interpreter_python = /usr/bin/python3
# Quieter, faster local runs.
retry_files_enabled = False
# Sandbox home is read-only; pin ansible's control socket + local tmp
# into /tmp so playbooks don't fail with "Cannot write to ControlPath"
# on first contact. remote_tmp is left at the default (~/.ansible/tmp):
# a custom /tmp/... path collides with `become_user:` tasks because
# ansible creates the parent dir with umask 077 (mode 700:root), which
# the become_user (e.g. postgres) can't write into. The default
# ~/.ansible/tmp has the same perms — that's a dev-cluster concern
# (chmod 1777 it on the containers), not an ansible.cfg one.
local_tmp = /tmp/ansible-local

[inventory]
enable_plugins = yaml, etcd_nodes

[ssh_connection]
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=120s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r
pipelining = True
