# Listen address for the proxy.
listen: ":4000"

# Auth sidecar /healthz endpoint, probed by the proxy's own /healthz
# (which reports auth status and returns 503 when auth is down).
# Defaults to the colocated sidecar at http://127.0.0.1:4002/healthz.
# Only set this for a non-default (non-sidecar) auth location.
# auth_health_url: "http://127.0.0.1:4002/healthz"

# Exactly one of `backend`, `backends`, or `etcd` must be set.

# --- Option 1: single-backend passthrough ---
# All requests are forwarded to one upstream regardless of model. The
# proxy does not inspect request bodies. Useful when one vLLM/llama.cpp
# instance serves every model you need.
backend:
  url: "http://localhost:8080"

# --- Option 2: static YAML list of model -> backend mappings ---
# The proxy reads the "model" field from each JSON request body and
# routes to the matching backend. Unknown models get a 400 in OpenAI
# error shape. Synthesizes GET /v1/models from these entries.
# Multiple entries with the same `model:` accumulate (schema is
# fan-out-ready; today the router uses only the first api_base).
# backends:
#   - model: "Kimi-K2.5-Q3_K_S"
#     api_base: "http://m1.xc:8080"
#   - model: "MiniMaxAI/MiniMax-M2.7"
#     api_base: "http://nv1.xc:8000"
#   - model: "qwen3-30b"
#     api_base: "http://c1.xc:8080"
#   - model: "qwen3-30b"        # same model, second backend (fan-out later)
#     api_base: "http://m2.xc:8080"

# Health check interval (how often each unique backend URL gets a
# GET /v1/models probe). Logs state transitions at INFO/WARN. Zero
# disables; omit to default to 30s. Only meaningful with `backends`
# or `etcd`.
# health_check_interval: 30s

# Max in-flight requests per (X-User-Id, model) pair. Defaults to 4
# when unset; 0 disables the cap. Excess requests wait in that caller's
# own FIFO queue, so a single client can't occupy every batch slot on a
# shared backend. Requests without a trusted X-User-Id are not limited.
# max_concurrent_per_user_model: 4

# Queue depth per (X-User-Id, model) pair. Defaults to 4 when unset;
# 0 disables queueing. A full queue gets HTTP 429 (rate_limit_error,
# code concurrency_limit_exceeded). This caps waiting connections and
# queue state; it does not cap request-body memory, which the router
# allocates before admission.
# max_queued_per_user_model: 4

# Max JSON request-body size the router will buffer to find the
# `model` field (bytes). Defaults to 33554432 (32 MiB) when unset.
# Sized for multimodal chat-completion requests with base64-encoded
# images; the previous hard-coded 8 MiB cap routinely hit for
# multi-image prompts. Increase further if you serve heavier
# payloads. Multipart audio uploads have a separate 200 MiB cap
# (see README).
# max_routing_body_bytes: 33554432

# --- Option 3: etcd-backed mappings (hot-reloading) ---
# The proxy watches the etcd prefix; each key under it is a model name
# and the JSON value is {"backends":[{"api_base":"..."},...]}. Edits to
# etcd propagate to the proxy without restart. endpoints defaults to
# ["http://localhost:2379"] so only prefix is strictly required.
# etcd:
#   prefix: "/cluster/config/inference/models/"
#
# Model supersession: set superseded_by inline on an obsolete model's
# etcd value to reject its requests with a 404 naming the replacement,
# e.g. ds4 -> {"superseded_by": "ds4.1"} (backends optional).
