[project]
name = "cluster-exec"
version = "0.1.0"
description = "Local MCP server for running shell commands on internal hosts via SSH bastion"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_exec"]
