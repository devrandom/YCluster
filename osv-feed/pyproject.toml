[project]
name = "osv-feed"
version = "0.1.0"
description = "Leak-free local OSV vulnerability feed mirror and matcher"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osv-feed = "osv_feed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["osv_feed"]
