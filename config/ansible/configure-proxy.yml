---
- name: Configure Proxy Settings
  hosts: storage
  become: yes
  tasks:
    - name: Add proxy and registry hostname entries to /etc/hosts
      blockinfile:
        path: /etc/hosts
        block: |
          10.0.0.254 proxy.xc
          10.0.0.100 registry.xc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - proxy.xc"
        backup: yes

    - name: Set proxy environment variables
      lineinfile:
        path: /etc/environment
        line: "{{ item }}"
        regexp: "^{{ item.split('=')[0] }}="
        backup: yes
      loop:
        - "http_proxy=http://proxy.xc:3128"
        - "https_proxy=http://proxy.xc:3128"
        - "no_proxy={{ cluster_no_proxy }}"
        - "NO_PROXY={{ cluster_no_proxy }}"

    - name: Configure apt proxy
      copy:
        dest: /etc/apt/apt.conf.d/01proxy
        content: |
          Acquire::http::Proxy "http://proxy.xc:3128";
          Acquire::https::Proxy "http://proxy.xc:3128";
        backup: yes

    - name: Update old curtin proxy configuration
      copy:
        dest: /etc/apt/apt.conf.d/90curtin-aptproxy
        content: |
          Acquire::http::Proxy "http://proxy.xc:3128";
          Acquire::https::Proxy "http://proxy.xc:3128";
        backup: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Get current snap proxy settings
      command: snap get system proxy.http
      register: snap_http_proxy
      failed_when: false
      changed_when: false

    - name: Set snap proxy settings
      command: "{{ item }}"
      loop:
        - "snap set system proxy.http=http://proxy.xc:3128"
        - "snap set system proxy.https=http://proxy.xc:3128"
      when: 
        - ansible_facts['os_family'] == "Debian"
        - snap_http_proxy.stdout != "http://proxy.xc:3128"
      become: yes

# Hosts outside the storage group may still point at the proxy, left over from
# an earlier run (one compute node does). They keep whatever proxy settings
# they have; only the bypass list is normalized, so no managed host can send a
# cluster name to the proxy.
- name: Normalize the cluster proxy bypass on the remaining managed hosts
  hosts: managed:!storage
  become: yes
  tasks:
    - name: Read the host environment file
      slurp:
        src: /etc/environment
      register: host_environment
      failed_when: false

    - name: Set the cluster bypass where a proxy is configured
      lineinfile:
        path: /etc/environment
        line: "{{ item }}"
        regexp: "^{{ item.split('=')[0] }}="
        backup: yes
      loop:
        - "no_proxy={{ cluster_no_proxy }}"
        - "NO_PROXY={{ cluster_no_proxy }}"
      when:
        - host_environment.content is defined
        - "'http_proxy=' in (host_environment.content | b64decode)"
