---
- name: Setup admin project quota storage
  hosts: storage
  become: yes
  environment: "{{ etcd_client_env }}"

  tasks:
    - name: Check if storage leader
      ansible.builtin.command: mountpoint -q /rbd/user
      register: rbd_mounted
      changed_when: false
      failed_when: false

    - name: Set storage leader fact
      ansible.builtin.set_fact:
        is_storage_leader: "{{ rbd_mounted.rc == 0 }}"

    - name: Generate admin password in etcd
      ansible.builtin.shell: |
        python3 -c "
        import secrets
        from ycluster.common.etcd_utils import get_etcd_client
        key = '/cluster/config/ycluster/db-password'
        client = get_etcd_client()
        if client.get(key)[0] is None:
            client.put(key, secrets.token_urlsafe(24))
        "
      changed_when: false
      run_once: yes

    - name: Copy admin project provisioning script
      ansible.builtin.copy:
        src: files/provision-admin.py
        dest: /usr/local/bin/provision-admin
        mode: '0755'
      when: is_storage_leader

    - name: Create admin database migrations directory
      ansible.builtin.file:
        path: /usr/local/lib/ycluster/migrations
        state: directory
        mode: '0755'
      when: is_storage_leader

    - name: Copy admin database migrations
      ansible.posix.synchronize:
        src: "files/migrations/"
        dest: /usr/local/lib/ycluster/migrations/
        delete: yes
        use_ssh_args: true
        rsync_opts:
          - "--checksum"
          - "--no-owner"
          - "--no-group"
          - "--chmod=F0644"
      when: is_storage_leader

    - name: Read admin DB password from etcd
      # Runs as root: only root can read the etcd client certs.
      ansible.builtin.command: |
        python3 -c "
        from ycluster.common.etcd_utils import get_etcd_client
        pw = get_etcd_client().get('/cluster/config/ycluster/db-password')[0]
        if pw is None: raise SystemExit('password not found in etcd')
        print(pw.decode())
        "
      register: db_password
      when: is_storage_leader
      changed_when: false
      no_log: true

    - name: Grant admin TCP access in pg_hba.conf
      # Runs as root: pg_hba.conf is root-owned and the reload needs root.
      ansible.builtin.blockinfile:
        path: /etc/postgresql/16/main/pg_hba.conf
        marker: "# {mark} admin (ansible-managed)"
        block: |
          host    admin    admin    10.0.0.0/24    scram-sha-256
          host    admin    admin    127.0.0.1/32    scram-sha-256
      when: is_storage_leader
      notify: reload postgresql

    - name: Provision admin project database
      # Runs as the postgres OS user so peer authentication maps to the
      # postgres DB superuser. The password is fetched as root (etcd client
      # certs are root-only) and passed via environment variable.
      ansible.builtin.command: /usr/local/bin/provision-admin
      environment:
        ADMIN_DB_PASSWORD: "{{ db_password.stdout }}"
      when: is_storage_leader
      become_user: postgres
      changed_when: false
      no_log: true

    - name: Flush handlers so the app role can connect
      ansible.builtin.meta: flush_handlers
      when: is_storage_leader

    - name: Copy project-defaults migration script
      ansible.builtin.copy:
        src: files/migrate-project-defaults.py
        dest: /usr/local/bin/migrate-project-defaults
        mode: '0755'
      when: is_storage_leader

    - name: Seed default projects from Authentik user accounts
      when: is_storage_leader
      block:
        - name: Prepare Authentik user export file
          # Pre-created postgres-owned with a fixed mode so permissions
          # don't depend on the invoking umask and the postgres-user apply
          # task can read it. The root fetch task can still overwrite it.
          ansible.builtin.copy:
            dest: /run/project-migration-users.json
            content: ""
            owner: postgres
            group: postgres
            mode: '0600'

        - name: Fetch Authentik users for default-project migration
          # Runs as root: only root can read the etcd client certs.
          ansible.builtin.shell:
            cmd: >-
              /usr/local/bin/migrate-project-defaults --from-authentik
              > /run/project-migration-users.json
          changed_when: false
          no_log: true

        - name: Apply default-project migration
          # Runs as the postgres OS user so peer authentication maps to the
          # postgres DB user. User data is passed via a root-owned JSON file
          # and parameterized queries; the migration itself is idempotent.
          ansible.builtin.shell:
            cmd: /usr/local/bin/migrate-project-defaults --apply < /run/project-migration-users.json
          become_user: postgres
          register: migration_apply
          changed_when: "'changed: 0' not in migration_apply.stdout"

      always:
        - name: Remove Authentik user export
          ansible.builtin.file:
            path: /run/project-migration-users.json
            state: absent
          when: is_storage_leader

  handlers:
    - name: reload postgresql
      ansible.builtin.command: systemctl reload postgresql@16-main
