---
# Deploy DeepSeek-V4.1-Flash-1017 staging scripts to Nvidia GPU nodes.
#
# This is a NEW alongside backend, not an in-place upgrade of DS4
# (deepseek-v4-flash). V4.1-Flash is a different architecture
# (deepseek_v41 vs deepseek_v4) and cannot reuse the V4 DSpark r16/r10
# images. It requires TP4 (4× 96 GB RTX PRO 6000) and ~510 GB of NVMe.
#
# Model: deepseek-ai/DeepSeek-V4.1-Flash-1017 (2026-10-17 weights update).
# Image: ghcr.io/local-inference-lab/vllm karmic-kraken stable channel —
# the shared profile runner (PROFILE=ds41-flash). See
# docs/inference/deepseek-v4.1-flash.md for the R36→KK lineage, the
# digests, and what is qualified upstream vs by us (disk Engram is
# functionally tested past R36 but has no repeated throughput benchmark
# upstream; serving performance of the stable build is unqualified).
#
# Runtime profile (this deployment):
#   TP4/DCP1, DSpark K7 adaptive, FP8 KV, 512K context, disk Engram,
#   9 max seqs, 8192-token batch budget, prefill-compute-share 0.2,
#   long-prefill-token-threshold 4096 (qualified fairness settings).
#
# Gating:
#   Per-host `ds41_enabled: true` in private host_vars/<node>.yml opts in.
#   Per-host `ds41_gpus: "<4 CDI indices>"` selects the GPUs.
#
# Run after setup-gpu-podman.yml. To bring up:
#   ssh <host>.yc
#   ~/bin/ds41-setup.sh --download   # pull image + checkpoint (~510 GB)
#   ~/bin/ds41-setup.sh              # subsequent: image pull + verify
#   systemctl --user start ds41-flash    # runtime, owned by the quadlet
#
# The runtime spec is a Quadlet (templates/ds41-flash.container.j2) in the dev
# user's ~/.config/containers/systemd. Quadlet's ExecStart is
# `podman run --rm --replace`, so every start builds a fresh container from
# the spec; linger starts it at boot and Restart=always restarts the engine
# after a crash. This play is a no-op on hosts without ds41_enabled, and none
# currently opt in, so the quadlet is unexercised on this fleet.

- name: Deploy DeepSeek-V4.1-Flash staging scripts to Nvidia GPU nodes
  hosts: nvidia
  become: yes
  vars:
    # Karmic Kraken stable 20261020, digest-verified against the container
    # release receipt (blackwell-llm-docker release karmic-kraken-…/…).
    ds41_image: "ghcr.io/local-inference-lab/vllm@sha256:94887a58d4c003a06cb2d96ee5522eb7cea216838cfdad318076f9a08e2e762c"
    ds41_image_tag: "ghcr.io/local-inference-lab/vllm:karmic-kraken-20261020"
    ds41_repo: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    ds41_revision: "1bae0e1088993b9b82de08f59de5be5a34e42170"
    ds41_model_dir: "/home/dev/models/DeepSeek-V4.1-Flash"
    # The KK profile serves `DeepSeek-V4.1-Flash` by default; the launcher
    # passes --served-model-name so the gateway can register it under our
    # lowercase routing key.
    ds41_served_name: "deepseek-v4_1-flash"
    ds41_port: 9218
    ds41_cache_dir: "/home/dev/.cache/ds41-kk"
    # Engram placement: disk for hosts without 189 GiB spare RAM. Override
    # per-host with ds41_engram_memory: "ram" on larger hosts.
    ds41_engram_memory: "disk"
    ds41_flash_container: "ds41-flash"
    # Container memory ceiling (the profile runner is memory-hungry).
    ds41_memory: "120g"
    # The runtime spec is a Quadlet user unit owned by the dev user manager.
    ds41_user: "dev"
    ds41_quadlet_dir: "/home/dev/.config/containers/systemd"
    ds41_quadlet_path: "{{ ds41_quadlet_dir }}/{{ ds41_flash_container }}.container"

  tasks:
    - name: End play for nodes with no host-visible NVIDIA GPU
      meta: end_host
      when: (ansible_local.gpu.nvidia_host_gpu_count | default(0) | int) == 0

    - name: End play for nodes that have not opted into DS4.1
      meta: end_host
      when: not (ds41_enabled | default(false))

    - name: Ensure ~dev/bin exists
      file:
        path: /home/dev/bin
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    - name: Install DS4.1 staging scripts into ~dev/bin
      template:
        src: "{{ item }}.j2"
        dest: "/home/dev/bin/{{ item }}"
        owner: dev
        group: dev
        mode: '0755'
      loop:
        - ds41-setup.sh

    - name: Read host dev UID
      command: id -u {{ ds41_user }}
      register: ds41_dev_uid
      changed_when: false
      check_mode: false

    - name: Check whether the DS4.1 service user lingers
      command: loginctl show-user {{ ds41_user }} --property=Linger --value
      register: ds41_linger
      changed_when: false
      check_mode: false

    - name: Enable lingering for the DS4.1 service user
      command: loginctl enable-linger {{ ds41_user }}
      when: ds41_linger.stdout | trim != 'yes'
      changed_when: true

    - name: Ensure the dev quadlet directory exists
      file:
        path: "{{ ds41_quadlet_dir }}"
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    - name: Install the DS4.1 quadlet
      template:
        src: templates/ds41-flash.container.j2
        dest: "{{ ds41_quadlet_path }}"
        owner: dev
        group: dev
        mode: '0644'

    # Earlier revisions supervised the container with a root system unit; the
    # quadlet is owned by the dev user manager and both would fight over the
    # container name.
    - name: Check for the legacy DS4.1 system unit
      stat:
        path: /etc/systemd/system/ds41-flash.service
      register: ds41_legacy_unit

    - name: Stop and disable the legacy DS4.1 system unit
      systemd:
        name: ds41-flash.service
        state: stopped
        enabled: no
      when: ds41_legacy_unit.stat.exists

    - name: Remove the legacy DS4.1 system unit
      file:
        path: /etc/systemd/system/ds41-flash.service
        state: absent
      when: ds41_legacy_unit.stat.exists

    - name: Remove the legacy DS4.1 launcher
      file:
        path: /home/dev/bin/ds41-start.sh
        state: absent

    - name: Reload the dev user manager so the quadlet generator runs
      become_user: "{{ ds41_user }}"
      command: systemctl --user daemon-reload
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ds41_dev_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ds41_dev_uid.stdout }}/bus"
      changed_when: false

    - name: Check whether the DS4.1 checkpoint is staged
      stat:
        path: "{{ ds41_model_dir }}/config.json"
      register: ds41_checkpoint

    # `started`, not `restarted`: an already-active unit is left alone, so a
    # deploy never bounces inference. Quadlet recreates the container from the
    # .container spec on the next start.
    - name: Start the DS4.1 quadlet
      become_user: "{{ ds41_user }}"
      systemd:
        name: "{{ ds41_flash_container }}.service"
        scope: user
        state: started
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ds41_dev_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ds41_dev_uid.stdout }}/bus"
      when: ds41_checkpoint.stat.exists

    - name: Note that DS4.1 stays unmanaged until its checkpoint is staged
      debug:
        msg: >-
          The {{ ds41_flash_container }} quadlet is installed but not started:
          no checkpoint at {{ ds41_model_dir }}/config.json. Run
          ~/bin/ds41-setup.sh --download as dev, then re-run this play.
      when: not ds41_checkpoint.stat.exists

- name: Register the DS4.1 backend with local-ai-proxy
  hosts: storage
  become: yes
  vars:
    ds41_nvidia_host: >-
      {{ (groups['nvidia']
          | select('in', hostvars.keys())
          | list)
         | map('extract', hostvars, 'ds41_enabled')
         | zip(groups['nvidia'] | select('in', hostvars.keys()) | list)
         | selectattr(0, 'defined')
         | selectattr(0, 'equalto', true)
         | map(attribute=1)
         | first
         | default('') }}
  tasks:
    - name: Check if this host is the storage leader
      command: mountpoint -q /rbd/user
      register: rbd_user_mounted
      failed_when: false
      changed_when: false

    - name: Set storage leader fact
      set_fact:
        is_storage_leader: "{{ rbd_user_mounted.rc == 0 }}"

    - name: End play when no DS4.1 host is opted in
      meta: end_host
      when: ds41_nvidia_host | length == 0

    - name: Set DS4.1 backend facts
      set_fact:
        ds41_backend_url: "http://{{ ds41_nvidia_host }}.xc:{{ hostvars[ds41_nvidia_host]['ds41_port'] | default(9218) }}"
        ds41_served_name: "{{ hostvars[ds41_nvidia_host]['ds41_served_name'] | default('deepseek-v4_1-flash') }}"

    - name: Register the DS4.1 backend with local-ai-proxy
      command: >-
        ycluster inference add {{ ds41_backend_url }} {{ ds41_served_name }}
      register: ds41_proxy_register
      changed_when: "'added' in ds41_proxy_register.stdout or 'registered' in ds41_proxy_register.stdout"
      when:
        - is_storage_leader
        - not ansible_check_mode

    - name: Report DS4.1 registration
      debug:
        msg: >-
          DS4.1 backend registered at {{ ds41_backend_url }}
          (served: {{ ds41_served_name }})
      when:
        - is_storage_leader
        - not ansible_check_mode
