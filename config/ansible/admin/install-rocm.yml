---
- name: Install ROCm on AMD GPU nodes
  hosts: compute
  become: yes
  vars:
    rocm_version: "6.4.4"
  tasks:
    - name: Display AMD GPU status
      debug:
        msg: "AMD GPU detected: {{ ansible_local.gpu.has_amd_gpu | default(false) }}"

    - name: End play for nodes without AMD GPU
      meta: end_host
      when: not (ansible_local.gpu.has_amd_gpu | default(false))

    # Kernel pinning: use a known-good kernel for amdgpu DKMS.
    # Gated behind the 'kernel-pin' tag (and 'never' so it doesn't run by
    # default) because purging the running kernel on a remote host is a
    # bricking risk if the pinned kernel lacks NIC drivers or panics.
    # Run with `--tags kernel-pin` during a maintenance window with
    # console/IPMI access.
    - name: Pin kernel to known-good amdgpu DKMS version
      tags: ['kernel-pin', 'never']
      block:
        # amdgpu-dkms only builds for the pinned series. A failed build makes
        # /etc/kernel/postinst.d/dkms exit 11, which leaves linux-image and
        # linux-headers half-configured and blocks every later apt run until
        # the kernel is removed, so drop the metapackages that pull in others.
        - name: Remove kernel meta-packages (prevents other series upgrading)
          apt:
            name:
              - linux-generic
              - linux-image-generic
              - linux-headers-generic
              - linux-image-generic-hwe-24.04
              - linux-headers-generic-hwe-24.04
            state: absent
            purge: yes

        - name: Install pinned kernel
          apt:
            name:
              - "linux-image-{{ rocm_kernel_version }}"
              - "linux-headers-{{ rocm_kernel_version }}"
              # modules-extra carries the less-common NIC drivers (e.g. r8169
              # for RTL8125). Without it the box boots with no Ethernet.
              - "linux-modules-extra-{{ rocm_kernel_version }}"
            state: present
            update_cache: yes

        # GA 6.8.0-147+ and HWE 6.17 both ship kernel APIs newer than
        # amdgpu-dkms 6.12.12 supports (pci_resize_resource(), drm), and a
        # half-configured kernel retries its DKMS build on every apt run.
        # Keep only the pinned kernel, including any half-configured ones.
        - name: Find kernels to remove
          shell: >
            dpkg -l 'linux-image-[0-9]*-generic' 'linux-headers-[0-9]*-generic'
            'linux-modules-[0-9]*-generic' 'linux-modules-extra-[0-9]*-generic'
            'linux-tools-[0-9]*-generic' 2>/dev/null |
            awk '/^i[a-z] /{print $2}' |
            grep -v '{{ rocm_kernel_version }}' |
            tr '\n' ' '
          register: stale_kernels
          changed_when: false

        - name: Remove non-pinned kernels
          apt:
            name: "{{ stale_kernels.stdout.split() }}"
            state: absent
            purge: yes
          when: stale_kernels.stdout.strip() != ""
          register: kernels_removed

        - name: Update GRUB
          command: update-grub
          when: kernels_removed is changed

    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - build-essential
          - dkms
          - "linux-headers-{{ rocm_kernel_version }}"
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Copy ROCm GPG key
      copy:
        src: rocm.gpg.key
        dest: /tmp/rocm.gpg.key
        mode: '0644'
      changed_when: false

    - name: Import and dearmor ROCm GPG key
      shell: gpg --dearmor < /tmp/rocm.gpg.key > /etc/apt/keyrings/rocm.gpg
      args:
        creates: /etc/apt/keyrings/rocm.gpg

    - name: Set proper permissions on GPG key
      file:
        path: /etc/apt/keyrings/rocm.gpg
        mode: '0644'

    - name: Clean up temporary GPG file
      file:
        path: /tmp/rocm.gpg.key
        state: absent
      changed_when: false

    - name: Add ROCm repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/{{ rocm_version }} noble main"
        state: present
        filename: rocm
      register: rocm_repo_added

    - name: Add amdgpu repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/amdgpu/{{ rocm_version }}/ubuntu noble main"
        state: present
        filename: amdgpu
      register: amdgpu_repo_added

    - name: Set ROCm package pinning preference
      copy:
        dest: /etc/apt/preferences.d/rocm-pin-600
        content: |
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
        mode: '0644'
      register: rocm_pin_set

    - name: Update apt cache after adding ROCm repos
      apt:
        update_cache: yes
      when: rocm_repo_added is changed or amdgpu_repo_added is changed or rocm_pin_set is changed

    - name: Install amdgpu-dkms driver
      apt:
        name: amdgpu-dkms
        state: present
      register: amdgpu_install

    - name: Check if amdgpu DKMS is built for current kernel
      shell: dkms status amdgpu | grep "{{ rocm_kernel_version }}.*installed"
      register: dkms_status
      changed_when: false
      failed_when: false

    - name: Get amdgpu DKMS version
      shell: dkms status amdgpu | head -1 | cut -d',' -f1 | sed 's/amdgpu\///'
      register: dkms_version
      changed_when: false
      when: dkms_status.rc != 0

    - name: Build amdgpu DKMS for current kernel
      command: dkms install amdgpu/{{ dkms_version.stdout }} -k {{ rocm_kernel_version }}
      when: dkms_status.rc != 0

    - name: Install ROCm packages
      apt:
        name:
          - rocm
          - rocm-validation-suite
        state: present

    - name: Add users to render and video groups
      user:
        name: "{{ item }}"
        groups:
          - render
          - video
        append: yes
      loop:
        - "{{ ansible_user | default('ubuntu') }}"

    - name: Verify ROCm installation
      command: /opt/rocm/bin/rocminfo
      register: rocminfo_output
      changed_when: false
      failed_when: false

    - name: Display ROCm info
      debug:
        msg: "{{ rocminfo_output.stdout_lines[:20] }}"
      when: rocminfo_output.rc == 0

    - name: Reboot required notice
      debug:
        msg: "NOTICE: Reboot required to run kernel {{ rocm_kernel_version }} (currently {{ ansible_facts['kernel'] }})"
      when: ansible_facts['kernel'] != rocm_kernel_version or amdgpu_install.changed
