---
- name: Setup network services on core nodes
  hosts: core
  become: yes
    
  tasks:
    # Cluster proxy policy lives in conf.d, not in squid.conf. The stock
    # squid.conf includes /etc/squid/conf.d/*.conf just before its final
    # "http_access deny all"; keeping the conffile unmodified is what lets
    # unattended-upgrades install squid updates instead of skipping them
    # with "Package squid has conffile prompt".
    - name: Configure Squid proxy
      copy:
        dest: /etc/squid/conf.d/50-ycluster.conf
        content: |
          # Cluster proxy policy. Managed by Ansible:
          # admin/setup-network-services.yml.

          # Clients on the cluster networks. The stock localnet ACL is not
          # reused: it also covers 0.0.0.0/8, CGNAT and link-local ranges.
          acl ycluster_net src 10.0.0.0/8
          acl ycluster_net src 172.16.0.0/12
          acl ycluster_net src 192.168.0.0/16
          acl ycluster_net src 127.0.0.0/8
          http_access allow ycluster_net

          # Shutdown timeout (faster restarts)
          shutdown_lifetime 5 seconds

          # Timeouts for large downloads
          connect_timeout 2 minutes
          read_timeout 15 minutes
          request_timeout 10 minutes

          # Cache configuration
          cache_dir ufs /var/spool/squid 1000 16 256
          cache_mem 256 MB
          maximum_object_size_in_memory 512 KB
          maximum_object_size 100 MB

          # Refresh patterns for package repositories
          refresh_pattern ^ftp:           1440    20%     10080
          refresh_pattern ^gopher:        1440    0%      1440
          refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
          refresh_pattern \/(Packages|Sources)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
          refresh_pattern \/Release(|\.gpg)$ 0 0% 0 refresh-ims
          refresh_pattern \/InRelease$ 0 0% 0 refresh-ims
          refresh_pattern \/(Translation-.*)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
          refresh_pattern .               0       20%     4320

          # Logging
          access_log /var/log/squid/access.log squid
        mode: '0644'
      notify: restart squid

    # Older runs wrote the policy straight into squid.conf, leaving the
    # package conffile modified. Put the packaged copy back so future
    # upgrades need no conffile decision; --reinstall also pulls the
    # candidate version, finishing the upgrade unattended-upgrades skipped.
    - name: Check for local changes to package-managed squid files
      command: dpkg -V squid
      register: squid_dpkg_verify
      changed_when: false
      failed_when: false
      check_mode: no

    # A same-version reinstall leaves a locally modified conffile alone
    # (dpkg only rewrites it when the shipped copy changed), so move it out
    # of the way first and let --force-confmiss unpack the packaged copy.
    - name: Move the locally modified squid.conf aside
      command: mv -f /etc/squid/squid.conf /etc/squid/squid.conf.pre-conf.d
      when: "'/etc/squid/squid.conf' in squid_dpkg_verify.stdout"

    - name: Restore the packaged squid.conf and upgrade squid
      command: apt-get install -y --reinstall -o Dpkg::Options::=--force-confmiss squid
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: "'/etc/squid/squid.conf' in squid_dpkg_verify.stdout"
      notify: restart squid

    - name: Flush handlers to restart squid immediately
      meta: flush_handlers

    - name: Remove ubuntu-fan package (conflicts with bind-dynamic)
      apt:
        name: ubuntu-fan
        state: absent
        purge: yes

    - name: Disable systemd-resolved to free port 53
      systemd:
        name: systemd-resolved
        state: stopped
        enabled: no

    - name: Clear default dnsmasq.conf to avoid conflicts
      copy:
        dest: /etc/dnsmasq.conf
        content: |
          # Main dnsmasq configuration
          # All configuration is in /etc/dnsmasq.d/
          conf-dir=/etc/dnsmasq.d/,*.conf
          # Use additional hosts file for static DNS entries
          addn-hosts=/etc/static-hosts
          server=208.67.222.222
          server=8.8.8.8
          server=1.1.1.1
        backup: yes
      notify: restart dnsmasq

    - name: Create empty static hosts file for dnsmasq
      copy:
        dest: /etc/static-hosts
        content: ""
        force: no
        owner: root
        group: root
        mode: '0644'

    - name: Create dnsmasq configuration directory
      file:
        path: /etc/dnsmasq.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    # dnsmasq refuses to start if tftp-root doesn't exist. The directory is
    # populated later by setup-pxe-boot.yml, but it must exist now so dnsmasq
    # can start. Pre-create it here.
    - name: Create TFTP root directory
      file:
        path: /var/lib/tftpboot
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create dnsmasq configuration (DNS and TFTP only)
      copy:
        dest: /etc/dnsmasq.d/dns-tftp.conf
        mode: '0644'
        content: |
          # DNS configuration
          local=/xc/
          domain=xc
          domain-needed

          # Dynamic binding for VIP support
          bind-dynamic

          # PXE boot configuration
          enable-tftp
          tftp-root=/var/lib/tftpboot

          # Disable DHCP (handled by scapy-based server)
          port=53
      notify: restart dnsmasq

    - name: Create squid cache directory
      file:
        path: /var/spool/squid
        state: directory
        owner: proxy
        group: proxy
        mode: '0750'

    - name: Check if squid cache is already initialized
      stat:
        path: /var/spool/squid/00
      register: squid_cache_initialized

    - name: Stop squid service for cache initialization
      systemd:
        name: squid
        state: stopped
      when: not squid_cache_initialized.stat.exists
      ignore_errors: yes

    - name: Initialize squid cache
      command: squid -z
      when: not squid_cache_initialized.stat.exists

    - name: Enable and start squid service
      systemd:
        name: squid
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Enable and start dnsmasq service (for DNS and TFTP)
      systemd:
        name: dnsmasq
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Create systemd timer for DHCP updates
      copy:
        dest: /etc/systemd/system/update-dhcp-hosts.timer
        content: |
          [Unit]
          Description=Update DHCP hosts from etcd
          
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          
          [Install]
          WantedBy=timers.target

    - name: Create systemd service for DHCP updates
      copy:
        dest: /etc/systemd/system/update-dhcp-hosts.service
        content: |
          [Unit]
          Description=Update DHCP hosts from etcd
          
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/ycluster/etcd-client.env
          ExecStart=/usr/local/bin/ycluster dhcp update-hosts

    - name: Enable and start network services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - squid
        - update-dhcp-hosts.timer

  handlers:
    - name: restart squid
      systemd:
        name: squid
        state: restarted

    - name: restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted
