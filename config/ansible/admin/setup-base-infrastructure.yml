---
- name: Setup base infrastructure on managed cluster nodes
  hosts: managed
  become: yes
  vars:
    admin_services_dir: /opt/admin-services
    
  tasks:
    - name: Update package cache
      apt:
        cache_valid_time: 3600
      changed_when: false

    - name: Install required packages
      apt:
        name:
          # Not every image ships it, and without the package the
          # apt-daily-upgrade timer exits without applying security updates.
          - unattended-upgrades
          - python3
          - python3-pip
          - python3-flask
          - python3-etcd3
          - python3-scapy
          - python3-requests
          - nginx
          - squid
          - dnsmasq
          - genisoimage
          - keepalived
          - chrony
          - curl
          - wget
          - python3-pysnmp4
          - git
          - cmake
          - clang
          - libcurl4-openssl-dev
        state: present

    # A patched library only protects a daemon once the daemon reloads it, so
    # let needrestart restart services after package upgrades. Storage keeps
    # needrestart's non-restarting default: an unattended restart of ceph,
    # etcd, keepalived or postgresql costs availability. Container runtimes
    # are deferred everywhere (see the conf.d drop-in below).
    - name: Restart services after package upgrades
      lineinfile:
        path: /etc/needrestart/needrestart.conf
        regexp: '^\s*#?\$nrconf\{restart\}\s*=.*$'
        line: "$nrconf{restart} = 'a';"
      when: "'storage' not in group_names"

    - name: Defer container and database restarts to a maintenance window
      copy:
        dest: /etc/needrestart/conf.d/50-ycluster.conf
        content: |
          # Restarting these is a maintenance-window action; everything else
          # is restarted so patched libraries take effect.
          $nrconf{override_rc}{qr(^incus)} = 0;
          $nrconf{override_rc}{qr(^postgresql)} = 0;
        mode: '0640'

    - name: Create admin services directory
      file:
        path: "{{ admin_services_dir }}"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create cluster utilities directory
      file:
        path: /usr/local/lib/cluster
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create web root directory
      file:
        path: /var/www/html
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data

    - name: Install cluster-speedtest utility
      copy:
        src: files/scripts/cluster-speedtest
        dest: /usr/local/bin/cluster-speedtest
        owner: root
        group: root
        mode: '0755'

    - name: Clone infrastructure repository
      git:
        repo: https://gitlab.com/devrandom01/ycluster.git
        dest: /opt/infrastructure
        force: no
      ignore_errors: yes

    # Local DNS health checks resolve the bare hostname via 127.0.0.1
    # (local dnsmasq). Dnsmasq only forwards *.xc to the gateway, so
    # the short hostname must be in /etc/hosts. Nodes that were
    # re-provisioned with a new name (e.g. former c1 -> x1) can end up
    # with a stale 127.0.1.1 line; replace it.
    - name: Ensure 127.0.1.1 loopback entry matches inventory hostname
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}.xc {{ inventory_hostname }}"
        state: present
      notify: reload dnsmasq hosts

  handlers:
    # dnsmasq reads /etc/hosts at startup; nudge it to re-read when
    # we change the loopback line. SIGHUP is a no-op if dnsmasq isn't
    # running yet (first-run case on a fresh node).
    - name: reload dnsmasq hosts
      systemd:
        name: dnsmasq
        state: reloaded
      failed_when: false

- name: Storage specific setup
  hosts: storage
  become: yes
  # Pulled by explicit file reference, not a group_vars/storage auto-load, so
  # it stays out of `ansible-inventory --host` dumps (vault/storage.yml).
  vars_files:
    - ../vault/storage.yml

  tasks:
    - name: Set ubuntu user password
      user:
        name: ubuntu
        password: "{{ vault_ubuntu_password | password_hash('sha512', 'ycluster') }}"
        update_password: always

    - name: Populate local node information in etcd
      command: ycluster cluster populate-local-node
      environment: "{{ etcd_client_env }}"
      register: populate_result
      changed_when: "'Node information updated' in populate_result.stdout"
      failed_when: populate_result.rc != 0
