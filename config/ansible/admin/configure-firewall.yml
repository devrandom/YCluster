---
# Host firewall for managed nodes, on by default.
#
# Deny new inbound connections, allow outbound, and let everything inside
# the cluster networks through untouched: the cluster LAN, the WireGuard
# overlay, the Incus guest bridge and the docker bridges. Loopback is
# allowed by ufw itself.
#
# Three deliberate departures from a bare "deny inbound":
#
#   * routed forwarding stays permissive. ufw defaults the routed policy to
#     deny, which sits in the iptables layer next to the Incus nft NAT table
#     and drops guest egress even though the nft chain accepts it.
#   * the WireGuard listen port is opened for UDP. The tunnel's outer
#     packets arrive on the uplink with a public source address, so a rule
#     keyed on the overlay subnet cannot match them, and without the port
#     the server could not handshake towards the node.
#   * the container bridges (172.16.0.0/12) are allowed. Rootful docker
#     containers reach host services over the bridge — grafana resolves its
#     datasources through host.docker.internal — and that traffic arrives on
#     the input path, not the forwarding one. Rootless podman needs nothing
#     here: pasta hands it the host's loopback, which ufw already accepts.
#
# Keepalived needs no rule of its own. VRRP advertisements are protocol 112
# to the multicast group 224.0.0.18, sourced from the sending node's
# 10.0.0.x address, and the cluster LAN rule below accepts every protocol
# from that range. ufw special-cases only mDNS, SSDP and DHCP in its
# before-input chain, and its after-input chain drops broadcast
# destinations, not multicast ones.
#
# Hosts that serve a network outside the cluster add it to
# host_firewall_networks_extra (a VM NAT spoke's transit0 subnet, a remote
# node's site LAN), and hosts that need an inbound UDP port from anywhere
# beyond WireGuard list it in host_firewall_udp_ports (tailscale's 41641).
#
# Every host in the target group gets the firewall unless it opts out with
# `host_firewall: false` in host_vars. The default target is `managed`, which
# leaves the public-fronted dev1a/dev1b out of scope, and dev1a/dev1b's own
# addresses mean they would need a per-service allow list rather than these
# blanket subnets.
- name: Configure the host firewall
  hosts: "{{ host_firewall_target | default('managed') }}"
  become: yes

  handlers:
    - name: reload ufw
      command: ufw --force reload

  vars:
    host_firewall_networks:
      - "10.0.0.0/16"                           # cluster LAN
      - "{{ wg_peer_subnet }}"                  # WireGuard overlay peers
      - "{{ incus_bridge_subnet | default('10.100.0.0/24') }}"
      - "172.16.0.0/12"                         # docker bridges
    host_firewall_allowed_networks: "{{ host_firewall_networks + (host_firewall_networks_extra | default([])) }}"

  tasks:
    - name: End play if this host opted out
      ansible.builtin.meta: end_host
      when: not (host_firewall | default(true) | bool)

    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow the cluster networks through
      community.general.ufw:
        rule: allow
        from: "{{ item }}"
      loop: "{{ host_firewall_allowed_networks }}"
      notify: reload ufw

    - name: Read the WireGuard listen port
      ansible.builtin.command: wg show wg0 listen-port
      register: host_firewall_wg_port
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Allow the WireGuard listen port
      community.general.ufw:
        rule: allow
        port: "{{ host_firewall_wg_port.stdout }}"
        proto: udp
      when:
        - host_firewall_wg_port.rc | default(1) == 0
        - host_firewall_wg_port.stdout | default('') | length > 0
      notify: reload ufw

    - name: Allow extra UDP ports from anywhere
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ host_firewall_udp_ports | default([]) }}"
      notify: reload ufw

    # SSH stays reachable from anywhere. The firewall is a blast-radius
    # control, not a replacement for the overlay management path, and a
    # colo host whose overlay is down must not need a console to get back.
    - name: Allow SSH from anywhere
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: host_firewall_ssh | default(true) | bool
      notify: reload ufw

    - name: Set the default policies
      community.general.ufw:
        default: "{{ item.policy }}"
        direction: "{{ item.direction }}"
      loop:
        - { policy: deny, direction: incoming }
        - { policy: allow, direction: outgoing }
        - { policy: allow, direction: routed }
      notify: reload ufw

    - name: Enable the firewall
      community.general.ufw:
        state: enabled
