# Rate-limit zones for the publicly-exposed admin-api paths.
#
# External traffic now arrives via frp, which speaks PROXY protocol v2
# and lands on the loopback alt vhosts (127.0.0.2:17080/17443). Those
# vhosts set `set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol;`
# (see admin-api-alt.conf.j2), so $binary_remote_addr is the real client
# IP and these zones apply per client rather than as a global cap.

limit_req_zone $binary_remote_addr zone=wg_register:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=wg_poll:10m       rate=600r/m;
limit_req_zone $binary_remote_addr zone=public_status:10m rate=1200r/m;
