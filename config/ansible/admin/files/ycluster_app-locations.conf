# app.<domain> self-service location bodies. Included by
# ycluster_app.conf.j2 (main vhost, listens on 127.0.0.2:443) and by
# the alt vhost admin-api-alt.conf.j2 (frp tunnel endpoint on
# 127.0.0.2:17443 with proxy_protocol). The IdP outpost plumbing
# (/outpost.goauthentik.io/ paths + @authentik_signin) lives in
# admin-api-authentik-outpost.conf and must be `include`d by the
# parent server block BEFORE this file — the auth_request error_page
# handler references @authentik_signin.

# The scheduling page + its data/set/stop-now APIs — forward-authed, then
# owner-scoped in Flask. POST covers the desired-state and stop-now writes.
location ^~ /admin/vm-schedule {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# Self-service Settings (the logged-in user's own SSH keys for VM
# access) — forward-authed, then scoped to that user's etcd record in
# Flask. POST covers the add/remove key writes.
location ^~ /admin/settings {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# Page assets (nav.js, alpine, favicon) — no secrets; served straight from
# Flask without the gate so the page can load them post-login.
location ^~ /static/ {
    limit_req zone=public_status burst=40 nodelay;
    proxy_pass http://127.0.0.1:12723;
    proxy_set_header Host $host;
}

# Anything else on this host bounces to the one page it serves — no other
# admin path is reachable via app.<domain>.
location / {
    return 302 /admin/vm-schedule;
}
