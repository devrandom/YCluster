# Root <domain> self-service location bodies. Included by ycluster.conf.j2,
# whose one server block serves both the plain :443 listener and the frp
# tunnel landing (127.0.0.2:17443 with proxy_protocol) from the same
# include. The IdP outpost plumbing (/outpost.goauthentik.io/ paths +
# @authentik_signin) lives in admin-api-authentik-outpost.conf and must be
# `include`d by the parent server block BEFORE this file — the auth_request
# error_page handler references @authentik_signin.

# Friendly 5xx page + /__smoke_50x operator smoke endpoint — shared across
# every forward-auth vhost (see friendly-50x.conf). Included here at server
# level, once.
include /etc/nginx/friendly-50x.conf;

# The root is a landing page linking the user-facing apps (chat.<domain>,
# zulip.<domain>, admin.<domain>). It also keeps serving the OpenAI-compatible
# inference API at /v1/ — clients and docs still point at the root domain for
# that endpoint now that Open WebUI itself moved to chat.<domain>.
# Forward-authed so Flask can gate the Admin link on admin/manager group.
location = / {
    limit_except GET HEAD { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# The scheduling page + its data/set/stop-now APIs — forward-authed, then
# owner-scoped in Flask. POST covers the desired-state and stop-now writes.
location ^~ /admin/vm-schedule {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# Self-service Settings (the logged-in user's own SSH keys for VM
# access) — forward-authed, then scoped to that user's etcd record in
# Flask. POST covers the add/remove key writes.
location ^~ /admin/settings {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# Page assets (nav.js, alpine, favicon) — no secrets; served straight from
# Flask without the gate so the page can load them post-login.
location ^~ /static/ {
    limit_req zone=public_status burst=40 nodelay;
    proxy_pass http://127.0.0.1:12723;
    proxy_set_header Host $host;
}

# ---- Inference API (at the root <domain>) ----
# The OpenAI-compatible inference API was served on the Open WebUI vhost
# when OWUI was still the root surface; since OWUI moved to chat.<domain>,
# local-ai-proxy is reached here at the root <domain> vhost. This is a
# plain `copy` with no `(( port ))` markers — it hardcodes the same
# 127.0.0.1:4001 upstreams, so it needs no templating. These blocks live
# only here (not on chat.<domain>).

# Internal auth subrequest: validates the client's Authorization
# against master key + Open-WebUI api_key table, returns X-User-Id
# and X-User-Groups (comma-separated OWUI group names).
location = /__auth {
    internal;
    proxy_pass http://127.0.0.1:4002/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;

    # Subrequests inherit client_max_body_size from this block, not
    # from the parent location. Without this, large /v1/ uploads
    # (audio transcription) hit 413 in the auth subrequest before
    # the body is ever proxied upstream.
    client_max_body_size 200M;
}

# Unauthenticated liveness for the inference stack, used by the
# blackbox inference-models probe. Proxies to local-ai-proxy, whose
# own /healthz in turn checks the auth service on :4002 and returns
# 503 when auth is down. Exact-match so it is never caught by /v1/ or /.
location = /healthz {
    proxy_pass http://127.0.0.1:4001/healthz;
}

# OpenAI-compatible inference API via local-ai-proxy.
# Users access this at https://<domain>/v1/ with their Open-WebUI API key.
location /v1/ {
    auth_request /__auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_groups $upstream_http_x_user_groups;

    # Strip client bearer; local-ai-proxy trusts identity headers from us.
    proxy_set_header Authorization "";
    proxy_set_header X-User-Id $user_id;
    proxy_set_header X-User-Groups $user_groups;

    proxy_pass http://127.0.0.1:4001/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for streaming (SSE / chunked transfer)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;

    # Long timeouts for inference requests. 30m accommodates audio
    # transcription of multi-hour files (whisperx returns one JSON
    # blob at the end — proxy_read_timeout caps the whole job).
    proxy_connect_timeout 30m;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;

    # Allow large inputs (embeddings, long prompts, audio uploads to
    # /v1/audio/transcriptions). Matches inference-internal.conf.
    client_max_body_size 200M;
}

# Anything else on this host bounces to the landing page — no other admin
# path is reachable via the root <domain>.
location / {
    # Absolute $host (no port) — same reason as @authentik_signin: alt
    # vhost listens on :17443, and nginx's default absolute_redirect
    # would bake that into the Location. Browser then dials a non-public
    # port and hangs.
    return 302 https://$host/;
}
