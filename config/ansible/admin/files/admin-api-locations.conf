# Admin service location blocks
# Serve static files from /var/www/html
location / {
    root /var/www/html;
    try_files $uri $uri/ =404;
}

# Cluster-internal callers do not get to assert mTLS identity; only the
# explicit NAT endpoint forwards nginx's verified value.
location = /api/health {
    proxy_pass http://127.0.0.1:12724;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSL-Client-Verify "";
}

# Common proxy settings for Flask app. /admin/ covers the dashboard pages
# (model-usage, vm-usage, vm-schedule) — identity-less here (cluster-
# internal callers are operator space); the public vhost serves the same
# paths behind forward-auth.
location ~ ^/(api/|status|static/|inventory|admin/) {
    proxy_pass http://127.0.0.1:12723;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSL-Client-Verify "";
}

location /ubuntu/ {
    alias /var/lib/tftpboot/ubuntu/;
    autoindex on;
}

location ~ ^/autoinstall/(user-data|meta-data)$ {
    proxy_pass http://127.0.0.1:12723$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSL-Client-Verify "";
}

location /autoinstall/ {
    alias /var/www/html/autoinstall/;
    autoindex on;
}

location /bootstrap/ {
    proxy_pass http://127.0.0.1:12723$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SSL-Client-Verify "";
}

location /assets/ {
    alias /var/www/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Grafana dashboard (read-only). See admin-api-grafana-proxy.conf.
location /grafana/ {
    include /etc/nginx/admin-api-grafana-proxy.conf;
}

