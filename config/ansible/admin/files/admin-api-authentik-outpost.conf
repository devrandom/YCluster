# Shared authentik embedded-outpost plumbing for forward-auth vhosts.
# Included by every host that gates pages behind the cluster IdP (the
# public admin locations and the app.<domain> vhost). The outpost picks
# the matching application/policy by the request Host, so the same plumbing
# serves admin.<domain> (admin-group gated) and app.<domain> (open to all
# enrolled users). authentik runs on the storage leader = the rathole
# tunnel node, so 127.0.0.1:9300 is correct wherever public traffic lands.

# Outpost endpoints used by the browser (login start, OAuth callback,
# sign-out). Must be publicly reachable.
location ^~ /outpost.goauthentik.io/ {
    limit_req zone=public_status burst=80 nodelay;
    proxy_pass http://127.0.0.1:9300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Subrequest target for auth_request — never exposed directly.
location = /outpost.goauthentik.io/auth/nginx {
    internal;
    proxy_pass http://127.0.0.1:9300;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
}

location @authentik_signin {
    # Only bounce top-level browser navigations to the IdP. SPA background
    # requests (fetch/XHR — Zulip's /json/events long-poll, the ComfyUI/OWUI
    # and app/admin API calls) must get a plain 401 when the outpost session
    # is stale: if we 302 them cross-origin to auth.<domain>
    # /application/o/authorize the browser enforces CORS on that OAuth
    # endpoint, and authentik deliberately sends no Access-Control-Allow-Origin
    # there (OAuth security BCP), so the background request dies with
    # "Cross-Origin Request Blocked" instead of letting the app recover. A
    # navigation carries Sec-Fetch-Mode: navigate and still redirects (re-login
    # on reload as before); fetches/XHR send cors/same-origin/other and get 401.
    if ($http_sec_fetch_mode != "navigate") {
        return 401;
    }
    # Build the redirect URL explicitly with $host (no port) instead of
    # relying on `absolute_redirect on`. The rathole-side vhost listens on
    # :443 (default HTTPS — browsers drop the port), but the frp alt vhost
    # listens on :17443 (internal — not publicly reachable). Letting nginx
    # auto-prefix $server_port would bake :17443 into the Location header
    # and the browser would hang trying to dial a non-public port.
    return 302 https://$host/outpost.goauthentik.io/start?rd=$scheme://$host$request_uri;
}
