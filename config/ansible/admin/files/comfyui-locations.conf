# ComfyUI location bodies. Included by comfyui_comfy.conf.j2 (main vhost,
# rathole endpoint on 127.0.0.2:443) and by the frp alt vhost
# admin-api-alt.conf.j2 (endpoint on 127.0.0.2:17443 with proxy_protocol),
# so both tunnels proxy identically. The backend marker below is substituted
# (ansible-side) by the install-comfyui.yml storage play and by
# install-frp-alt-vhost.yml before certbot-manager sees the file — same
# convention as the open-webui-locations.conf include. When no nvidia host
# sets `comfyui_backend_url`, the marker resolves to the 127.0.0.1:8188
# placeholder so nginx still loads; the comfy surface is simply unreachable
# (no comfy.<domain> cert) until one is set.
#
# ComfyUI is device-bound and NON-OpenAI: it speaks plain HTTP + WebSocket
# (the UI and workflow-submission channel use /ws and /prompt), and stays
# unauthenticated at the app — the IdP edge gate is the boundary, enforced
# here via the shared embedded-outpost forward-auth.
location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @authentik_signin;
    auth_request_set $authentik_email  $upstream_http_x_authentik_email;
    auth_request_set $authentik_uid    $upstream_http_x_authentik_uid;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;

    # WebSocket upgrade for /ws (UI + workflow submission /prompt).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Authentik-Email  $authentik_email;
    proxy_set_header X-Authentik-UID    $authentik_uid;
    proxy_set_header X-Authentik-Groups $authentik_groups;

    proxy_pass http://(( comfyui_locations_backend ));

    # NOTE: no trailing slash on proxy_pass. With a URI part (e.g. .../),
    # nginx forwards the *normalized* request URI, decoding %2F to a path
    # separator. ComfyUI serves saved workflows from /api/userdata/workflows/
    # and the frontend requests them as a single %2F-encoded path (e.g.
    # workflows%2Fr2v-mesh1.json); the decoded form breaks the route (404) and
    # the workflow fails to open. Omitting the URI passes the original
    # request-uri bytes through unchanged so %2F survives to the backend.

    # Video generation + VAE decode can take minutes; don't let nginx
    # kill long-polling / WS requests while a workflow is queued.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
