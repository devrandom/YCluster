# Authenticated admin-api location blocks (forward-auth via the cluster
# IdP). Served from the PUBLIC vhost: browsers get redirected through
# authentik's embedded outpost on first visit; authenticated requests
# reach the Flask app with X-Authentik-Email / X-Authentik-Groups set
# (via the shared admin-api-authentik-proxy.conf snippet). Access
# requires membership of the `ycluster-admins` group (policy bound to
# the application in authentik) — `ycluster user admin <email>`.
#
# NOTE: identity headers are an *external-user* authentication mechanism,
# not an internal privilege boundary — admin-api on :12723 stays directly
# reachable inside the cluster, where callers are root-equivalent anyway.
# The Flask app belt-and-suspenders this in two tiers (see
# _authentik_identity() in app.py):
#   1. The "no headers → admin" shortcut requires remote_addr to be
#      EXACTLY 127.0.0.1 AND no X-Authentik-UID set. UID is the
#      primary "is this authenticated?" signal — always present for
#      any authentik-authenticated user, including OAuth-sourced
#      accounts without a verified email. Using it (rather than email)
#      prevents an OAuth-no-email user from being mistaken for the
#      operator-space shortcut.
#   2. The forward-auth group check (admin and manager) requires
#      loopback (127.0.0.0/8) AND a UID set, so a remote cluster node
#      can't smuggle admin/manager headers.
# admin-api binds 0.0.0.0:12723 today; without these guards a remote
# cluster node reaching the Flask app directly would pass as admin.
#
# authentik runs on the storage leader, which is also the node the rathole
# tunnel lands on, so 127.0.0.1:9300 is correct wherever this vhost
# actually receives public traffic.

# --- forward-auth plumbing (shared with the app.<domain> vhost) -------------
include /etc/nginx/admin-api-authentik-outpost.conf;

# --- protected pages + their data APIs --------------------------------------

# Cluster status page + the comprehensive-status JSON it fetches.
location = /status {
    limit_except GET HEAD { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

location = /api/cluster-status {
    limit_except GET HEAD { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

location = /api/inventory {
    limit_except GET HEAD { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

location = /api/inventory/export.csv {
    limit_except GET HEAD { deny all; }
    limit_req zone=public_status burst=5 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

location ~ ^/api/inventory/(hardware|asset)/[^/]+$ {
    limit_except GET HEAD PUT POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}

# Grafana (anonymous read-only behind the gate; the Utilization kiosk at
# /admin/utilization iframes it and is covered by the /admin/ class).
# Proxies to grafana, not Flask, so the auth directives are inline.
location /grafana/ {
    limit_req zone=public_status burst=40 nodelay;
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @authentik_signin;
    include /etc/nginx/admin-api-grafana-proxy.conf;
}

# Pages under /admin/ (model-usage, vm-usage, vm-schedule + their data
# APIs). POST is for the vm-schedule desired-state writes — identity is
# nginx-enforced via the auth_request in the shared snippet.
location ^~ /admin/ {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=public_status burst=20 nodelay;
    include /etc/nginx/admin-api-authentik-proxy.conf;
}
