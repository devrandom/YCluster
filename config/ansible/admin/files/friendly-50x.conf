# Friendlier 5xx error page for the IdP-gated vhosts, shared across every
# forward-auth surface (chat, zulip, comfy, the root <domain> self-service
# page, and admin.<domain>). Include this file at server-block level from
# each vhost's top-level locations include, and reference /50x.html from the
# gated locations via `error_page 500 502 503 504 /50x.html;`.
#
# This defines, once:
#   - the internal /50x.html, served from the nginx webroot and EXEMPT from
#     the auth gate, so a user who hits a gate/backend 500 still gets a
#     clear path home; and
#   - the operator smoke endpoint /__smoke_50x, which forces a 500 through
#     the same error_page -> internal /50x.html path a real 500 uses.
#
# Both deliberately have no auth_request so they work even when logged out.
# /__smoke_50x is rate-limited with the shared public_status zone (defined
# in admin-api-ratelimit.conf) to keep it from adding to scanner noise.
# The 50x.html file itself is installed by setup-web-services.yml to
# /usr/share/nginx/html/50x.html.
location = /50x.html {
    internal;
    root /usr/share/nginx/html;
}

location = /__smoke_50x {
    limit_req zone=public_status burst=10 nodelay;
    error_page 500 502 503 504 /50x.html;
    return 500;
}
