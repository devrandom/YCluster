# Stage Open WebUI location bodies. Included by open-webui.conf.j2 for
# named instances only. The stage instance has no edge forward-auth gate;
# Open WebUI's own login form is the credential gate.
#
# The `(( port ))` marker is substituted by the install-open-webui.yml /
# setup-web-services.yml render step.
#
# This file carries only the OWUI `location /` plus the pre-auth surface OWUI
# needs. The cluster inference API (`/v1/`) and its `/healthz` probe live at
# the root <domain> vhost, not on the stage host.

include /etc/nginx/friendly-50x.conf;

location ^~ /static/ {
    error_page 500 502 503 504 /50x.html;
    proxy_pass http://127.0.0.1:(( port ))/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(oauth/.*|manifest\.json|opensearch\.xml|health|ready)(/.*)?$ {
    error_page 500 502 503 504 /50x.html;
    proxy_pass http://127.0.0.1:(( port ));
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    error_page 500 502 503 504 /50x.html;

    proxy_pass http://127.0.0.1:(( port ))/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Increase timeouts for long-running requests
    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
}
