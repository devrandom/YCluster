# Open WebUI location bodies. Included by open-webui.conf.j2, whose one
# server block serves both the plain :443/:80 listener and the frp tunnel
# landing (127.0.0.2:17443 with proxy_protocol) from the same include.
# The `(( port ))` marker is substituted by the install-open-webui.yml
# render step (or by setup-web-services.yml for this include) — same
# pattern as the inline version used to have.
#
# This file carries only the OWUI `location /`. The cluster's OpenAI-
# compatible inference API (`/v1/`) and its `/healthz` liveness probe live
# at the root <domain> vhost (ycluster_app-locations.conf), not on
# chat.<domain> — that `/v1/` mount here was a vestige from when OWUI
# itself served the root vhost. local-ai-proxy is reached via the root.

# Proxy to Open WebUI, edge-gated by the cluster IdP's embedded-outpost
# forward-auth (the same boundary as ComfyUI / admin-api: auth_request
# before any bytes reach the app). The app itself is OIDC-backed; the IdP
# edge gate is what keeps unauthenticated pre-auth bytes off the whole
# chat.<domain> surface — not the disabled local login form. The outpost
# plumbing (login redirect, OAuth callback, auth subrequest) is included
# by the parent server block via admin-api-authentik-outpost.conf.
location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @authentik_signin;
    auth_request_set $authentik_email  $upstream_http_x_authentik_email;
    auth_request_set $authentik_uid    $upstream_http_x_authentik_uid;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;

    proxy_pass http://127.0.0.1:(( port ))/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Authentik-Email  $authentik_email;
    proxy_set_header X-Authentik-UID    $authentik_uid;
    proxy_set_header X-Authentik-Groups $authentik_groups;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Increase timeouts for long-running requests
    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
}
