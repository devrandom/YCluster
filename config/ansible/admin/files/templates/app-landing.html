<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YCluster Apps</title>
    <script src="/static/nav.js" defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            background: #f5f6f8;
            color: #1f2328;
        }
        .wrap { max-width: 880px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
        header { border-bottom: 1px solid #d8dce1; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        .tagline { color: #59636e; font-size: 0.9rem; margin-top: 0.25rem; }
        ul.links { list-style: none; margin: 0; padding: 0; background: white;
                   border: 1px solid #d8dce1; border-radius: 6px; }
        ul.links li { border-bottom: 1px solid #eef0f2; }
        ul.links li:last-child { border-bottom: none; }
        ul.links a {
            display: flex; gap: 1rem; align-items: center;
            padding: 0.6rem 1rem; text-decoration: none; color: inherit;
        }
        ul.links a:hover { background: #f0f4fa; }
        .logo { width: 24px; height: 24px; flex: 0 0 auto; }
        .name { font-weight: 600; min-width: 11rem; color: #0a5dc2; }
        .desc { color: #59636e; font-size: 0.875rem; }
        h2 {
            font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em; color: #59636e;
            margin: 1.75rem 0 0.5rem;
        }
        footer { margin-top: 2.5rem; color: #8a929b; font-size: 0.8rem; }
        #yc-nav { max-width: 880px; margin: 1.25rem auto -0.75rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>YCluster</h1>
            <div class="tagline">Your apps</div>
        </header>

        <h2>Applications</h2>
        <ul class="links">
            {% for app in apps %}
            <li><a href="{{ app.url }}">
                <img class="logo" src="{{ app.logo }}" alt="">
                <span class="name">{{ app.name }}</span>
                <span class="desc">{{ app.desc }}</span>
            </a></li>
            {% endfor %}
        </ul>

        <footer>YCluster — app shell. Links open in the same tab.</footer>
    </div>
</body>
</html>
