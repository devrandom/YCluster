# Alt vhost for the parallel frp run. frpc forwards external traffic
# to 127.0.0.2 on the alt ports (17080 / 17443), and frps uses PROXY
# protocol v2 — so unlike the rathole-side public vhost, this one
# picks up real client IPs and rate-limit zones can drop back to
# per-client semantics. See todo/networking/switch-rathole-to-frp.md
# and docs/design/frp-migration.md.
#
# This file is the experimental twin of the public vhost in
# admin-api.conf.j2. It only includes paths that are useful for
# parallel-run validation: the public whitelist (wg bootstrap +
# read-only status) so we can exercise end-to-end traffic; the
# authed-locations include is commented out because forward-auth
# requires the cluster IdP path which is identical to the rathole
# side — testing it through both vhosts adds no signal.
#
# Removed wholesale at cleanup step 6 of the frp migration plan.

# HTTP - PUBLIC ALT (frp tunnel endpoint on 127.0.0.2:17080).
server {
    # proxy_protocol on the listen directive enables PROXY-protocol
    # parsing — required for the `real_ip_header proxy_protocol;` line
    # below to actually see real client IPs. Without it, nginx reads
    # the v2 signature bytes as the request itself and returns 400
    # (visible in the access log as `"\x00" 400 ...`).
    listen 127.0.0.2:17080 proxy_protocol;
    server_name _;

    # PROXY protocol v2 from frps — picks up real client IPs. Trust
    # the loopback bind: only the local frpc can reach 127.0.0.2.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Public whitelist only — same scope as the rathole-side public vhost.
    include /etc/nginx/admin-api-public-locations.conf;

    location / {
        return 404;
    }
}

# HTTPS - PUBLIC ALT (frp tunnel endpoint on 127.0.0.2:17443).
server {
    # See the HTTP block above — proxy_protocol on the listen directive
    # is required, not just real_ip_header.
    listen 127.0.0.2:17443 ssl http2 proxy_protocol;
    server_name _;

    # Reuses the same cert/key as the production public vhost — this
    # alt vhost only exists for parallel-run validation, not for
    # serving a separate external hostname.
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    limit_req_status 429;

    include /etc/nginx/admin-api-public-locations.conf;

    location / {
        return 404;
    }
}
