# Shared proxy directives for /karma/.
#
# Karma rejects any request that does not carry its configured identity
# header (X-Authentik-UID), so every including location adds that header
# itself: the Authentik UID on the public vhost, a fixed `internal` value on
# the cluster-internal one (which has no forward-auth). The header cannot be
# set in this snippet, because the public value comes from auth_request_set
# and is only available at proxy time.
#
# Karma listens with listen.prefix: /karma/, so the URI is passed through
# unchanged.
proxy_pass http://127.0.0.1:8080;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
