---
# Install the custom-built podman binary, replacing the distro package.
# The distro podman package and its stock units are removed; its runtime
# dependencies (crun, netavark, aardvark-dns, containers-common, etc.) are
# kept installed (via `apt install`, which also marks them manually installed)
# so `apt autoremove` never reclaims them.
# Only /usr/bin/podman is swapped out for the custom build; the distro
# binary's dead dpkg diversion is cleaned up after podman is purged.
#
# Run admin/build-podman.yml first to produce the binary on the buildhost.
- name: Install custom podman binary
  hosts: compute
  become: yes
  vars:
    podman_binary_src: "/opt/src/podman/bin/podman"
    podman_binary: "/usr/bin/podman"
    podman_binary_distrib: "/usr/bin/podman.distrib"
    # Built by the same play (build-podman.yml). Quadlet is a separate binary
    # and is useless without the two generator symlinks below; rootlessport is
    # what rootless `-p` port publishing execs.
    podman_build_dir: "/opt/src/podman"
    podman_extra_binaries:
      - name: quadlet
        src: "{{ podman_build_dir }}/bin/quadlet"
      - name: rootlessport
        src: "{{ podman_build_dir }}/bin/rootlessport"
    podman_libexec: "/usr/libexec/podman"
    podman_system_generators: "/usr/lib/systemd/system-generators"
    podman_user_generators: "/usr/lib/systemd/user-generators"
    podman_selftest_dir: "/tmp/podman-quadlet-selftest"
    # Runtime deps pulled in by the distro podman package that the custom
    # binary still needs. Ensured present with `apt install` (which marks them
    # manual) so the purge/autoremove pass doesn't reclaim them. (From
    # `apt-get -s purge podman`.)
    podman_apt_deps:
      - aardvark-dns
      - buildah
      - catatonit
      - conmon
      - containernetworking-plugins
      - crun
      - fuse-overlayfs
      - golang-github-containers-common
      - golang-github-containers-image
      - libyajl2
      - netavark
      - passt
      - slirp4netns

  tasks:
    - name: Check the podman, quadlet and rootlessport binaries on buildhost
      stat:
        path: "{{ item }}"
      register: podman_buildhost
      loop: >-
        {{ [podman_binary_src] + (podman_extra_binaries | map(attribute='src') | list) }}
      delegate_to: "{{ buildhost }}"

    - name: Fail if a build artifact is missing on the buildhost
      fail:
        msg: >
          {{ item.item }} is missing on {{ buildhost }}. Podman, quadlet and
          rootlessport are all built by admin/build-podman.yml; run it first.
      loop: "{{ podman_buildhost.results }}"
      when: not item.stat.exists

    - name: Install runc (supports OCI spec 1.2.x generated by podman 5.x)
      apt:
        name: runc
        state: present

    - name: Ensure containers.conf.d directory exists
      file:
        path: /etc/containers/containers.conf.d
        state: directory
        mode: '0755'

    - name: Set runc as the default OCI runtime
      copy:
        dest: /etc/containers/containers.conf.d/99-default-runtime.conf
        content: |
          [engine]
          runtime = "runc"
        mode: '0644'
        owner: root
        group: root

    - name: Fetch the podman build artifacts to the controller
      fetch:
        src: "{{ item }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      loop:
        "{{ [podman_binary_src] + (podman_extra_binaries | map(attribute='src') | list) }}"
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Gather apt package facts (detect distro podman)
      package_facts:
        manager: apt

    - name: Record whether the distro podman package is installed
      set_fact:
        podman_apt_installed: "{{ 'podman' in ansible_facts.packages }}"

    - name: Divert distro podman binary out of the way
      command:
        cmd: dpkg-divert --divert {{ podman_binary_distrib }}
                         --rename
                         --add {{ podman_binary }}
        creates: "{{ podman_binary_distrib }}"
      when: podman_apt_installed

    - name: Copy custom podman binary into place
      copy:
        src: "{{ build_cache_dir }}/podman"
        dest: "{{ podman_binary }}"
        mode: '0755'
        owner: root
        group: root

    - name: Verify installed custom podman version
      command: "{{ podman_binary }} --version"
      register: podman_version
      changed_when: false

    - name: Display podman version
      debug:
        msg: "Installed {{ podman_version.stdout }}"

    - name: Ensure podman runtime dependencies are installed (apt install marks them manual)
      apt:
        name: "{{ podman_apt_deps }}"
        state: present

    # Purging podman also removes and stops its package-owned
    # podman-auto-update.{service,timer} units (the failing nv4 unit), so no
    # separate systemd stop is needed.
    - name: Remove the distro podman package (custom binary replaces it)
      apt:
        name: podman
        state: absent
        purge: yes

    - name: Remove dead diversion of the purged distro podman binary
      command: "dpkg-divert --remove {{ podman_binary }}"
      register: podman_divert_remove
      changed_when: podman_divert_remove.rc == 0
      failed_when: podman_divert_remove.rc not in [0, 1]

    - name: Ensure leftover distro podman binary is removed
      file:
        path: "{{ podman_binary_distrib }}"
        state: absent

    - name: Confirm custom podman binary is still in place
      command: "{{ podman_binary }} --version"
      register: podman_version_final
      changed_when: false

    - name: Display final podman version
      debug:
        msg: "Final custom podman: {{ podman_version_final.stdout }}"

    # quadlet is a separate binary; upstream installs it to libexec together
    # with the two systemd generator symlinks (see `install.bin` in podman's
    # Makefile). Skipping them leaves `.container` units silently inert.
    # This runs after the distro package is purged on purpose: those helper
    # paths are dpkg-owned in the distro package, so installing them earlier
    # would let the purge delete them again.
    - name: Install the quadlet and rootlessport helpers
      copy:
        src: "{{ build_cache_dir }}/{{ item.name }}"
        dest: "{{ podman_libexec }}/{{ item.name }}"
        mode: '0755'
        owner: root
        group: root
      loop: "{{ podman_extra_binaries }}"
      register: podman_helpers

    - name: Link the quadlet generator into the systemd generator dirs
      file:
        src: "{{ podman_libexec }}/quadlet"
        dest: "{{ item.dir }}/{{ item.name }}"
        state: link
        force: yes
        owner: root
        group: root
      register: podman_generators
      loop:
        - dir: "{{ podman_system_generators }}"
          name: podman-system-generator
        - dir: "{{ podman_user_generators }}"
          name: podman-user-generator

    # Quadlet reads system-scoped .container/.volume/.network files from here.
    # The distro package creates it and this fleet purges that package, so a
    # system quadlet would otherwise fail to install (missing parent directory).
    - name: Ensure the system quadlet directory exists
      file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Re-run the systemd generators with quadlet in place
      systemd:
        daemon_reload: yes
      when: podman_generators.changed | default(false)

    - name: Prove the installed quadlet renders units against the installed podman
      block:
        - name: Create the quadlet self-test directory
          file:
            path: "{{ podman_selftest_dir }}"
            state: directory
            mode: '0755'

        - name: Stage a quadlet self-test unit
          copy:
            dest: "{{ podman_selftest_dir }}/probe.container"
            content: |
              [Unit]
              Description=quadlet install check
              [Container]
              Image=example.invalid/probe:latest
              Exec=/bin/true
            mode: '0644'

        - name: Render the self-test unit
          command:
            cmd: >-
              env QUADLET_UNIT_DIRS={{ podman_selftest_dir }}
              {{ podman_libexec }}/quadlet -user -dryrun
          register: podman_quadlet_selftest
          changed_when: false
          failed_when: >-
            ('ExecStart=' ~ podman_binary ~ ' run') not in podman_quadlet_selftest.stdout
      always:
        - name: Remove the quadlet self-test unit
          file:
            path: "{{ podman_selftest_dir }}"
            state: absent
