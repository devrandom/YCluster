---
# Deploy DeepSeek-V4-Flash-0731 DSpark inference scripts to Nvidia GPU nodes.
# The release and its validation gate are documented at:
#   https://github.com/local-inference-lab/rtx6kpro/blob/master/models/ds4dspark-v20.md
# Two dev scripts (the dev user has no sudo, and needs none for these):
#   ~dev/bin/ds4-setup.sh   - pull the Gilded Gnosis r16 image, smoke-test
#                             GPU passthrough (CDI), stage/verify the 0731
#                             checkpoint. Flags:
#                               --download     pull the 0731 checkpoint (~160 GB)
#                               --verify-only  just check the staged revision
#   ~dev/bin/ds4-start.sh   - (re)launch the DSpark server, e.g. after reboot
#
# Model: deepseek-ai/DeepSeek-V4-Flash-0731 at the r16-pinned SHA
# (ds4_revision). Native FP4+FP8 mix — MoE experts are FP4, attention/norm/
# router are FP8. ~160GB on disk. The 0731 release is NOT the same weights
# as the standard deepseek-ai/DeepSeek-V4-Flash — it drops `enorm`/`hnorm`
# keys and adds DSpark config fields, which the r16 image's DSpark
# speculator's load_weights is keyed against. Sticking to the pinned SHA is
# required (different revisions break the r16 gate). We do NOT use
# nvidia/DeepSeek-V4-Flash-NVFP4: the fork we use runs the upstream
# mixed-precision checkpoint directly (the NVIDIA re-quantization buys
# nothing on this fork).
#
# Image: voipmonitor/vllm:gilded-gnosis-v20-...-r16 — the Gilded Gnosis r16
# DSpark release. Composes vLLM + SparkInfer (B12X backend) + CUTLASS +
# FlashInfer + DeepGEMM + InstantTensor + LMCache + patched NCCL, all compiled
# for sm_120a Blackwell on CUDA 13.2 (driver 610). The validated K5 DSpark
# profile delivers ~218 t/s sustained single-stream decode, ~290 t/s coding
# median on the 2×RTX PRO 6000 topology (TP2/DCP1). Defaults: 5 draft tokens,
# InstantTensor (BUFFERED) loader, 128K context, 0.975 GPU util.
#
# Host prerequisites (podman + nvidia CDI) are generic and live in
# setup-gpu-podman.yml. The r16 image's built-in launcher bundles
# tokenizer/reasoning/tool modes (deepseek_v4) so there is nothing extra
# to ship.
#
# Gating:
#   Per-host `ds4_enabled: true` in host_vars/<node>.yml opts into this play.
#   Same pattern as glm52_enabled (install-glm52.yml). The play is a no-op on
#   nvidia hosts that don't opt in, and on nvidia hosts with no host-visible
#   GPU (all cards bound to vfio-pci — those go to install-glm52-exl3-tr3.yml
#   instead, which uses a VM).
#
#   Per-host `ds4_gpus: "<space-separated CDI indices>"` selects the GPUs this
#   container uses. Exact CDI indices are deployment-specific, so DS4 hosts
#   must set this explicitly in private per-host vars (no public default).
#
#   Per-host `ds4_port: <port>` (default 9216) overrides the listening port.
#
#   Per-host `ds4_served_name: "<name>"` (default "deepseek-v4-flash") is the
#   gateway routing key (what clients pass as `model:` in API calls). The
#   inner vllm serve also takes it via --served-model-name.
#
# Run after install-incus.yml (Incus + bridge), setup-gpu-podman.yml (podman +
# CDI). To bring the server up:
#   ssh <host>.yc
#   ~/bin/ds4-setup.sh --download   # pull image + CDI smoke + 0731 checkpoint
#   ~/bin/ds4-setup.sh              # subsequent runs: just image pull + smoke
#   ~/bin/ds4-start.sh              # launch (idempotent)

- name: Deploy DeepSeek-V4-Flash inference scripts to Nvidia GPU nodes
  hosts: nvidia
  become: yes
  vars:
    # ---- Cluster-wide (not per-host overridable) -----------------------
    # voipmonitor/vllm:gilded-gnosis-v20-...-r16 — the Gilded Gnosis r16 DSpark
    # release. Ships vLLM + SparkInfer (B12X) + CUTLASS + FlashInfer + DeepGEMM
    # + InstantTensor + LMCache + patched NCCL on CUDA 13.2 (driver 610).
    # Pinned tag + sha256 from the release document
    # (ds4dspark-v20.md in the rtx6kpro wiki). The r16 gate validates K5 DSpark,
    # InstantTensor (BUFFERED), native offload, and full source-provenance
    # reproduction.
    ds4_image: "docker.io/voipmonitor/vllm:gilded-gnosis-v20-vllm1e9c9c3-sieec30ff-fi801d57a-cu132-20260731-r16"
    # Infernal Invocation r4 image — the ALONGSIDE long-context qualification
    # container (launched by ~/bin/ds4-infernal-start.sh as `ds4-infernal`, separate port /
    # served name, never replaces the r16 `ds4-dspark` service). Same 0731
    # checkpoint. The only line carrying the #298 silent-corruption fix (a FULL
    # CUDA-graph prompt-state alias that corrupts DSpark K5 output at long
    # context). cu133/torch2.13 — driver-610 probe passed on the DS4 host. See
    # docs/inference/deepseek-v4-flash-0731-dspark.md.
    ds4_infernal_image: "docker.io/voipmonitor/vllm:infernal-invocation-vllm3226eb7-b12x1584743-fi1ac6942-cu133-torch213-20260812-r4"
    # Native FP4+FP8 mixed checkpoint. The 0731 release is the r16 validation
    # target (K5 DSpark profile, ~218 t/s sustained decode on the 2×RTX PRO
    # 6000 Blackwell topology). The release SHA is pinned — different
    # revisions can rename weight keys or change config.json fields, breaking
    # the r16 image's DSpark speculator's load_weights (we hit this once with
    # `mtp.0.enorm.weight` disappearing from the 0731 release's safetensors).
    ds4_repo: "deepseek-ai/DeepSeek-V4-Flash-0731"
    ds4_revision: "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
    # Local dir basename stays `DeepSeek-V4-Flash` (no `-0731` suffix) so the
    # r16 launcher's /root/models scan finds it under the standard name. The
    # HF repo name and the local dir name are decoupled — ds4-setup.sh's
    # `hf download` writes the HF repo's files into this dir directly.
    ds4_model_dir: "/home/dev/models/DeepSeek-V4-Flash"
    # Gateway routing key. Lowercased (proxy convention; GLM-5.2 EXL3 TR3 also
    # uses "glm-5.2" not the upstream repo id).
    ds4_served_name: "deepseek-v4-flash"
    # Port the container listens on inside the host (--network=host, so the
    # host's port 9216 is the API endpoint reachable at http://<host>.xc:9216).
    # 9212=b12x, 9213=FullKD (retired), 9214=EXL3 TR3, 9215=spare, 9216=DS4.
    ds4_port: 9216
    # Persistent JIT/autotune cache. The r16 launcher writes FlashInfer autotune
    # tables, DeepGEMM warmup, and CUDA-graph capture artifacts here on first
    # run (~5 min warmup); reusing the volume avoids the recompile on subsequent
    # launches. Mounted at /cache (and /container-tmp) inside the container.
    ds4_cache_dir: "/home/dev/.cache/ds4-r16"
    # GPU list is sourced from host_vars (<node>.yml: ds4_gpus) with no public
    # default: CDI indices are deployment-specific and must be pinned in the
    # private per-host vars. A play-level default would both leak those pins
    # and shadow host_vars under Ansible precedence.
  tasks:
    # Same guard as install-glm52.yml: skip nodes with no host-visible NVIDIA
    # GPU (no NVIDIA hardware, or all cards bound to vfio-pci for passthrough).
    # DS4 runs on the bare host like b12x — those nvidia hosts go to
    # install-glm52-exl3-tr3.yml (the VM path) instead.
    - name: End play for nodes with no host-visible NVIDIA GPU
      meta: end_host
      when: (ansible_local.gpu.nvidia_host_gpu_count | default(0) | int) == 0

    # Per-host opt-in: only DS4-designated nodes run this play.
    - name: End play for nodes that have not opted into DS4
      meta: end_host
      when: not (ds4_enabled | default(false))

    - name: Ensure ~dev/bin exists
      file:
        path: /home/dev/bin
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    - name: Install DS4 dev inference scripts into ~dev/bin
      template:
        src: "{{ item }}.j2"
        dest: "/home/dev/bin/{{ item }}"
        owner: dev
        group: dev
        mode: '0755'
      loop:
        - ds4-setup.sh
        - ds4-start.sh
        - ds4-infernal-start.sh

- name: Register the DS4 backend with local-ai-proxy
  hosts: storage
  become: yes
  vars:
    # Mirror the EXL3 TR3 storage play: local-ai-proxy etcd-watches
    # /cluster/config/inference/models/ and hot-reloads on add/remove — no
    # proxy restart needed. The backend URL is the opted-in nvidia host on
    # its DS4 port. Default host is nv4 (today's b12x + EXL3 TR3 node, and
    # the most likely DS4 host once an operator sets ds4_enabled there); a
    # different opted-in host overrides via the set_fact below.
    ds4_nvidia_host: nv4
    ds4_backend_url: "http://{{ ds4_nvidia_host }}.xc:{{ hostvars[ds4_nvidia_host]['ds4_port'] | default(9216) }}"
    ds4_served_name: "{{ hostvars[ds4_nvidia_host]['ds4_served_name'] | default('deepseek-v4-flash') }}"
  tasks:
    - name: Check if this host is the storage leader
      shell: mountpoint -q /rbd/user
      register: rbd_user_mounted
      failed_when: false
      changed_when: false

    - name: Set storage leader fact
      set_fact:
        is_storage_leader: "{{ rbd_user_mounted.rc == 0 }}"

    - name: Resolve the DS4-enabled nvidia host
      set_fact:
        ds4_nvidia_host: >-
          {{ (groups['nvidia']
              | select('in', hostvars.keys())
              | list)
             | map('extract', hostvars, 'ds4_enabled')
             | zip(groups['nvidia'] | select('in', hostvars.keys()) | list)
             | selectattr(0, 'defined')
             | selectattr(0, 'equalto', true)
             | map(attribute=1)
             | first
             | default('nv4') }}
      when: is_storage_leader
      # Picks the first nvidia host that defines ds4_enabled=true in
      # host_vars. Defaults to nv4 (today's cluster) so a future host that
      # only sets the opt-in without overriding the URL will register
      # correctly.

    - name: Register the DS4 backend with local-ai-proxy
      command: >-
        ycluster inference add {{ ds4_backend_url }} {{ ds4_served_name }}
      register: ds4_proxy_register
      changed_when: "'added' in ds4_proxy_register.stdout or 'registered' in ds4_proxy_register.stdout"
      when:
        - is_storage_leader
        - not ansible_check_mode
      # Idempotent on subsequent runs: local-ai-proxy models add is a
      # no-op when the (backend, model) pair is already registered.

    - name: Smoke check the DS4 backend through local-ai-proxy
      uri:
        url: "http://127.0.0.1:4001/v1/models"
        return_content: no
        status_code: [200, 401, 404]
      register: proxy_smoke
      failed_when: false
      retries: 5
      delay: 1
      until: proxy_smoke.status is defined
      when:
        - is_storage_leader
        - not ansible_check_mode

    - name: Report smoke check
      debug:
        msg: >-
          local-ai-proxy on {{ inventory_hostname }}:4001 replied
          {{ proxy_smoke.status | default('unreachable') }};
          DS4 backend registered at {{ ds4_backend_url }}
          (served: {{ ds4_served_name }})
      when:
        - is_storage_leader
        - not ansible_check_mode
