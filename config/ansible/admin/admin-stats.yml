---
- name: Setup usage stats infrastructure
  hosts: storage
  become: yes
  vars:
    admin_services_dir: /opt/admin-services
  environment: "{{ etcd_client_env }}"

  tasks:
    - name: Check if storage leader
      command: mountpoint -q /rbd/user
      register: rbd_mounted
      failed_when: false
      changed_when: false

    - set_fact:
        is_storage_leader: "{{ rbd_mounted.rc == 0 }}"

    - name: Generate usage_stats password in etcd (idempotent - only writes if missing)
      shell: |
        python3 -c "
        import secrets
        from ycluster.common.etcd_utils import get_etcd_client
        client = get_etcd_client()
        val = client.get('/cluster/config/usage_stats/db-password')[0]
        if val is not None:
            print('exists')
        else:
            client.put('/cluster/config/usage_stats/db-password', secrets.token_urlsafe(24))
            print('created')
        "
      changed_when: false
      run_once: yes

    - name: Copy provisioning script
      copy:
        src: files/provision-usage-stats.py
        dest: /usr/local/bin/provision-usage-stats
        mode: '0755'
      when: is_storage_leader

    - name: Run provisioning on storage leader
      command: /usr/local/bin/provision-usage-stats
      when: is_storage_leader

    - name: Copy collect-model-stats script
      copy:
        src: files/collect-model-stats.py
        dest: /usr/local/bin/collect-model-stats
        mode: '0755'

    - name: Create systemd service for collect-model-stats
      copy:
        dest: /etc/systemd/system/collect-model-stats.service
        content: |
          [Unit]
          Description=Collect model usage stats from local-ai-proxy logs
          After=network.target

          [Service]
          Type=oneshot
          EnvironmentFile=/etc/ycluster/etcd-client.env
          Environment="http_proxy="
          Environment="https_proxy="
          Environment="HTTP_PROXY="
          Environment="HTTPS_PROXY="
          ExecStart=/usr/local/bin/collect-model-stats
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      notify: restart collect-model-stats

    - name: Create systemd timer for collect-model-stats
      copy:
        dest: /etc/systemd/system/collect-model-stats.timer
        content: |
          [Unit]
          Description=Run collect-model-stats every 30 seconds

          [Timer]
          OnBootSec=15s
          OnUnitActiveSec=30s
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: restart collect-model-stats

    - name: Enable and start collect-model-stats timer
      systemd:
        name: collect-model-stats.timer
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Copy collect-vm-stats script
      copy:
        src: files/collect-vm-stats.py
        dest: /usr/local/bin/collect-vm-stats
        mode: '0755'

    - name: Create systemd service for collect-vm-stats
      copy:
        dest: /etc/systemd/system/collect-vm-stats.service
        content: |
          [Unit]
          Description=Drain VM lifecycle events and sample running instances
          After=network.target

          [Service]
          Type=oneshot
          EnvironmentFile=/etc/ycluster/etcd-client.env
          ExecStart=/usr/local/bin/collect-vm-stats
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      notify: restart collect-vm-stats

    - name: Create systemd timer for collect-vm-stats
      copy:
        dest: /etc/systemd/system/collect-vm-stats.timer
        content: |
          [Unit]
          Description=Run collect-vm-stats every 2 minutes

          [Timer]
          OnBootSec=60s
          OnUnitActiveSec=120s
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: restart collect-vm-stats

    - name: Enable and start collect-vm-stats timer
      systemd:
        name: collect-vm-stats.timer
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Create systemd service for vm-idle-alert
      copy:
        dest: /etc/systemd/system/vm-idle-alert.service
        content: |
          [Unit]
          Description=Alert VM owners about GPU instances idle for over a day
          After=network.target
          # The report queries the central Prometheus; only the leader
          # should evaluate and alert, or every storage node would notify.
          ConditionPathIsMountPoint=/rbd/user

          [Service]
          Type=oneshot
          EnvironmentFile=/etc/ycluster/etcd-client.env
          ExecStart=/usr/local/bin/ycluster vm idle --notify
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      notify: restart vm-idle-alert

    - name: Create systemd timer for vm-idle-alert
      copy:
        dest: /etc/systemd/system/vm-idle-alert.timer
        content: |
          [Unit]
          Description=Run vm-idle-alert hourly

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: restart vm-idle-alert

    - name: Enable and start vm-idle-alert timer
      systemd:
        name: vm-idle-alert.timer
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart collect-model-stats
      systemd:
        name: collect-model-stats.timer
        state: restarted

    - name: restart collect-vm-stats
      systemd:
        name: collect-vm-stats.timer
        state: restarted

    - name: restart vm-idle-alert
      systemd:
        name: vm-idle-alert.timer
        state: restarted
