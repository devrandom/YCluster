---
# Make Nvidia GPU nodes ready to run rootless GPU containers as the dev user
# (podman + nvidia CDI). Generic prerequisite for any containerised inference
# backend (e.g. the MiniMax-M3 b12x image, see install-minimax-m3.yml).
# Run after setup-base-compute.yml (which creates the dev user).
- name: Set up rootless podman + nvidia CDI on GPU nodes
  hosts: nvidia
  become: yes
  tasks:
    # Podman is required unconditionally (non-GPU container loads too, and
    # hosts like all-cards-vfio hosts may gain host-visible GPUs later when
    # config changes). Distro podman 4.9.3 cannot parse the CDI 0.7.0 specs
    # generated by recent nvidia-container-toolkit; admin/install-podman.yml
    # (runs earlier in admin.yml) installs the required custom binary.
    - name: Require custom podman 5.x
      command: podman --version
      register: setup_gpu_podman_version
      changed_when: false
      failed_when: >
        setup_gpu_podman_version.rc != 0 or
        setup_gpu_podman_version.stdout is not match('^podman version 5\\.')

    # Same guard as install-vllm.yml: skip CDI setup on nodes with no
    # host-visible NVIDIA GPU (no NVIDIA hardware, or all cards bound to
    # vfio-pci for passthrough). The second play below clears stale specs
    # on those hosts.
    - name: End CDI setup for nodes with no host-visible NVIDIA GPU
      meta: end_host
      when: (ansible_local.gpu.nvidia_host_gpu_count | default(0) | int) == 0

    - name: Generate nvidia CDI spec
      command: nvidia-ctk cdi generate --device-name-strategy=index --output=/etc/cdi/nvidia.yaml
      changed_when: true

    - name: Remove stale runtime CDI spec
      file:
        path: /var/run/cdi/nvidia.yaml
        state: absent

    # Lets the dev user's rootless podman containers keep running after logout
    # and start a user manager at boot.
    - name: Enable systemd lingering for dev
      command: loginctl enable-linger dev
      args:
        creates: /var/lib/systemd/linger/dev

# Hosts whose NVIDIA cards are all bound to vfio-pci (VM passthrough) have no
# host-visible GPU. Any CDI spec left over from a previous all-cards-in-host
# state is stale: it references /dev/nvidiaN nodes that no longer exist and
# makes podman fail confusingly. Remove it; the runbook regenerates it when
# cards are returned to the host driver
# (docs/operations/cdi-spec-regen.md).
- name: Remove stale nvidia CDI spec on hosts with no host-visible GPUs
  hosts: nvidia
  become: yes
  tasks:
    - name: End play for nodes with host-visible NVIDIA GPUs
      meta: end_host
      when: (ansible_local.gpu.nvidia_host_gpu_count | default(0) | int) != 0

    - name: Remove stale system CDI spec
      file:
        path: /etc/cdi/nvidia.yaml
        state: absent

    - name: Remove stale runtime CDI spec
      file:
        path: /var/run/cdi/nvidia.yaml
        state: absent
