---
- name: Install amtterm_ssl on storage nodes
  hosts: storage
  become: yes
  vars:
    amtterm_version: 8ba47278ec726a02fb039a87462311094be36ca3
  tasks:
    - name: Install build dependencies
      apt:
        name:
          - git
          - build-essential
          - libssl-dev
          - pkg-config
        state: present
        update_cache: yes

    - name: Create source directory
      file:
        path: /opt/src
        state: directory
        mode: '0755'

    - name: Clone amtterm_ssl repository
      git:
        repo: https://github.com/jerryabramson/amtterm_ssl.git
        dest: /opt/src/amtterm_ssl
        version: "{{ amtterm_version }}"
        force: yes

    # Idempotence is keyed on the pinned SHA so a version bump forces a
    # rebuild/reinstall; a bare binary-existence check would silently keep
    # the old build on hosts that already have it.
    - name: Check installed amtterm_ssl version
      command: cat /opt/src/amtterm_ssl/.ansible-version
      register: amtterm_installed
      changed_when: false
      failed_when: false

    - name: Rebuild and reinstall amtterm_ssl when the pinned SHA changes
      when: amtterm_installed.stdout | default('') != amtterm_version
      block:
        - name: Build amtterm_ssl
          command: make
          args:
            chdir: /opt/src/amtterm_ssl

        - name: Install amtterm_ssl
          command: make install
          args:
            chdir: /opt/src/amtterm_ssl
          become: yes

        - name: Record installed amtterm_ssl version
          copy:
            dest: /opt/src/amtterm_ssl/.ansible-version
            content: "{{ amtterm_version }}\n"
            mode: '0644'
