---
- name: Stop and wipe etcd cluster
  hosts: etcd
  become: true
  vars:
    etcd_data_dir: "/var/lib/etcd"
    etcd_stop_timeout: 30

  tasks:
    - name: Stop cluster leader election service
      command: systemctl stop cluster-leader-election.service
      register: leader_election_stop
      failed_when: >-
        leader_election_stop.rc != 0
        and not (leader_election_stop.stderr | default('') is search('not loaded|not found', ignorecase=True))
      changed_when: leader_election_stop.rc == 0

    - name: Stop etcd service
      command: systemctl stop etcd.service
      register: etcd_stop
      failed_when: etcd_stop.rc != 0
      changed_when: etcd_stop.rc == 0

    - name: Wait for etcd to fully stop
      wait_for:
        port: 2379
        host: localhost
        state: stopped
        timeout: "{{ etcd_stop_timeout }}"
      register: etcd_port_wait
      failed_when: etcd_port_wait.elapsed | int >= etcd_stop_timeout | int

    - name: Remove etcd data directory
      file:
        path: "{{ etcd_data_dir }}"
        state: absent

    - name: Recreate etcd data directory with correct permissions
      file:
        path: "{{ etcd_data_dir }}"
        state: directory
        owner: etcd
        group: etcd
        mode: '0755'

    - name: Remove etcd configuration
      file:
        path: /etc/default/etcd
        state: absent

    - name: Display completion message
      debug:
        msg: |
          etcd cluster has been wiped on {{ inventory_hostname }}
          Data directory: {{ etcd_data_dir }}
          You can now run install-etcd.yml to recreate the cluster
