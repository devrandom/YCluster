---
# Install local-ai-proxy (the cluster's inference gateway).
# The API listener binds loopback (127.0.0.1:4001) only — nginx, the
# admin app, and smoke checks all reach it via localhost — and forwards
# to vLLM/llama-server/whisperx backends. /metrics is exposed to
# Prometheus cross-host on the separate {{ inference_proxy_metrics_port }}
# port, so cluster-internal hosts cannot hit the unauth'd /v1 API.
# Replaced LiteLLM (which previously ran on :4000) and now owns the
# inference.xc nginx vhost.
#
# Two deploy modes:
#
# 1) Etcd-sourced model routing (default — this is what production
#    runs). The proxy watches /cluster/config/inference/models/ for
#    model definitions and routes by the request's "model" field.
#    Override the prefix with -e etcd_prefix=...
#
# 2) Passthrough to a single backend (dev / bring-up):
#    ansible-playbook install-local-ai-proxy.yml --limit s3 \
#      -e use_etcd=false -e backend_url=http://nv1.xc:8000
#    The proxy forwards the full client path (including /v1/...) to
#    the backend, so backend_url is host-only — no /v1 suffix.
#
# Build follows the frp pattern: build-local-ai-proxy.yml builds
# on {{ buildhost }} at /opt/src/local-ai-proxy/bin/; this play fetches the
# artifact to the controller cache and copies it to each target. Run
# build-local-ai-proxy.yml first if you haven't already.

- name: Install local-ai-proxy
  hosts: storage
  become: yes
  vars:
    use_etcd: true
    backend_url: "http://nv1.xc:8000"
    proxy_listen: "127.0.0.1:4001"
    # Separate metrics listener so Prometheus can scrape cross-host on
    # {{ inference_proxy_metrics_port }} while the API listener stays
    # loopback-only (see group_vars/all/main.yml).
    proxy_metrics_listen: ":{{ inference_proxy_metrics_port }}"
    # Max in-flight requests per (X-User-Id, model) on the gateway.
    # Default 4; 0 disables. See docs/local-ai-proxy.md.
    proxy_max_concurrent_per_user_model: 4
    # Queue depth per (X-User-Id, model). Default 4; 0 disables queueing.
    proxy_max_queued_per_user_model: 4
    # Binary stays in the build output dir on the buildhost (see
    # build-local-ai-proxy.yml).
    proxy_binary_src: /opt/src/local-ai-proxy/bin/local-ai-proxy
    proxy_bin_dst: /usr/local/bin/local-ai-proxy
  tasks:
    # The etcd client key is distributed mode 0640, group etcd-client (see
    # setup-etcd-tls.yml). Both the Go proxy and the Python auth sidecar run as
    # local-ai-proxy and read it, so the user must be in that group once the
    # cluster is on mTLS. Idempotent + harmless before the group has the key.
    - name: Ensure etcd-client group exists
      group:
        name: etcd-client
        system: yes

    - name: Create local-ai-proxy system user
      user:
        name: local-ai-proxy
        system: yes
        groups: etcd-client
        append: yes
        shell: /usr/sbin/nologin
        home: /var/lib/local-ai-proxy
        create_home: no

    - name: Create local-ai-proxy config directory
      file:
        path: /etc/local-ai-proxy
        state: directory
        owner: local-ai-proxy
        group: local-ai-proxy
        mode: '0755'

    - name: Check if proxy binary exists on buildhost
      stat:
        path: "{{ proxy_binary_src }}"
      register: proxy_binary_buildhost
      delegate_to: "{{ buildhost }}"

    - name: Fail if proxy binary not found on buildhost
      fail:
        msg: "local-ai-proxy binary not found at {{ proxy_binary_src }} on {{ buildhost }}. Run app/build-local-ai-proxy.yml first."
      when: not proxy_binary_buildhost.stat.exists

    - name: Fetch proxy binary from buildhost to controller
      fetch:
        src: "{{ proxy_binary_src }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Install local-ai-proxy binary on targets
      copy:
        src: "{{ build_cache_dir }}/{{ proxy_binary_src | basename }}"
        dest: "{{ proxy_bin_dst }}"
        owner: root
        group: root
        mode: '0755'
      notify: restart local-ai-proxy

    - name: Render local-ai-proxy config
      template:
        src: local-ai-proxy.yaml.j2
        dest: /etc/local-ai-proxy/config.yaml
        owner: local-ai-proxy
        group: local-ai-proxy
        mode: '0644'
      notify: restart local-ai-proxy

    - name: Install local-ai-proxy systemd unit
      copy:
        dest: /etc/systemd/system/local-ai-proxy.service
        mode: '0644'
        content: |
          [Unit]
          Description=local-ai-proxy
          After=network.target

          [Service]
          Type=exec
          EnvironmentFile=-/etc/ycluster/etcd-client.env
          ExecStart={{ proxy_bin_dst }} serve --config /etc/local-ai-proxy/config.yaml
          User=local-ai-proxy
          Group=local-ai-proxy
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      register: service_unit
      notify: restart local-ai-proxy

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: service_unit.changed

    - name: Enable and start local-ai-proxy
      systemd:
        name: local-ai-proxy.service
        enabled: yes
        state: started

    # ---- Auth validator: small Flask service for nginx auth_request ----

    - name: Install auth-validator apt deps
      apt:
        name:
          # The validator imports all of these directly (see
          # files/local-ai-proxy-auth.py). Keep them here rather than
          # relying on install-ycluster-package.yml having run, so the
          # validator is self-contained on any storage node. argon2 must be
          # the apt version (python3-argon2) — pip argon2-cffi exposes a
          # different exception surface.
          - python3-flask
          - python3-etcd3
          - python3-argon2
        state: present

    - name: Install auth-validator script
      copy:
        src: files/local-ai-proxy-auth.py
        dest: /usr/local/bin/local-ai-proxy-auth
        owner: root
        group: root
        mode: '0755'
      notify: restart local-ai-proxy-auth

    - name: Install auth-validator systemd unit
      copy:
        dest: /etc/systemd/system/local-ai-proxy-auth.service
        mode: '0644'
        content: |
          [Unit]
          Description=local-ai-proxy auth validator (nginx auth_request backend)
          After=network.target postgresql.service
          PartOf=ycluster-apps.target

          [Service]
          Type=exec
          EnvironmentFile=-/etc/ycluster/etcd-client.env
          ExecStart=/usr/local/bin/local-ai-proxy-auth
          User=local-ai-proxy
          Group=local-ai-proxy
          Environment=LISTEN_ADDR=127.0.0.1:4002
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=ycluster-apps.target
      register: auth_unit
      notify: restart local-ai-proxy-auth

    - name: Reload systemd (auth-validator)
      systemd:
        daemon_reload: yes
      when: auth_unit.changed

    - name: Enable and start auth-validator
      systemd:
        name: local-ai-proxy-auth.service
        enabled: yes
        state: started

    # ---- nginx vhost: inference.xc → local-ai-proxy ----

    - name: Install inference.xc nginx config
      copy:
        src: files/inference-internal.conf
        dest: /etc/nginx/sites-available/inference-internal
        mode: '0644'
      notify: reload nginx

    - name: Enable inference.xc nginx config
      file:
        src: /etc/nginx/sites-available/inference-internal
        dest: /etc/nginx/sites-enabled/inference-internal
        state: link
      notify: reload nginx

    - name: Remove obsolete nginx configs (replaced by inference-internal)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/litellm-internal
        - /etc/nginx/sites-available/litellm-internal
        - /etc/nginx/sites-enabled/local-ai-proxy-internal
        - /etc/nginx/sites-available/local-ai-proxy-internal
      notify: reload nginx

    # ---- Remove LiteLLM remnants (replaced by local-ai-proxy) ----
    - name: Stop and disable litellm service if present
      systemd:
        name: litellm.service
        state: stopped
        enabled: false
      failed_when: false
      register: litellm_stop

    - name: Remove LiteLLM systemd unit, manager, and config dir
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/litellm.service
        - /etc/systemd/system/ycluster-apps.target.wants/litellm.service
        - /usr/local/lib/cluster/litellm-manager
        - /etc/litellm
      register: litellm_removed

    - name: Reload systemd after removing litellm unit
      systemd:
        daemon_reload: yes
      when: litellm_removed.changed

    - name: Apply any pending service restarts before smoke check
      meta: flush_handlers

    - name: Smoke check /v1/models through local-ai-proxy
      uri:
        url: "http://127.0.0.1:4001/v1/models"
        return_content: no
        status_code: [200, 401, 404]
      register: smoke
      failed_when: false
      retries: 5
      delay: 1
      until: smoke.status is defined

    - name: Report smoke check
      debug:
        msg: >-
          local-ai-proxy on {{ inventory_hostname }}:4001 replied
          {{ smoke.status | default('unreachable') }}
          ({% if use_etcd | default(true) | bool %}source=etcd:{{ etcd_prefix | default('/cluster/config/inference/models/') }}{% else %}backend={{ backend_url }}{% endif %})

  handlers:
    - name: restart local-ai-proxy
      systemd:
        name: local-ai-proxy.service
        state: restarted
        daemon_reload: yes

    - name: restart local-ai-proxy-auth
      systemd:
        name: local-ai-proxy-auth.service
        state: restarted
        daemon_reload: yes

    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
