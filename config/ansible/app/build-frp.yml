---
# Build frp from source on the buildhost (default s1). The binaries stay
# in the build output dir; install-frp*.yml fetch them from there via the
# controller. The play runs on localhost (so import_playbook can resolve
# `hosts` statically) and each task delegates to the buildhost.
#
# No prebuilt binaries: see AGENTS.md "No prebuilt third-party binaries".
# Source is vendored under /opt/src/frp/ and pinned to a git SHA in the
# vars below (matches the rathole/open-webui pattern of inlining the
# repo URL + SHA in the build playbook itself).
- name: Build frp from source
  hosts: localhost
  vars:
    frp_build_dir: "/opt/src/frp"
    frp_binary_dir: "{{ frp_build_dir }}/bin"
    frp_server_binary: "{{ frp_binary_dir }}/frps"
    frp_client_binary: "{{ frp_binary_dir }}/frpc"
    # frp v0.70.0 = fdaff3d674606b0ae4706a0f2eaca58ebbce0dfa.
    frp_repo_url: "https://github.com/fatedier/frp.git"
    frp_repo_sha: "fdaff3d674606b0ae4706a0f2eaca58ebbce0dfa"
    # Go toolchain. Installed via apt (golang-1.24) on the buildhost when
    # a rebuild is needed; local_ai_proxy_go_bin overrides the path for
    # hosts that already have go elsewhere.
    go_bin: "{{ local_ai_proxy_go_bin | default('/usr/lib/go-1.24/bin/go') }}"
  tasks:
    - name: Check if frp binaries already exist
      stat:
        path: "{{ item }}"
      register: frp_binary_stat
      loop:
        - "{{ frp_server_binary }}"
        - "{{ frp_client_binary }}"
      delegate_to: "{{ buildhost }}"

    # Both binaries must exist for the build to be a no-op. Build when
    # either is missing. The check is inlined on each subsequent task
    # (any_binary_missing) rather than as a set_fact, since the value
    # contains `>` which collides with YAML block-scalar syntax.
    - name: Set fact (any binary missing)
      set_fact:
        # Single-quoted to avoid YAML treating `>` as a block-scalar
        # indicator inside the Jinja expression.
        any_binary_missing: '{{ frp_binary_stat.results | selectattr(''stat.exists'', ''equalto'', false) | list | length > 0 }}'

    - name: Install build dependencies (go + git)
      apt:
        name:
          - golang-1.24
          - git
        state: present
      become: yes
      when: any_binary_missing
      delegate_to: "{{ buildhost }}"

    - name: Remove existing build directory (clean rebuild)
      file:
        path: "{{ frp_build_dir }}"
        state: absent
      when: any_binary_missing
      delegate_to: "{{ buildhost }}"

    - name: Clone frp repository at pinned SHA
      git:
        repo: "{{ frp_repo_url }}"
        dest: "{{ frp_build_dir }}"
        version: "{{ frp_repo_sha }}"
        depth: 1
      when: any_binary_missing
      delegate_to: "{{ buildhost }}"

    - name: Build frp binaries (frps + frpc)
      command: make build
      args:
        chdir: "{{ frp_build_dir }}"
      environment:
        PATH: "{{ go_bin | dirname }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
      when: any_binary_missing
      delegate_to: "{{ buildhost }}"

    - name: Verify frp binaries were produced
      stat:
        path: "{{ item }}"
      register: frp_binary_verify
      loop:
        - "{{ frp_server_binary }}"
        - "{{ frp_client_binary }}"
      failed_when: not frp_binary_verify.stat.exists
      delegate_to: "{{ buildhost }}"
