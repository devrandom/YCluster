---
# Forgejo (cluster git forge) on the storage leader.
#
# State lives on /rbd/user/forgejo (repositories, LFS, attachments,
# avatars, Actions logs/artifacts, indexes, queues); relational state lives
# in the cluster's shared PostgreSQL. The service follows the storage leader
# through ycluster-apps.target, like Authentik and Zulip.
#
# The runtime image is built from the official image pinned by digest (see
# app/build-forgejo.yml) and pushed to registry.xc, so a failover or fresh
# node does not make a cold Codeberg request. app.ini is rendered by
# forgejo-manager at service start; it is not templated here because the OIDC
# client secret is only known after Authentik publishes it.
- name: Install Forgejo on storage nodes
  hosts: storage
  become: yes
  vars:
    forgejo_version: "17.0.0"
    # amd64 digest from the official Forgejo 17.0.0 image index. The runtime
    # image is built from it by app/build-forgejo.yml (brotli-libs 1.2.1-r0,
    # expat 2.9.0-r0, zlib 1.3.2-r1). Bump deliberately; osv-feed container
    # manifests track the Alpine base and the Forgejo Go modules, so regenerate
    # config/ansible/monitoring/container-manifests/forgejo.manifest too.
    forgejo_upstream_image: "codeberg.org/forgejo/forgejo@sha256:c6931ca2926185d129aee8e28f1c6f42fbd8c1bb6b14dbac38873e06a8948a8a"
    forgejo_image_tag: "{{ forgejo_version }}-c6931ca29261-brotli1.2.1-expat2.9.0-zlib1.3.2r1"
    forgejo_registry_image: "registry.xc:5000/forgejo:{{ forgejo_image_tag }}"
    forgejo_port: "{{ forgejo_local_port | default('3000') }}"
    forgejo_ssh_port: "{{ forgejo_local_ssh_port | default('2222') }}"
    # External HTTPS is enabled by default. Set -e forgejo_external=false to
    # keep the forge internal-only.
    forgejo_external_enabled: "{{ forgejo_external | default(true) }}"
    # External SSH uses the leader-gated frpc TCP proxy on frontend port 2222.
    # Set -e forgejo_external_ssh=false to keep it firewall-closed.
    forgejo_external_ssh_enabled: "{{ forgejo_external_ssh | default(true) }}"
  tasks:
    - name: Check if this host is the storage leader
      command: mountpoint -q /rbd/user
      register: rbd_user_mounted
      failed_when: false
      changed_when: false

    - name: Set storage leader fact
      set_fact:
        is_storage_leader: "{{ rbd_user_mounted.rc == 0 }}"

    - name: Ensure the cluster registry is active on the leader
      systemd:
        name: docker-registry.service
        state: started
      when: is_storage_leader

    - name: Check whether the cluster registry has the Forgejo image
      uri:
        url: "http://registry.xc:5000/v2/forgejo/manifests/{{ forgejo_image_tag }}"
        method: HEAD
        headers:
          # buildx pushes an OCI image index; the registry returns 404 when
          # the Accept header does not advertise that media type.
          Accept: "application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json"
        status_code: 200
        timeout: 10
      register: forgejo_registry_check
      failed_when: false
      until: forgejo_registry_check.status | default(-1) in [200, 404]
      retries: 30
      delay: 2
      when: is_storage_leader

    - name: Require the patched Forgejo image in the cluster registry
      fail:
        msg: >-
          {{ forgejo_registry_image }} is missing; run
          app/build-forgejo.yml first
      when: is_storage_leader and forgejo_registry_check.status != 200

    - name: Pull the patched Forgejo image from the cluster registry
      docker_image:
        name: "{{ forgejo_registry_image }}"
        source: pull
      when: is_storage_leader

    - name: Read Forgejo database password from etcd
      command: etcdctl get /cluster/config/forgejo/db-password --print-value-only
      environment: "{{ etcd_client_env }}"
      register: forgejo_db_password_read
      changed_when: false
      failed_when: false
      no_log: true
      run_once: true
      delegate_to: "{{ groups['storage'] | first }}"

    - name: Generate Forgejo database password
      command: openssl rand -base64 24
      register: forgejo_db_password_generated
      changed_when: false
      no_log: true
      run_once: true
      when: forgejo_db_password_read.stdout | trim == ''

    - name: Store Forgejo database password in etcd
      command: etcdctl put /cluster/config/forgejo/db-password
      args:
        stdin: "{{ forgejo_db_password_generated.stdout }}"
        stdin_add_newline: false
      environment: "{{ etcd_client_env }}"
      no_log: true
      run_once: true
      delegate_to: "{{ groups['storage'] | first }}"
      when: forgejo_db_password_read.stdout | trim == ''

    - name: Set Forgejo database password fact from etcd
      set_fact:
        forgejo_db_password: "{{ forgejo_db_password_read.stdout | trim }}"
      no_log: true
      when: forgejo_db_password_read.stdout | trim != ''

    - name: Set Forgejo database password fact from generated value
      set_fact:
        forgejo_db_password: "{{ forgejo_db_password_generated.stdout | trim }}"
      no_log: true
      when: forgejo_db_password_read.stdout | trim == ''

    - name: Create Forgejo configuration directory
      file:
        path: /etc/forgejo
        state: directory
        mode: '0755'

    - name: Copy Forgejo compose file
      copy:
        src: files/forgejo-compose.yaml
        dest: /etc/forgejo/docker-compose.yml
        mode: '0644'
      notify: restart forgejo

    - name: Create cluster scripts directory
      file:
        path: /usr/local/lib/cluster
        state: directory
        mode: '0755'

    - name: Create Forgejo manager script
      copy:
        src: files/forgejo-manager
        dest: /usr/local/lib/cluster/forgejo-manager
        mode: '0755'
      notify: restart forgejo

    - name: Create Forgejo systemd service
      copy:
        dest: /etc/systemd/system/forgejo.service
        content: |
          [Unit]
          Description=Forgejo (cluster git forge)
          After=network.target docker.service user-rbd.service authentik.service
          Requires=docker.service user-rbd.service
          PartOf=ycluster-apps.target

          [Service]
          Type=exec
          ExecStart=/usr/local/lib/cluster/forgejo-manager start
          ExecStop=/usr/local/lib/cluster/forgejo-manager stop
          TimeoutStartSec=600
          TimeoutStopSec=90
          User=root
          Restart=on-failure
          RestartSec=10
          Environment=FORGEJO_IMAGE={{ forgejo_registry_image }}
          Environment=FORGEJO_PORT={{ forgejo_port }}
          Environment=FORGEJO_SSH_PORT={{ forgejo_ssh_port }}
          Environment=FORGEJO_EXTERNAL_ENABLED={{ 'true' if forgejo_external_enabled | bool else 'false' }}
          Environment=FORGEJO_EXTERNAL_SSH_ENABLED={{ 'true' if forgejo_external_ssh_enabled | bool else 'false' }}

          [Install]
          WantedBy=ycluster-apps.target
      register: forgejo_service_file
      notify: restart forgejo

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Re-enable Forgejo service to update symlinks
      command: systemctl reenable forgejo.service
      when: forgejo_service_file.changed

    - name: Enable Forgejo service (part of storage-apps target)
      systemd:
        name: forgejo.service
        enabled: yes

    - name: Configure PostgreSQL for Forgejo
      when: is_storage_leader
      block:
        - name: Create PostgreSQL database for Forgejo
          postgresql_db:
            name: forgejo
            state: present
          become_user: postgres

        - name: Create PostgreSQL user for Forgejo
          postgresql_user:
            name: forgejo
            password: "{{ forgejo_db_password }}"
            db: forgejo
            priv: ALL
            state: present
          become_user: postgres
          no_log: true

        - name: Grant schema permissions to Forgejo user
          postgresql_privs:
            database: forgejo
            state: present
            privs: ALL
            type: schema
            objs: public
            roles: forgejo
          become_user: postgres

        - name: Make Forgejo owner of the database
          postgresql_owner:
            db: forgejo
            obj_name: forgejo
            new_owner: forgejo
            obj_type: database
          become_user: postgres

    - name: Install Forgejo internal nginx site (forgejo.xc)
      template:
        src: templates/forgejo-internal.conf.j2
        dest: /etc/nginx/sites-available/forgejo-internal
        mode: '0644'
      notify: reload nginx

    - name: Enable Forgejo internal nginx site
      file:
        src: /etc/nginx/sites-available/forgejo-internal
        dest: /etc/nginx/sites-enabled/forgejo-internal
        state: link
      notify: reload nginx

    - name: Install Forgejo nginx connection-limit zone
      copy:
        src: files/forgejo-ratelimit.conf
        dest: /etc/nginx/conf.d/forgejo-ratelimit.conf
        mode: '0644'
      notify: reload nginx
      when: forgejo_external_enabled | bool

    - name: Install Forgejo external nginx template
      template:
        src: files/forgejo_git.conf.j2
        dest: /etc/nginx/templates/forgejo_git.conf.j2
        mode: '0644'
        variable_start_string: '(('
        variable_end_string: '))'
        block_start_string: '((#'
        block_end_string: '#))'
      vars:
        proxy_port: "{{ forgejo_port }}"
      notify: reload nginx
      when: forgejo_external_enabled | bool

    - name: Generate Forgejo nginx configuration from template
      command: "/usr/local/bin/certbot-manager update-nginx{% if web_services_force_local | default(false) %} --local{% endif %}"
      environment: "{{ etcd_client_env }}"
      register: forgejo_nginx_update
      changed_when: "'configuration updated' in forgejo_nginx_update.stdout"
      failed_when: forgejo_nginx_update.rc != 0
      notify: reload nginx
      when: forgejo_external_enabled | bool

    - name: Enable git.<domain> Forgejo nginx site
      file:
        src: /etc/nginx/sites-available/forgejo_git
        dest: /etc/nginx/sites-enabled/forgejo_git
        state: link
      notify: reload nginx
      when: forgejo_external_enabled | bool

    # A failed run can update the unit but not reach the restart handler.
    # On the next run the unit is already current, so check the rendered
    # app.ini mode and restart only when the running config has not caught up.
    - name: Check that Forgejo external mode is applied
      command: grep -q '^ROOT_URL = https://git\.' /etc/forgejo/app.ini
      register: forgejo_external_applied
      changed_when: forgejo_external_applied.rc != 0
      failed_when: false
      notify: restart forgejo
      when: is_storage_leader and (forgejo_external_enabled | bool)

    - name: Check that Forgejo internal mode is applied
      command: grep -q '^ROOT_URL = http://forgejo.xc/' /etc/forgejo/app.ini
      register: forgejo_internal_applied
      changed_when: forgejo_internal_applied.rc != 0
      failed_when: false
      notify: restart forgejo
      when: is_storage_leader and not (forgejo_external_enabled | bool)

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    # Leader-only: the unit Requires=user-rbd.service and /rbd/user is
    # mounted only on the leader, so a restart on a non-leader would fail.
    # Picks up compose/manager/unit changes (brief forge outage).
    - name: restart forgejo
      systemd:
        name: forgejo.service
        state: restarted
        daemon_reload: yes
      when: is_storage_leader
