---
# Install the frp alt nginx vhost on the storage leader. The frontend's
# frps listens on :80/:443 and forwards through the frpc tunnel to
# 127.0.0.2:17080/:17443 here, where nginx picks up real client IPs via
# PROXY protocol v2. admin-api-alt.conf.j2 now holds only the proxy-port
# surface not owned by a per-app template: the :17080 HTTP default (ACME +
# admin public/authed), the `_` 17443 404 fallback, and the forward-authed
# public admin.<domain> block. The app/auth/comfy/open-webui surfaces live
# in their own per-app templates (each declares its plain :443 listener
# alongside the 127.0.0.2:17443 PROXY landing). It replaces rathole's
# public http/https vhost (rathole now only carries ssh/admin ingress until
# the step-6 cleanup). Split out of install-frp-server.yml so the frontend
# frps install and the storage vhost install are two focused playbooks.
#
# The alt vhost is intentionally kept separate from the primary
# admin-api.conf.j2 rendering (setup-web-services.yml) so that the
# frp-forwarded public surface is a distinct, independently-deployable
# artifact.
- name: Install frp alt nginx vhost (storage leader)
  hosts: storage
  become: yes
  tasks:
    # Alt vhost template lives in /etc/nginx/templates/ — same pattern as
    # admin-api.conf.j2 / ycluster_app.conf.j2. certbot-manager renders it
    # with `domain=<primary>` (read from /cluster/https/domain in etcd) so
    # the alt vhost tracks the prod domain without leaking it into repo code.
    - name: Install alt nginx vhost template
      copy:
        src: ../admin/files/admin-api-alt.conf.j2
        dest: /etc/nginx/templates/admin-api-alt.conf.j2
        mode: '0644'
        owner: root
        group: root

    - name: Render alt nginx vhost with certbot-manager
      # Mirror setup-web-services.yml / install-authentik.yml: pass --local
      # in dev (web_services_force_local) where /cluster/https/domain isn't
      # seeded yet — same pattern the other certbot-manager callers use.
      command: "/usr/local/bin/certbot-manager update-nginx{% if web_services_force_local | default(false) %} --local{% endif %}"
      environment: "{{ etcd_client_env | default({}) }}"
      register: nginx_update_result
      changed_when: "'configuration updated' in nginx_update_result.stdout"
      failed_when: nginx_update_result.rc != 0
      notify: reload nginx

    - name: Enable alt nginx vhost
      file:
        src: /etc/nginx/sites-available/admin-api-alt
        dest: /etc/nginx/sites-enabled/admin-api-alt
        state: link
      notify: reload nginx

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
