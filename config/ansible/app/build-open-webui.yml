---
- name: Build Open WebUI with plugins
  # Run on localhost so import_playbook can resolve `hosts` statically;
  # each task delegates to the buildhost.
  hosts: localhost
  gather_facts: false
  vars:
    instance: "{{ openwebui_instance | default('') }}"
    instance_suffix: "{{ '-' + instance if instance else '' }}"
    build_dir: "/opt/src/open-webui-build{{ instance_suffix }}"
    plugins_repo: "https://github.com/devrandom/open-webui-plugins.git"
    # open-webui-plugins (private, no upstream tags) = 746f4b2f296d0b77f341bd646a19d07f49d3dd67.
    plugins_repo_sha: "746f4b2f296d0b77f341bd646a19d07f49d3dd67"
    webui_repo: "https://github.com/open-webui/open-webui.git"
    # open-webui v0.11.3. Fork-only changes are applied as build-time patches:
    # mobile-gated image/gallery upload + NLTK CVE bump (3.9.4 -> 3.10.3).
    webui_repo_sha: "2a960a59fe1dbbd35282f0556b3666d81102e781"
    image_name: "registry.xc:5000/open-webui-with-plugins"
    image_tag: "{{ instance if instance else 'latest' }}"
  tasks:
    - block:
        - name: Verify registry is ready for push operations
          uri:
            url: "http://registry.xc:5000/v2/_catalog"
            method: GET
            timeout: 10
          register: registry_catalog
          failed_when: registry_catalog.status != 200

        - name: Create build directory
          file:
            path: "{{ build_dir }}"
            state: directory
            mode: '0755'

        - name: Check out open-webui-plugins repository
          git:
            repo: "{{ plugins_repo }}"
            dest: "{{ build_dir }}/open-webui-plugins"
            version: "{{ plugins_repo_sha }}"
            force: yes
            # The build host cannot reach GitHub's smart-HTTP endpoint; update
            # checkouts manually (docs/OPEN_WEBUI.md) before rebuilding.
            update: false

        - name: Check out open-webui repository
          git:
            repo: "{{ webui_repo }}"
            dest: "{{ build_dir }}/open-webui"
            version: "{{ webui_repo_sha }}"
            force: yes
            update: false

        - name: Patch upstream Kagi web search (fixes 401; upstream sends Bearer/POST instead of Bot/GET)
          copy:
            src: files/kagi.py
            dest: "{{ build_dir }}/open-webui/backend/open_webui/retrieval/web/kagi.py"
            mode: '0644'

        - name: Copy Open WebUI YCluster home-icon frontend patch
          copy:
            src: files/open-webui-home-icon.patch
            dest: "{{ build_dir }}/open-webui-home-icon.patch"
            mode: '0644'

        - name: Copy Open WebUI friendly error-page frontend patch
          copy:
            src: files/open-webui-error-page.patch
            dest: "{{ build_dir }}/open-webui-error-page.patch"
            mode: '0644'

        # Applies a Svelte change (adds a Y icon in the chat navbar top-right that
        # links to the apex-domain home) to the checked-out frontend before the
        # docker build. Idempotent: git apply --check fails once applied, so stage
        # rebuilds over the same checkout don't re-apply.
        - name: Apply Open WebUI YCluster home-icon frontend patch
          shell: |
            if git apply --check ../open-webui-home-icon.patch 2>/dev/null; then
              git apply ../open-webui-home-icon.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        # Adds status/message context plus "Back to home" and "Try again" actions
        # to the SvelteKit error boundary, mirroring the nginx friendly-50x page.
        # Same idempotent apply pattern as the home-icon patch.
        - name: Apply Open WebUI friendly error-page frontend patch
          shell: |
            if git apply --check ../open-webui-error-page.patch 2>/dev/null; then
              git apply ../open-webui-error-page.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        - name: Copy Open WebUI edge-auth redirect frontend patch
          copy:
            src: files/open-webui-edge-auth-redirect.patch
            dest: "{{ build_dir }}/open-webui-edge-auth-redirect.patch"
            mode: '0644'

        # Treat a 401 from /api/config as an auth-proxy interception and do a
        # full navigation to /, where nginx can redirect to the IdP. Without
        # this, a stale edge session is misreported by the SPA as "Backend
        # Required" instead of starting a fresh sign-in.
        - name: Apply Open WebUI edge-auth redirect frontend patch
          shell: |
            if git apply --check ../open-webui-edge-auth-redirect.patch 2>/dev/null; then
              git apply ../open-webui-edge-auth-redirect.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        - name: Copy Open WebUI smoke-error route patch
          copy:
            src: files/open-webui-smoke-error.patch
            dest: "{{ build_dir }}/open-webui-smoke-error.patch"
            mode: '0644'

        # Applies a Svelte change (adds a mobile-only "Upload Image" option
        # backed by a hidden image file input). Idempotent: git apply --check
        # fails once applied, so stage rebuilds over the same checkout don't
        # re-apply.
        - name: Copy Open WebUI mobile upload patch
          copy:
            src: files/open-webui-mobile-upload.patch
            dest: "{{ build_dir }}/open-webui-mobile-upload.patch"
            mode: '0644'

        - name: Apply Open WebUI mobile upload patch
          shell: |
            if git apply --check ../open-webui-mobile-upload.patch 2>/dev/null; then
              git apply ../open-webui-mobile-upload.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        # NLTK 3.10.3 security bump. Carried in the build tree until upstream
        # merges its Dependabot upgrade.
        - name: Copy Open WebUI NLTK security patch
          copy:
            src: files/open-webui-nltk-3.10.3.patch
            dest: "{{ build_dir }}/open-webui-nltk-3.10.3.patch"
            mode: '0644'

        - name: Apply Open WebUI NLTK security patch
          shell: |
            if git apply --check ../open-webui-nltk-3.10.3.patch 2>/dev/null; then
              git apply ../open-webui-nltk-3.10.3.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        # Pillow 13.0.0 and certifi 2026.10.19 security bump. The image
        # installs requirements.txt, so these pins are what the runtime sees.
        - name: Copy Open WebUI pillow/certifi security patch
          copy:
            src: files/open-webui-pillow-certifi.patch
            dest: "{{ build_dir }}/open-webui-pillow-certifi.patch"
            mode: '0644'

        - name: Apply Open WebUI pillow/certifi security patch
          shell: |
            if git apply --check ../open-webui-pillow-certifi.patch 2>/dev/null; then
              git apply ../open-webui-pillow-certifi.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        # Adds a /__smoke_app_error route that deliberately throws 500 from its
        # load function, exercising the friendly error boundary end-to-end
        # (parity with nginx /__smoke_50x). Same idempotent apply pattern.
        - name: Apply Open WebUI smoke-error route patch
          shell: |
            if git apply --check ../open-webui-smoke-error.patch 2>/dev/null; then
              git apply ../open-webui-smoke-error.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        - name: Build and push with buildx using registry cache
          shell: |
            docker buildx build \
              --build-arg http_proxy=http://10.0.0.254:3128 \
              --build-arg USE_SLIM=true \
              --cache-from type=registry,ref={{ image_name }}:cache \
              --cache-to type=registry,ref={{ image_name }}:cache,mode=max \
              --build-context plugins=open-webui-plugins \
              --progress plain \
              --tag {{ image_name }}:{{ image_tag }} \
              --push \
              ./open-webui | tee /tmp/build-open-webui.log 2>&1
          args:
            chdir: "{{ build_dir }}"
          no_log: false

        - name: Display build completion message
          debug:
            msg: "Docker image {{ image_name }}:{{ image_tag }} built and pushed to registry successfully"
      delegate_to: "{{ buildhost }}"
