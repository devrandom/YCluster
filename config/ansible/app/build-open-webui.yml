---
- name: Build Open WebUI with plugins
  # Run on localhost so import_playbook can resolve `hosts` statically;
  # each task delegates to the buildhost.
  hosts: localhost
  gather_facts: false
  vars:
    instance: "{{ openwebui_instance | default('') }}"
    instance_suffix: "{{ '-' + instance if instance else '' }}"
    build_dir: "/opt/src/open-webui-build{{ instance_suffix }}"
    plugins_repo: "https://github.com/devrandom/open-webui-plugins.git"
    # open-webui-plugins (private, no upstream tags) = 746f4b2f296d0b77f341bd646a19d07f49d3dd67.
    plugins_repo_sha: "746f4b2f296d0b77f341bd646a19d07f49d3dd67"
    webui_repo: "https://github.com/devrandom/open-webui.git"
    # open-webui v0.11.1-dr (devrandom fork; branch, not tag) =
    # 1537cc0127538bed5947553316593741cc67acee. Upstream v0.11.1
    # (d3e8bf34) + mobile-gated image/gallery upload commit; bump this
    # pin when further -dr commits land.
    webui_repo_sha: "1537cc0127538bed5947553316593741cc67acee"
    image_name: "registry.xc:5000/open-webui-with-plugins"
    image_tag: "{{ instance if instance else 'latest' }}"
  tasks:
    - block:
        - name: Verify registry is ready for push operations
          uri:
            url: "http://registry.xc:5000/v2/_catalog"
            method: GET
            timeout: 10
          register: registry_catalog
          failed_when: registry_catalog.status != 200

        - name: Create build directory
          file:
            path: "{{ build_dir }}"
            state: directory
            mode: '0755'

        - name: Check out open-webui-plugins repository
          git:
            repo: "{{ plugins_repo }}"
            dest: "{{ build_dir }}/open-webui-plugins"
            version: "{{ plugins_repo_sha }}"
            force: yes
            update: "{{ instance == '' }}"

        - name: Check out open-webui repository
          git:
            repo: "{{ webui_repo }}"
            dest: "{{ build_dir }}/open-webui"
            version: "{{ webui_repo_sha }}"
            force: yes
            update: "{{ instance == '' }}"

        - name: Patch upstream Kagi web search (fixes 401; upstream sends Bearer/POST instead of Bot/GET)
          copy:
            src: files/kagi.py
            dest: "{{ build_dir }}/open-webui/backend/open_webui/retrieval/web/kagi.py"
            mode: '0644'

        - name: Copy Open WebUI YCluster home-icon frontend patch
          copy:
            src: files/open-webui-home-icon.patch
            dest: "{{ build_dir }}/open-webui-home-icon.patch"
            mode: '0644'

        # Applies a Svelte change (adds a Y icon in the chat navbar top-right that
        # links to the apex-domain home) to the checked-out frontend before the
        # docker build. Idempotent: git apply --check fails once applied, so stage
        # rebuilds over the same checkout don't re-apply.
        - name: Apply Open WebUI YCluster home-icon frontend patch
          shell: |
            if git apply --check ../open-webui-home-icon.patch 2>/dev/null; then
              git apply ../open-webui-home-icon.patch
            fi
          args:
            chdir: "{{ build_dir }}/open-webui"

        - name: Build and push with buildx using registry cache
          shell: |
            docker buildx build \
              --build-arg http_proxy=http://10.0.0.254:3128 \
              --build-arg USE_SLIM=true \
              --cache-from type=registry,ref={{ image_name }}:cache \
              --cache-to type=registry,ref={{ image_name }}:cache,mode=max \
              --build-context plugins=open-webui-plugins \
              --progress plain \
              --tag {{ image_name }}:{{ image_tag }} \
              --push \
              ./open-webui | tee /tmp/build-open-webui.log 2>&1
          args:
            chdir: "{{ build_dir }}"
          no_log: false

        - name: Display build completion message
          debug:
            msg: "Docker image {{ image_name }}:{{ image_tag }} built and pushed to registry successfully"
      delegate_to: "{{ buildhost }}"
