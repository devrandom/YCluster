---
# Mount NAS share on cluster nodes
#
# Usage:
#   ansible-playbook app/mount-nas-share.yml
#   ansible-playbook app/mount-nas-share.yml --limit core
#   ansible-playbook app/mount-nas-share.yml --limit macos
#
# Prerequisites:
#   - NAS node running with Samba configured (see setup-nas.yml)
#   - vault_samba_secret defined in vault

- name: Mount NAS share on Linux nodes
  hosts: core:compute
  become: yes
  tags: [cifs]
  # Pulled by explicit file reference, not a group_vars/all auto-load, so it
  # stays out of `ansible-inventory --host` dumps (vault/general.yml).
  vars_files:
    - ../vault/general.yml
  vars:
    # Legacy CIFS mount — hardcoded and frozen. NFS is the general path now;
    # this exists only to serve (or retire) the original near1 share.
    samba_user: cluster
    samba_share_name: near1
    nas_host: nas1.xc
    mount_point: /near1
    mount_uid: 1000
    mount_gid: 1000

  tasks:
    - name: Check for the legacy CIFS mount unit
      stat:
        path: /etc/systemd/system/near1.mount
      register: near1_mount_unit
      when: not (nas_cifs_enabled | bool)

    - name: Check for the legacy CIFS automount unit
      stat:
        path: /etc/systemd/system/near1.automount
      register: near1_automount_unit
      when: not (nas_cifs_enabled | bool)

    - name: Disable the legacy CIFS automount
      systemd:
        name: near1.automount
        enabled: no
        state: stopped
      when: >-
        not (nas_cifs_enabled | bool)
        and near1_automount_unit.stat is defined
        and near1_automount_unit.stat.exists

    - name: Disable the legacy CIFS mount
      systemd:
        name: near1.mount
        enabled: no
        state: stopped
      when: >-
        not (nas_cifs_enabled | bool)
        and near1_mount_unit.stat is defined
        and near1_mount_unit.stat.exists

    - name: Remove legacy CIFS units when disabled
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/near1.mount
        - /etc/systemd/system/near1.automount
      when: not (nas_cifs_enabled | bool)
      notify: reload systemd

    - name: Remove stale CIFS credentials when disabled
      file:
        path: /etc/samba/nas-credentials
        state: absent
      when: not (nas_cifs_enabled | bool)

    - name: Flush systemd handlers before configuring CIFS
      meta: flush_handlers

    - name: Configure and enable CIFS NAS automount
      when: nas_cifs_enabled | bool
      block:
        - name: Install CIFS utilities
          apt:
            name: cifs-utils
            state: present
            update_cache: yes

        - name: Create mount point
          file:
            path: "{{ mount_point }}"
            state: directory
            mode: '0755'

        - name: Create credentials directory
          file:
            path: /etc/samba
            state: directory
            mode: '0755'

        - name: Create credentials file
          copy:
            dest: /etc/samba/nas-credentials
            content: |
              username={{ samba_user }}
              password={{ vault_samba_secret }}
            mode: '0600'
          no_log: true

        - name: Create systemd mount unit
          copy:
            dest: "/etc/systemd/system/{{ samba_share_name }}.mount"
            content: |
              [Unit]
              Description=NAS Share {{ samba_share_name }}
              After=network-online.target
              Wants=network-online.target

              [Mount]
              What=//{{ nas_host }}/{{ samba_share_name }}
              Where={{ mount_point }}
              Type=cifs
              Options=credentials=/etc/samba/nas-credentials,uid={{ mount_uid }},gid={{ mount_gid }},file_mode=0664,dir_mode=0775,_netdev,x-systemd.automount

              [Install]
              WantedBy=multi-user.target
            mode: '0644'
          notify: reload systemd

        - name: Create systemd automount unit
          copy:
            dest: "/etc/systemd/system/{{ samba_share_name }}.automount"
            content: |
              [Unit]
              Description=Automount NAS Share {{ samba_share_name }}

              [Automount]
              Where={{ mount_point }}
              TimeoutIdleSec=0

              [Install]
              WantedBy=multi-user.target
            mode: '0644'
          notify: reload systemd

        - name: Flush handlers
          meta: flush_handlers

        - name: Enable and start automount
          systemd:
            name: "{{ samba_share_name }}.automount"
            enabled: yes
            state: started

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes


- name: Mount NAS share on macOS nodes
  hosts: macos
  become: yes
  tags: [cifs]
  pre_tasks:
    - name: Skip macOS hosts when the CIFS NAS mount is enabled
      meta: end_host
      when: nas_cifs_enabled | bool

    - name: Check macOS NAS mount state
      command: mount
      register: macos_mount_check
      changed_when: false

    - name: Unmount the legacy CIFS share
      command: diskutil unmount force /Volumes/near1
      when: "'/Volumes/near1' in macos_mount_check.stdout"

    - name: Check for the legacy CIFS launchdaemon
      stat:
        path: /Library/LaunchDaemons/com.ycluster.mount-near1.plist
      register: macos_near1_plist

    - name: Unload the legacy CIFS launchdaemon
      command: launchctl unload /Library/LaunchDaemons/com.ycluster.mount-near1.plist
      when: macos_near1_plist.stat.exists
      register: macos_near1_unload
      failed_when: false
      changed_when: macos_near1_unload.rc == 0

    - name: Remove legacy CIFS mount artifacts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /Library/LaunchDaemons/com.ycluster.mount-near1.plist
        - /usr/local/bin/mount-near1.sh
        - /etc/nas-credentials

    - name: Finish macOS CIFS retirement
      meta: end_host
  # Pulled by explicit file reference, not a group_vars/all auto-load, so it
  # stays out of `ansible-inventory --host` dumps (vault/general.yml).
  vars_files:
    - ../vault/general.yml
  vars:
    samba_user: cluster
    samba_share_name: near1
    nas_host: nas1.xc
    mount_point: /Volumes/near1
    mount_user: dev
    mount_group: staff

  tasks:
    - name: Check if already mounted
      command: mount
      register: mount_check
      changed_when: false

    - name: Create mount point
      file:
        path: "{{ mount_point }}"
        state: directory
        owner: "{{ mount_user }}"
        group: "{{ mount_group }}"
        mode: '0755'
      when: mount_point not in mount_check.stdout

    - name: Create credentials file
      copy:
        dest: /etc/nas-credentials
        content: |
          username={{ samba_user }}
          password={{ vault_samba_secret }}
        owner: "{{ mount_user }}"
        group: wheel
        mode: '0600'
      no_log: true



    - name: Create /usr/local/bin directory
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

    - name: Create mount script
      copy:
        dest: /usr/local/bin/mount-near1.sh
        content: |
          #!/bin/bash
          # Mount NAS share (launchd runs this periodically via StartInterval)

          MOUNT_POINT="{{ mount_point }}"
          NAS_HOST="{{ nas_host }}"
          SHARE_NAME="{{ samba_share_name }}"
          CREDS_FILE="/etc/nas-credentials"

          # Read credentials
          USERNAME=$(grep '^username=' "$CREDS_FILE" | cut -d= -f2)
          PASSWORD=$(grep '^password=' "$CREDS_FILE" | cut -d= -f2)

          # Check if mounted and healthy
          if mount | grep -q "$MOUNT_POINT"; then
              # Test if the mount is actually responsive (2s timeout)
              if stat -f %T "$MOUNT_POINT" >/dev/null 2>&1 & STAT_PID=$!; then
                  sleep 2
                  if kill -0 "$STAT_PID" 2>/dev/null; then
                      # stat is hung — mount is stale
                      kill "$STAT_PID" 2>/dev/null
                      wait "$STAT_PID" 2>/dev/null
                      echo "$(date): Stale mount detected, force unmounting"
                      diskutil unmount force "$MOUNT_POINT" 2>/dev/null || umount -f "$MOUNT_POINT" 2>/dev/null
                      sleep 1
                  else
                      wait "$STAT_PID"
                      if [ $? -eq 0 ]; then
                          # Mount is healthy
                          exit 0
                      else
                          echo "$(date): Mount check failed, force unmounting"
                          diskutil unmount force "$MOUNT_POINT" 2>/dev/null || umount -f "$MOUNT_POINT" 2>/dev/null
                          sleep 1
                      fi
                  fi
              fi
          fi

          # Ensure mount point exists (script runs as root via launchd)
          mkdir -p "$MOUNT_POINT"
          chown {{ mount_user }}:{{ mount_group }} "$MOUNT_POINT"

          echo "$(date): Mounting //$NAS_HOST/$SHARE_NAME to $MOUNT_POINT"

          # Mount as dev so files are owned by dev
          if su -l {{ mount_user }} -c "/sbin/mount_smbfs -f 0664 -d 0775 '//$USERNAME:$PASSWORD@$NAS_HOST/$SHARE_NAME' '$MOUNT_POINT'"; then
              echo "$(date): Mount successful"
              exit 0
          else
              echo "$(date): Mount failed, will retry next interval"
              exit 1
          fi
        mode: '0755'

    - name: Create LaunchDaemon for auto-mount
      copy:
        dest: /Library/LaunchDaemons/com.ycluster.mount-near1.plist
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.ycluster.mount-near1</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/usr/local/bin/mount-near1.sh</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>StartInterval</key>
              <integer>60</integer>
              <key>StandardOutPath</key>
              <string>/tmp/mount-near1.log</string>
              <key>StandardErrorPath</key>
              <string>/tmp/mount-near1.log</string>
          </dict>
          </plist>
        mode: '0644'
      notify: load launchdaemon

    - name: Mount now (if not already mounted)
      shell: |
        if ! mount | grep -q "{{ mount_point }}"; then
          /usr/local/bin/mount-near1.sh &
        fi
      changed_when: false

  handlers:
    - name: load launchdaemon
      shell: |
        launchctl unload /Library/LaunchDaemons/com.ycluster.mount-near1.plist 2>/dev/null || true
        launchctl load /Library/LaunchDaemons/com.ycluster.mount-near1.plist


- name: Mount NFS subtrees on Linux nodes
  hosts: core:compute
  become: yes
  tags: [nfs]
  tasks:
    - name: Skip hosts with no enabled NAS NFS mounts
      meta: end_host
      when: >-
        nas_nfs_mounts_effective | default([])
        | selectattr('enabled', 'defined')
        | selectattr('enabled') | list | length == 0

    - name: Install NFS client utilities
      apt:
        name: nfs-common
        state: present
        update_cache: yes

    - name: Compute the systemd mount unit names
      command: "systemd-escape --path --suffix=mount {{ item.mount_point }}"
      loop: "{{ nas_nfs_mounts_effective }}"
      changed_when: false
      register: nas_nfs_mount_units

    - name: Disable stopped NAS NFS mounts that are now disabled
      systemd:
        name: "{{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}"
        enabled: no
        state: stopped
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: not (item.enabled | bool)
      register: nas_nfs_disable
      ignore_errors: true

    - name: Remove disabled NAS NFS mount units
      file:
        path: "/etc/systemd/system/{{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}"
        state: absent
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: not (item.enabled | bool)
      notify: reload systemd

    - name: Remove any stale wrongly-named VM-data mount unit
      file:
        path: /etc/systemd/system/vm-data.mount
        state: absent
      notify: reload systemd

    - name: Compute the stale NAS mount unit names
      command: "systemd-escape --path --suffix=mount {{ item }}"
      loop: "{{ nas_nfs_stale_mounts | default([]) }}"
      changed_when: false
      register: nas_nfs_stale_units

    - name: Disable stale NAS NFS mounts
      systemd:
        name: "{{ nas_nfs_stale_units.results[nas_nfs_stale_idx].stdout }}"
        enabled: no
        state: stopped
      loop: "{{ nas_nfs_stale_mounts | default([]) }}"
      loop_control:
        index_var: nas_nfs_stale_idx
      ignore_errors: true

    - name: Remove stale NAS NFS mount units
      file:
        path: "/etc/systemd/system/{{ nas_nfs_stale_units.results[nas_nfs_stale_idx].stdout }}"
        state: absent
      loop: "{{ nas_nfs_stale_mounts | default([]) }}"
      loop_control:
        index_var: nas_nfs_stale_idx
      notify: reload systemd

    - name: Create NAS NFS mount points
      file:
        path: "{{ item.mount_point }}"
        state: directory
        mode: '0755'
      loop: "{{ nas_nfs_mounts_effective }}"
      when: item.enabled | bool

    - name: Create systemd mount units for NAS NFS
      copy:
        dest: "/etc/systemd/system/{{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}"
        content: |
          [Unit]
          Description=NAS NFS mount {{ item.name }}
          After=network-online.target
          Wants=network-online.target

          [Mount]
          What={{ item.server }}:{{ item.export }}
          Where={{ item.mount_point }}
          Type=nfs
          Options={{ item.options }}
          TimeoutSec={{ item.timeout_sec | default(60) }}

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
      notify: reload systemd

    - name: Flush handlers
      meta: flush_handlers

    - name: Enable and start the NAS NFS mounts
      systemd:
        name: "{{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}"
        enabled: yes
        state: started
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool

    - name: Install per-mount NAS NFS retry services
      copy:
        dest: "/etc/systemd/system/nas-nfs-mount-retry-{{ nas_nfs_mounts_idx }}.service"
        content: |
          [Unit]
          Description=Retry NAS NFS mount {{ item.mount_point }}
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          TimeoutStartSec=5min
          # systemd 255 has no mount-point condition, so the probe decides
          # whether the retry runs. Healthy hosts skip the start entirely.
          ExecCondition=/bin/sh -c '! mountpoint -q {{ item.mount_point }}'
          ExecStart=-/bin/sh -c 'systemctl start "{{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}"'
        mode: '0644'
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
      notify: reload systemd

    - name: Install per-mount NAS NFS retry timers
      copy:
        dest: "/etc/systemd/system/nas-nfs-mount-retry-{{ nas_nfs_mounts_idx }}.timer"
        content: |
          [Unit]
          Description=Retry NAS NFS mount {{ item.mount_point }}

          [Timer]
          OnBootSec=30s
          OnUnitInactiveSec=30s
          AccuracySec=1s
          Persistent=true

          [Install]
          WantedBy=timers.target
        mode: '0644'
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
      notify: reload systemd

    - name: Retire the single-service NAS NFS retry units
      systemd:
        name: "nas-nfs-mount-retry.{{ item }}"
        enabled: false
        state: stopped
      loop: [timer, service]
      failed_when: false

    - name: Remove the retired NAS NFS retry unit files
      file:
        path: "/etc/systemd/system/nas-nfs-mount-retry.{{ item }}"
        state: absent
      loop: [service, timer]

    - name: Create the systemd drop-in directories for mount ordering
      file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        mode: '0755'
      loop: [incus, vm-reconciler]

    - name: Order Incus after each enabled NAS NFS mount
      copy:
        dest: "/etc/systemd/system/incus.service.d/10-nas-mount-{{ nas_nfs_mounts_idx }}.conf"
        content: |
          [Unit]
          Wants={{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}
          After={{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}
        mode: '0644'
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
      notify: reload systemd

    - name: Order the VM reconciler after each enabled NAS NFS mount
      copy:
        dest: "/etc/systemd/system/vm-reconciler.service.d/10-nas-mount-{{ nas_nfs_mounts_idx }}.conf"
        content: |
          [Unit]
          Wants={{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}
          After={{ nas_nfs_mount_units.results[nas_nfs_mounts_idx].stdout }}
        mode: '0644'
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
      notify: reload systemd

    - name: Enable and start the per-mount NAS NFS retry timers
      systemd:
        name: "nas-nfs-mount-retry-{{ nas_nfs_mounts_idx }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: item.enabled | bool
    - name: Check the NAS NFS mounts are present
      command: "mountpoint -q {{ item.mount_point }}"
      failed_when: false
      changed_when: false
      loop: "{{ nas_nfs_mounts_effective }}"
      when: item.enabled | bool
      register: nas_nfs_mounted

    - name: Fail if a NAS NFS mount is missing
      fail:
        msg: "{{ item.mount_point }} is not an active mount ({{ item.name }})."
      loop: "{{ nas_nfs_mounts_effective }}"
      loop_control:
        index_var: nas_nfs_mounts_idx
      when: >-
        item.enabled | bool
        and nas_nfs_mounted.results[nas_nfs_mounts_idx].rc | default(1) != 0

    - name: Install the VM-data NFS mount check (for scripts)
      copy:
        src: "{{ playbook_dir }}/../scripts/check-vm-data-nfs-mount.sh"
        dest: /usr/local/bin/check-vm-data-nfs-mount
        mode: '0755'
      when: vm_data_nfs | default(false) | bool

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
