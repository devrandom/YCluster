---
# Application Services - TLS, external connectivity

- import_playbook: install-tls-config.yml

# Apps

- import_playbook: mount-nas-share.yml
# - import_playbook: build-open-webui.yml
- import_playbook: install-open-webui.yml
# Stage instance: install half only (build is gated by tags: [build, never])
- import_playbook: open-webui-stage.yml
# Inference gateway. After open-webui: the auth sidecar validates API keys
# against open-webui's database.
- import_playbook: install-local-ai-proxy.yml

# Document parsing backend (MinerU). Per-host opt-in via mineru_enabled
# in host_vars/<node>.yml — Linux/Nvidia (nv*) hosts only. The macos
# variant is in macos/setup-mineru.yml. Both write to the same proxy
# model names (document-parse, mineru-parse).
- import_playbook: install-mineru.yml

# ComfyUI (MiniMax H3) backend. Per-host opt-in via comfyui_enabled in
# host_vars/<node>.yml — Linux/Nvidia (nv*) hosts only. This is a
# device-bound, non-OpenAI service: unlike MinerU it is NOT registered with
# local-ai-proxy; it is exposed via the frontend/frp reverse proxy. See
# docs/design/comfyui-h3.md.
- import_playbook: install-comfyui.yml

# NAS setup (targets the nas group; no-op on clusters without one)
- import_playbook: setup-nas.yml

# frp external connectivity (client on core, server on frontend,
# alt vhost on storage leader). Requires app/build-frp.yml first.
- import_playbook: install-frp.yml
- import_playbook: install-frp-server.yml
- import_playbook: install-frp-alt-vhost.yml

# Zulip (storage leader, leader-gated)
- import_playbook: install-zulip.yml

# Authentik (storage leader, leader-gated)
- import_playbook: install-authentik.yml

# Forgejo (storage leader, leader-gated; OIDC client in Authentik)
- import_playbook: install-forgejo.yml

# Vikunja (storage leader, leader-gated; OIDC client in Authentik)
- import_playbook: install-vikunja.yml

# WhisperX (compute, opt-in via whisperx_enabled in host_vars)
- import_playbook: install-whisperx.yml
