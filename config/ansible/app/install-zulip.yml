---
# Install Zulip on storage nodes (leader-only, like Authentik / Open-WebUI).
#
# Scope of this skeleton (docs/design/zulip.md, implementation order steps
# 1-2, plus the nginx vhost + DOCKER-USER egress filter from the network
# isolation decision):
#   - docker compose stack on the storage leader under ycluster-apps.target:
#     `zulip` + bundled memcached / rabbitmq / redis (no bundled postgres —
#     Zulip uses the cluster's shared Postgres on the leader).
#   - RBD bind mounts under /rbd/misc/zulip; systemd unit + manager script.
#   - Postgres `zulip` DB + role (scram-sha-256, C.UTF-8 collation).
#   - Internal nginx vhost for zulip.xc and the external zulip.<domain>
#     surface, rendered via certbot-manager.
#   - DOCKER-USER egress filter pinning the Zulip bridge subnet, applied
#     unconditionally on every storage node (source-scoped, inert off the
#     leader). This is a firewall change and is staged in the playbook for
#     operator sign-off per AGENTS.md; set `zulip_egress_filter_enabled:
#     false` to veto it and fall back to ingress-only isolation.
#
# SAML (design step 5) is part of this install: authentik-manager writes the
# `zulip` SAML provider blueprint, and zulip-manager fetches the IdP signing
# cert from Authentik. Auth backends are pinned by `zulip_auth_backends`
# below: steady state is SAML-only once the operator's SAML round trip is
# validated. Email/password is bootstrap-only (create the realm + first
# owner); matching Zulip's requirement that EmailAuthBackend be present for
# initial org creation. The flip is purely a var — no code change is needed
# per install. A fresh install overrides it with `-e` on the bootstrap run
# (EmailAuthBackend or "" to create the org), then re-runs with the committed
# SAMLAuthBackend default for steady state.
- name: Install Zulip on storage nodes
  hosts: storage
  become: yes
  vars:
    zulip_version: "12.1-0"
    zulip_port: "{{ zulip_local_port | default('8484') }}"
    # Fixed compose subnet the egress filter references. Single source for
    # the filter; the systemd unit passes it to zulip-manager, which writes
    # it into the compose env as ZULIP_EGRESS_SUBNET (file: zulip-compose.yaml).
    zulip_egress_subnet: "172.16.0.0/24"
    # Postgres dest scope for the egress filter — matches the cluster's
    # existing pg_hba rule (host all all 172.0.0.0/8 scram-sha-256).
    zulip_egress_postgres_scope: "172.0.0.0/8"
    zulip_egress_filter_enabled: true
    # Auth backends. Steady state is "SAMLAuthBackend" (SAML-only) once the
    # operator's SAML round trip is validated. Override per run with -e,
    # e.g. a fresh install bootstraps the org with
    #   -e zulip_auth_backends='EmailAuthBackend'
    # (Zulip requires EmailAuthBackend to create the initial realm/owner) and
    # re-runs with the committed default for steady state. Break-glass: flip
    # back to "EmailAuthBackend,SAMLAuthBackend" if Authentik degrades.
    zulip_auth_backends: "SAMLAuthBackend"
    # Auto-join: Zulip creates a new org with `invite_required` on (only admins
    # can invite), which blocks SAML users from registering. Set it off so any
    # Authentik SAML user whose email is not in Zulip yet auto-registers as a
    # MEMBER on first login — no invitation required. Override per run with
    # `-e zulip_auto_join=false` to keep invitation-only signup. Applied by a
    # leader task below, gated on zulip.service being active (the realm only
    # exists after org bootstrap, so the first fresh-install run skips it).
    zulip_auto_join: true
    # Mobile push via Zulip's hosted push service (push.zulipchat.com). On by
    # default; the Zulip container needs this as an extra egress hole on 443.
    zulip_push_notifications: true
    # Data we share with Zulip. Off by decision: we get the service without
    # sending the maintainers usage statistics (basic org metadata is still
    # sent as part of registering with the service regardless).
    zulip_push_submit_usage_statistics: false
    # Contact email for the Zulip server / push service point of contact.
    # Deployment-specific, so it lives in ycluster-private
    # (group_vars/storage/zulip.yml -> zulip_admin_email) — deliberately not
    # defined here. The unit passes it through only when present; zulip-manager
    # falls back to a derived zulip-admin@<external host> otherwise.
  tasks:
    - name: Check if this host is the storage leader
      shell: mountpoint -q /rbd/user
      register: rbd_user_mounted
      failed_when: false
      changed_when: false

    - name: Set storage leader fact
      set_fact:
        is_storage_leader: "{{ rbd_user_mounted.rc == 0 }}"

    - name: Display config
      debug:
        msg: "Installing Zulip {{ zulip_version }} on port {{ zulip_port }}, egress subnet {{ zulip_egress_subnet }}, is_storage_leader: {{ is_storage_leader }}"

    - name: Create Zulip configuration directory
      file:
        path: /etc/zulip
        state: directory
        mode: '0755'

    - name: Copy Docker Compose file for Zulip
      copy:
        src: files/zulip-compose.yaml
        dest: /etc/zulip/docker-compose.yml
        mode: '0644'
      notify: restart zulip

    - name: Create cluster scripts directory
      file:
        path: /usr/local/lib/cluster
        state: directory
        mode: '0755'

    - name: Create Zulip manager script
      copy:
        src: files/zulip-manager
        dest: /usr/local/lib/cluster/zulip-manager
        mode: '0755'
      notify: restart zulip

    - name: Create zulip systemd service
      copy:
        dest: /etc/systemd/system/zulip.service
        content: |
          [Unit]
          Description=Zulip (cluster chat)
          After=network.target docker.service misc-rbd.service
          Requires=docker.service misc-rbd.service
          PartOf=ycluster-apps.target

          [Service]
          Type=exec
          ExecStart=/usr/local/lib/cluster/zulip-manager start
          ExecStop=/usr/local/lib/cluster/zulip-manager stop
          TimeoutStartSec=600
          TimeoutStopSec=90
          User=root
          Restart=on-failure
          RestartSec=10
          Environment=ZULIP_VERSION={{ zulip_version }}
          Environment=ZULIP_PORT={{ zulip_port }}
          Environment=ZULIP_EGRESS_SUBNET={{ zulip_egress_subnet }}
          # Local port of the Authentik API on the same leader; zulip-manager
          # uses it to fetch the SAML IdP signing cert.
          Environment=AUTHENTIK_PORT={{ authentik_local_port | default('9300') }}
          # Explicit auth-backend override; omitted by default so zulip-manager
          # auto-decides (email-only -> +SAML once the IdP cert is fetchable).
          {% if zulip_auth_backends %}
          Environment=ZULIP_AUTH_BACKENDS={{ zulip_auth_backends }}
          {% endif %}
          # Hosted push service: enables push via the Zulip bouncer, and keeps
          # usage-statistics sharing off (see vars above).
          Environment=ZULIP_PUSH_NOTIFICATIONS={{ zulip_push_notifications | bool }}
          Environment=ZULIP_SUBMIT_USAGE_STATISTICS={{ zulip_push_submit_usage_statistics | bool }}
          # Administrator contact, set in ycluster-private group_vars/storage.
          # The push service uses it as its point of contact, so when present it
          # is passed through to SETTING_ZULIP_ADMINISTRATOR. Omitted when the
          # private var is absent: zulip-manager falls back to the derived
          # zulip-admin@<external host>.
          {% if zulip_admin_email | default('') %}
          Environment=ZULIP_ADMIN_EMAIL={{ zulip_admin_email }}
          {% endif %}

          [Install]
          WantedBy=ycluster-apps.target
      register: zulip_service_file
      notify: restart zulip

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Re-enable zulip service to update symlinks
      command: systemctl reenable zulip.service
      when: zulip_service_file.changed

    - name: Enable zulip service (part of storage-apps target)
      systemd:
        name: zulip.service
        enabled: yes

    - name: Configure PostgreSQL for Zulip
      when: is_storage_leader
      block:
        # Ensure the secrets exist in etcd before reading the Postgres
        # password, so the role password below matches what Zulip reads at
        # first boot (both come from /cluster/config/zulip/postgres_password).
        - name: Ensure Zulip secrets exist in etcd
          command: /usr/local/lib/cluster/zulip-manager ensure-secrets
          environment: "{{ etcd_client_env }}"
          changed_when: false

        - name: Read Zulip Postgres password from etcd
          command: etcdctl get /cluster/config/zulip/postgres_password --print-value-only
          environment: "{{ etcd_client_env }}"
          register: zulip_postgres_password
          changed_when: false

        - name: Check if the Zulip database exists
          become_user: postgres
          command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='zulip'"
          register: zulip_db_exists
          changed_when: false

        # Zulip's create-db.sql uses C.UTF-8 collation; the cluster's
        # initdb runs under LC_ALL=C.UTF-8 so the default usually matches,
        # but create the DB explicitly so a differing cluster default can't
        # break the Zulip migrations. See docs/design/zulip.md (collation).
        - name: Create Zulip database with C.UTF-8 collation
          become_user: postgres
          command: createdb -T template0 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 zulip
          when: "'1' not in zulip_db_exists.stdout_lines"

        - name: Create PostgreSQL user for Zulip
          postgresql_user:
            name: zulip
            password: "{{ zulip_postgres_password.stdout | trim }}"
            db: zulip
            priv: ALL
            state: present
          become_user: postgres

        - name: Grant schema permissions to zulip user
          postgresql_privs:
            database: zulip
            state: present
            privs: ALL
            type: schema
            objs: public
            roles: zulip
          become_user: postgres

        - name: Make zulip owner of the database
          postgresql_owner:
            db: zulip
            obj_name: zulip
            new_owner: zulip
            obj_type: database
          become_user: postgres

    # Post-bootstrap realm config. `invite_required` lives in the Zulip DB and
    # only exists after the org is created, so these are gated on zulip.service
    # being active — a truly fresh install has no realm/container yet and skips;
    # the post-bootstrap re-run (e.g. the SAML-only flip re-run) applies it.
    - name: Check whether Zulip is up (realm config applies post-bootstrap)
      command: systemctl is-active zulip.service
      register: zulip_service_active
      changed_when: false
      failed_when: false
      when: is_storage_leader

    - name: Allow SAML users to auto-join Zulip (invite_required off)
      shell: >
        docker compose -p zulip exec -T zulip su zulip -c
        '/home/zulip/deployments/current/manage.py shell'
      args:
        chdir: /etc/zulip
        stdin: |
          from zerver.models import Realm
          from zerver.actions.realm_settings import do_set_realm_property
          r = Realm.objects.filter(string_id="").first()
          if r is None:
              print("NO_REALM")
          elif r.invite_required:
              do_set_realm_property(r, "invite_required", False, acting_user=None)
              print("ENABLED")
          else:
              print("ALREADY_OFF")
      register: zulip_autojoin_result
      changed_when: "'ENABLED' in zulip_autojoin_result.stdout"
      when:
        - is_storage_leader
        - zulip_auto_join | bool
        - zulip_service_active.stdout == "active"

    - name: Ensure the VM idle alert bot exists and its credentials are in etcd
      command: /usr/local/lib/cluster/zulip-manager ensure-vm-idle-bot
      environment: "{{ etcd_client_env }}"
      changed_when: false
      when:
        - is_storage_leader
        - zulip_service_active.stdout == "active"

    # Internal vhost: zulip.xc (plain HTTP, restricted to the cluster subnet),
    # served on the storage VIP. Same shape as authentik-internal.conf.j2.
    - name: Install Zulip internal nginx site (zulip.xc)
      template:
        src: templates/zulip-internal.conf.j2
        dest: /etc/nginx/sites-available/zulip-internal
        mode: '0644'
      notify: reload nginx

    - name: Enable Zulip internal nginx site
      file:
        src: /etc/nginx/sites-available/zulip-internal
        dest: /etc/nginx/sites-enabled/zulip-internal
        state: link
      notify: reload nginx

    # External vhost: zulip.<domain>, rendered by certbot-manager. The
    # `_zulip` suffix in the template filename is load-bearing — certbot-manager
    # derives the external subdomain from everything after the last `_`.
    - name: Install Zulip nginx vhost template
      template:
        src: files/zulip_zulip.conf.j2
        dest: /etc/nginx/templates/zulip_zulip.conf.j2
        mode: '0644'
        variable_start_string: '(('
        variable_end_string: '))'
        block_start_string: '((#'
        block_end_string: '#))'
      notify: reload nginx

    # zulip-locations.conf is included by zulip_zulip.conf.j2 (single source:
    # both the plain and the frp tunnel landing listeners). The `(( port ))`
    # marker is substituted here by install-zulip.yml.
    - name: Install Zulip locations (shared include for plain + proxy listeners)
      template:
        src: files/zulip-locations.conf
        dest: /etc/nginx/zulip-locations.conf
        mode: '0644'
        variable_start_string: '(('
        variable_end_string: '))'
        block_start_string: '((#'
        block_end_string: '#))'
      vars:
        port: "{{ zulip_port }}"
      notify: reload nginx

    - name: Generate Zulip nginx configuration from template
      command: "/usr/local/bin/certbot-manager update-nginx{% if web_services_force_local | default(false) %} --local{% endif %}"
      environment: "{{ etcd_client_env | default({}) }}"
      register: nginx_update_result
      changed_when: "'configuration updated' in nginx_update_result.stdout"
      failed_when: nginx_update_result.rc != 0
      notify: reload nginx

    - name: Enable Zulip nginx site
      file:
        src: /etc/nginx/sites-available/zulip_zulip
        dest: /etc/nginx/sites-enabled/zulip_zulip
        state: link
      notify: reload nginx

    # DOCKER-USER egress filter: allow the Zulip bridge subnet to reach only
    # itself (memcached/rabbitmq/redis), the leader's Postgres, and the hosted
    # push bouncer, then DROP the rest. Implemented as a dedicated ZULIP-EGRESS
    # chain that is flushed and rebuilt on every run (so the push bouncer's
    # addresses stay current), plus a systemd timer to keep re-resolving
    # between playbook runs. Applied unconditionally on every storage node —
    # source-scoped to the pinned subnet, so it's inert wherever the Zulip
    # stack isn't running. A firewall change staged for operator sign-off
    # (AGENTS.md).
    #
    # The same run also writes the container /etc/hosts source that the compose
    # `zulip` service mounts read-only (zulip-compose.yaml): even with the 443
    # hole open, the container can't resolve push.zulipchat.com because DNS
    # egress is itself DROPped, so we give it the resolved bouncer addresses
    # directly. Refreshed on the same timer, so bouncer IP rotation reaches
    # the running container without a restart and without widening DNS egress.
    - name: Install Zulip egress filter script
      copy:
        dest: /usr/local/lib/cluster/setup-zulip-egress
        mode: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail
          ZS="172.16.0.0/24"              # zulip_egress_subnet — keep in sync with install-zulip.yml
          POSTGRES="172.0.0.0/8"          # matches the cluster pg_hba rule (tcp/5432)
          PUSH_HOST="push.zulipchat.com"  # hosted push bouncer (Akamai; IPs change)
          PUSH_HOSTS_FILE="${ZULIP_PUSH_HOSTS_FILE:-/etc/zulip/push-hosts}"

          iptables -N DOCKER-USER 2>/dev/null || true

          # Rebuild the stack's egress policy from scratch each run, in a
          # dedicated chain, so DNS drift never leaves stale push addresses
          # behind. Idempotent by construction (flush + repopulate).
          iptables -N ZULIP-EGRESS 2>/dev/null || true
          iptables -F ZULIP-EGRESS

          # The Zulip bridge subnet can reach itself (memcached / rabbitmq /
          # redis) and the leader's Postgres...
          iptables -A ZULIP-EGRESS -s "$ZS" -d "$ZS" -p tcp -j ACCEPT
          iptables -A ZULIP-EGRESS -s "$ZS" -d "$POSTGRES" -p tcp --dport 5432 -j ACCEPT

          # Resolve the push bouncer A records once, then consume that same
          # list for both the firewall hole and the /etc/hosts entries below so
          # the two can never drift. IPv4 only — the compose bridge is IPv4 and
          # the stack has no IPv6 egress path. If resolution returns nothing
          # (transient DNS flap), the hole stays closed and the hosts entries
          # simply won't list the bouncer; the timer retries in 15 min.
          PUSH_IPS=()
          if command -v getent >/dev/null 2>&1; then
              mapfile -t PUSH_IPS < <(getent ahostsv4 "$PUSH_HOST" \
                  | awk '{print $1}' | sort -u)
          fi

          # ...and the hosted push bouncer on 443, one ACCEPT per current
          # address, refreshed by the systemd timer as Akamai shuffles IPs.
          for ip in "${PUSH_IPS[@]}"; do
              [ -n "$ip" ] || continue
              iptables -A ZULIP-EGRESS -s "$ZS" -d "$ip" -p tcp --dport 443 -j ACCEPT
          done

          # DROP everything else from the Zulip subnet.
          iptables -A ZULIP-EGRESS -s "$ZS" -j DROP

          # Point DOCKER-USER at our chain, exactly once, at the top (before
          # docker's trailing RETURN); -D then -I makes the jump idempotent.
          iptables -D DOCKER-USER -j ZULIP-EGRESS 2>/dev/null || true
          iptables -I DOCKER-USER 1 -j ZULIP-EGRESS

          # Best-effort drop the legacy flat rules this script used to write
          # directly into DOCKER-USER, now superseded by the chain above. Done
          # after the jump is live so there is never a gap where the subnet is
          # unrestricted.
          iptables -D DOCKER-USER -s "$ZS" -j DROP 2>/dev/null || true
          iptables -D DOCKER-USER -s "$ZS" -d "$POSTGRES" -p tcp --dport 5432 -j ACCEPT 2>/dev/null || true
          iptables -D DOCKER-USER -s "$ZS" -d "$ZS" -p tcp -j ACCEPT 2>/dev/null || true

          # Rewrite the container /etc/hosts source (bind-mounted read-only at
          # /etc/hosts in zulip-compose.yaml). Because the mount shadows
          # docker's generated file, reproduce the base entries the container
          # otherwise relies on — localhost and host.docker.internal (the docker0
          # `host-gateway` address, which the Postgres connection uses) — then
          # append the push bouncer addresses. Refreshing this on the same timer
          # keeps the container current without a restart and means the stack
          # never needs DNS egress at all.
          host_gw="$(ip -4 addr show docker0 | awk '/inet /{print $2}' \
              | cut -d/ -f1)"
          # Write to a temp then copy over the destination *in place*. A bind
          # mount pins the source inode at container start, so mv-swapping the
          # file would leave the running container reading the old inode; the
          # truncate-and-rewrite here keeps the same inode and the update is
          # visible live.
          tmp="$(mktemp "${PUSH_HOSTS_FILE}.XXXXXX")"
          {
              echo "# managed by setup-zulip-egress (zulip-egress-refresh.timer)"
              printf '127.0.0.1\tlocalhost\n'
              printf '::1\tlocalhost ip6-localhost ip6-loopback\n'
              if [ -n "$host_gw" ]; then
                  printf '%s\thost.docker.internal\n' "$host_gw"
              fi
              for ip in "${PUSH_IPS[@]}"; do
                  [ -n "$ip" ] || continue
                  printf '%s\t%s\n' "$ip" "$PUSH_HOST"
              done
          } > "$tmp"
          cat "$tmp" > "$PUSH_HOSTS_FILE"
          rm "$tmp"
          chmod 644 "$PUSH_HOSTS_FILE"

          iptables-save > /etc/iptables/rules.v4
      when: zulip_egress_filter_enabled | bool

    - name: Check whether the Zulip egress chain is present in DOCKER-USER
      command: iptables -C DOCKER-USER -j ZULIP-EGRESS
      register: zulip_egress_check
      failed_when: false
      changed_when: false
      when: zulip_egress_filter_enabled | bool

    - name: Apply Zulip egress rules to DOCKER-USER
      command: /usr/local/lib/cluster/setup-zulip-egress
      when:
        - zulip_egress_filter_enabled | bool
        - zulip_egress_check.rc != 0

    # Keep the push bouncer hole current between playbook runs:
    # push.zulipchat.com sits on Akamai and its addresses change, so re-resolve
    # and rebuild the egress rules on an interval. Runs on all storage nodes —
    # the chain is source-scoped and inert where the stack isn't running.
    - name: Install Zulip egress refresh service
      copy:
        dest: /etc/systemd/system/zulip-egress-refresh.service
        content: |
          [Unit]
          Description=Refresh Zulip egress filter (dynamic push bouncer IPs)
          After=network-online.target docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/lib/cluster/setup-zulip-egress
      when: zulip_egress_filter_enabled | bool

    - name: Install Zulip egress refresh timer
      copy:
        dest: /etc/systemd/system/zulip-egress-refresh.timer
        content: |
          [Unit]
          Description=Periodically refresh Zulip egress filter dynamic IPs

          [Timer]
          OnCalendar=*:0/15
          RandomizedDelaySec=300
          Persistent=true

          [Install]
          WantedBy=timers.target
      when: zulip_egress_filter_enabled | bool

    - name: Enable Zulip egress refresh timer
      systemd:
        name: zulip-egress-refresh.timer
        state: started
        enabled: yes
        daemon_reload: yes
      when: zulip_egress_filter_enabled | bool

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    # Leader-only: the unit Requires=misc-rbd.service and /rbd/misc mounts
    # only on the leader, so a restart on a non-leader would fail to start.
    # Picks up compose/manager/unit changes (brief chat outage).
    - name: restart zulip
      systemd:
        name: zulip.service
        state: restarted
        daemon_reload: yes
      when: is_storage_leader

    # Non-leaders must not run zulip (the leader election owns it). Stop and
    # disable so a stale instance from a previous leader tenure doesn't
    # survive a re-provision.
    - name: Stop zulip on non-leaders
      systemd:
        name: zulip.service
        state: stopped
        enabled: no
      when: not is_storage_leader
