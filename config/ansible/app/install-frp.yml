---
# Install frp client (frpc) on core nodes. Runs alongside rathole during
# the parallel-run soak; frp units are enabled but the disjoint port
# layout (17080/17443/etc.) means rathole traffic is unaffected.
#
# The frpc-start wrapper reads /cluster/nodes/frp/config from etcd at
# startup and renders the client TOML from a jinja template — same
# pattern as the rathole client.
- name: Install frp client configuration and service
  hosts: core
  # No `become` for compatibility with unprivileged controller user (the
  # delegate_to: localhost stat must run as the controller, not sudo).
  vars:
    frp_server_binary: "/usr/local/bin/frps"
    frp_client_binary: "/usr/local/bin/frpc"
    frp_server_binary_src: "/opt/src/frp/bin/frps"
    frp_client_binary_src: "/opt/src/frp/bin/frpc"

  tasks:
    - name: Check if frp binaries exist on buildhost
      stat:
        path: "{{ item }}"
      register: frp_binary_buildhost
      loop:
        - "{{ frp_server_binary_src }}"
        - "{{ frp_client_binary_src }}"
      delegate_to: "{{ buildhost }}"

    - name: Fail if frp binaries not found
      fail:
        msg: "frp binaries not found at {{ frp_server_binary_src }} / {{ frp_client_binary_src }} on {{ buildhost }}. Run app/build-frp.yml first."
      when: frp_binary_buildhost.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: Fetch frp binaries from buildhost to controller
      fetch:
        src: "{{ item }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      loop:
        - "{{ frp_server_binary_src }}"
        - "{{ frp_client_binary_src }}"
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Copy frpc binary to target
      copy:
        src: "{{ build_cache_dir }}/{{ frp_client_binary_src | basename }}"
        dest: "{{ frp_client_binary }}"
        mode: '0755'
        owner: root
        group: root
      notify: restart frpc

    - name: Create frp config directory
      file:
        path: /etc/frp
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Install frpc config template
      copy:
        src: frpc.toml.j2
        dest: /etc/frp/client-config.toml.j2
        mode: '0644'
        owner: root
        group: root
      notify: restart frpc

    - name: Install frpc SSH-only config template
      copy:
        src: frpc-ssh.toml.j2
        dest: /etc/frp/ssh-client-config.toml.j2
        mode: '0644'
        owner: root
        group: root
      notify: restart frpc-ssh

    - name: Create frpc client startup script
      copy:
        src: frpc-start
        dest: /usr/local/bin/frpc-start
        mode: '0755'
        owner: root
        group: root
      notify: restart frpc

    - name: Create frpc SSH client startup script
      copy:
        src: frpc-ssh-start
        dest: /usr/local/bin/frpc-ssh-start
        mode: '0755'
        owner: root
        group: root
      notify: restart frpc-ssh

    - name: Create frpc systemd service
      copy:
        src: frpc.service
        dest: /etc/systemd/system/frpc.service
        mode: '0644'
        owner: root
        group: root
      notify:
        - reload systemd
        - restart frpc

    - name: Create frpc SSH systemd service
      copy:
        src: frpc-ssh.service
        dest: /etc/systemd/system/frpc-ssh.service
        mode: '0644'
        owner: root
        group: root
      notify:
        - reload systemd
        - restart frpc-ssh

    # frpc is leader-gated: frps only accepts one registration per tunnel
    # name, so http/https must come from the leader. storage-leader-election
    # starts/stops it. The notify handlers below pick up config changes only
    # on the leader (matching the open-webui pattern), since a restart on a
    # non-leader would fail to start (frpc service is enabled=no there).
    # frpc-ssh stays enabled on every core node since each one owns a unique
    # ssh tunnel name, so it gets a separate unconditional handler.
    - name: Detect storage leader (frpc is leader-gated, see storage-leader-election)
      shell: mountpoint -q /rbd/user
      register: rbd_user_mounted
      failed_when: false
      changed_when: false

    - name: Set storage leader fact
      set_fact:
        is_storage_leader: "{{ rbd_user_mounted.rc == 0 }}"

    - name: frpc service is controlled by storage leader election
      systemd:
        name: frpc
        enabled: no
        daemon_reload: yes

    - name: Enable and start frpc SSH service
      systemd:
        name: frpc-ssh
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    # Leader-only: frpc is enabled=no on non-leaders (storage-leader-election
    # starts it on the leader only), so a restart there would fail. Picks up
    # binary / config / startup-script / unit changes on the leader instead
    # of leaving the running frpc on stale config. Same pattern as
    # install-open-webui.yml.
    - name: restart frpc
      systemd:
        name: frpc
        state: restarted
        daemon_reload: yes
      when: is_storage_leader

    # frpc-ssh runs on every core node (each owns a unique ssh tunnel name),
    # so its restart is unconditional.
    - name: restart frpc-ssh
      systemd:
        name: frpc-ssh
        state: restarted
        daemon_reload: yes
