---
# Install MinerU (opendatalab/MinerU 3.4.x) on Linux/Nvidia GPU nodes
# (nv*) as a podman container, fronted by local-ai-proxy + nginx.
# Listens on :8000 with no API key — cluster auth is handled upstream
# by local-ai-proxy + nginx (Open-WebUI api_key table). Register each
# MinerU node with:
#
#   ycluster inference add http://nv<N>.xc:8000 document-parse
#   ycluster inference add http://nv<N>.xc:8000 mineru-parse
#
# Clients then hit https://inference.xc/v1/file_parse like any other
# model; local-ai-proxy rewrites the path to MinerU's native /file_parse
# and routes by the `model` form field (or X-Model header). See
# docs/design/mineru.md for the technology choice and architecture,
# docs/design/mineru-podman.md for the container refactor rationale,
# and docs/operations/document-extraction.md for ops + troubleshooting.
#
# Container ships `mineru[all]` + torchvision + vllm so all three
# MinerU backends (pipeline / vlm / hybrid) are runtime-switchable
# via the `backend` form field. vllm is auto-selected on Linux for
# the VLM engine (`get_vlm_engine('auto', is_async=True)`), giving
# proper concurrent page processing instead of stepping through
# blocks one at a time.
#
# Image is built once on the first Nvidia host and pushed to the
# cluster registry (registry.xc:5000/mineru:VERSION). Future hosts
# pull instead of rebuild (~2 min vs ~10 min). Cache bind-mounts
# (/home/dev/.cache, /home/dev/mineru.json) reuse the VLM (~2.2 GB)
# and pipeline (~2.5 GB) weights across every redeploy — the image
# itself never bakes them.
#
# Old mineru.service (venv-based) is stopped but left on disk as a
# one-command rollback target. Re-enabling it puts the host back on
# the previous behavior without reinstalling anything.
#
# Gated on the per-host `mineru_enabled` opt-in (host_vars/<node>.yml),
# so the play is a no-op on Nvidia hosts that aren't designated as
# document-parsing nodes. The macos install (macos/setup-mineru.yml)
# uses the same opt-in key for the same reason. macOS is not in scope
# for the podman refactor — Apple Silicon stays on MLX + uv venv.
- name: Install MinerU on Nvidia GPU nodes (podman)
  hosts: nvidia
  become: yes
  vars:
    # Bump VERSION to ship a release (the design doc suggests
    # MAJOR.MINOR.PATCH-all-vllm, e.g. mineru:3.4.3-all-vllm). The
    # build step is keyed on this tag — changing VERSION forces a
    # rebuild + push even if the Containerfile hasn't changed.
    mineru_image_tag: "3.4.3-all-vllm"
    mineru_image_local: "mineru:{{ mineru_image_tag }}"
    mineru_image_registry: "registry.xc:5000/mineru:{{ mineru_image_tag }}"
    mineru_containerfile_src: files/mineru/Containerfile
    mineru_containerfile_dest: /home/dev/.mineru-build/Containerfile
    mineru_uds_wrapper_src: files/mineru/run-mineru-uds.py
    mineru_uds_wrapper_dest: /home/dev/.mineru-build/run-mineru-uds.py
    mineru_service_unit_src: files/mineru/mineru-podman.service
    mineru_service_unit_dest: /etc/systemd/system/mineru-podman.service
    mineru_proxy_unit_src: files/mineru/mineru-podman-proxy.service
    mineru_proxy_unit_dest: /etc/systemd/system/mineru-podman-proxy.service
    # mineru-api inside the container (--network=none) binds a Unix
    # domain socket at this path; the host's socat bridge listens on
    # TCP:{{ mineru_port }} and forwards to it. The directory must be
    # owned by `dev` (UID 1002) because the container's mineru process
    # runs as dev via --userns=keep-id and creates the socket file
    # there. See todo/archive/sandbox-mineru-outbound.md.
    mineru_uds_path: /run/mineru/mineru.sock
    mineru_uds_dir: /run/mineru
    mineru_port: 8000
    mineru_hf_cache: /home/dev/.cache/huggingface
    mineru_mineru_json: /home/dev/mineru.json
    mineru_max_concurrent: 3

  tasks:
    # Skip hosts with no host-usable NVIDIA GPU — either no NVIDIA
    # hardware at all, or every NVIDIA card is bound to vfio-pci for
    # guest passthrough (nv3 case). mineru[all] pulls torch which
    # fails to import CUDA when no GPU is visible to the host driver.
    - name: End play for nodes with no host-visible NVIDIA GPU
      meta: end_host
      when: (ansible_local.gpu.nvidia_host_gpu_count | default(0) | int) == 0

    - name: End play for nodes that have not opted into mineru
      meta: end_host
      when: not (mineru_enabled | default(false))

    # Pre-flight: the Containerfile bakes `useradd --uid 1002 dev`
    # (line 84), and the systemd unit bind-mounts /home/dev/* from the
    # host. `--userns=keep-id` maps container UIDs 1:1 to host UIDs,
    # so the in-container mineru process (running as UID 1002) can
    # only read /home/dev/* if the host's `dev` user is also UID
    # 1002 — otherwise it sees EACCES on every HF cache read and
    # mineru.json parse. The bootstrap endpoint (/bootstrap/nvidia)
    # creates the user with a fixed UID; this task is the deploy-time
    # guard that catches a divergence before it becomes a production
    # outage. Fail with a clear pointer to the bootstrap step.
    - name: Pre-flight check that host dev user is UID 1002
      command: id -u dev
      register: dev_uid
      changed_when: false
      failed_when: dev_uid.stdout != "1002"

    # Podman + NVIDIA CDI are required for `--device nvidia.com/gpu=all`.
    # socat is the TCP→UDS bridge that fronts the container's UDS
    # listener (see mineru-podman-proxy.service + todo/archive/sandbox-mineru-outbound.md). setup-gpu-podman.yml runs
    # before this in the app chain, but check defensively in case the
    # play is run standalone.
    - name: Ensure podman + socat are installed
      apt:
        name:
          - podman
          - socat
        state: present
        update_cache: yes

    - name: Ensure NVIDIA CDI spec exists
      command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
      args:
        creates: /etc/cdi/nvidia.yaml
      changed_when: true

    # registry.xc:5000 is the cluster's insecure (HTTP) registry on
    # the storage VIP. podman defaults to HTTPS, so without this
    # config every push/pull fails with "server gave HTTP response
    # to HTTPS client". Drop-in to /etc/containers/registries.conf.d/
    # so it survives podman upgrades.
    - name: Configure registry.xc as an insecure registry
      copy:
        dest: /etc/containers/registries.conf.d/registry.xc.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [[registry]]
          location = "registry.xc:5000"
          insecure = true

    - name: Ensure systemd lingering for dev (rootless podman survives logout)
      command: loginctl enable-linger dev
      args:
        creates: /var/lib/systemd/linger/dev

    # Verify the registry is reachable. Podman push to an unreachable
    # host hangs and is hard to debug from the playbook recap — fail
    # fast with a clear error.
    - name: Verify registry is reachable for push
      uri:
        url: "http://registry.xc:5000/v2/_catalog"
        method: GET
        timeout: 10
      register: registry_catalog
      failed_when: registry_catalog.status != 200
      run_once: true
      delegate_to: "{{ groups['nvidia'][0] }}"

    # Pre-create cache dirs so the bind-mount targets exist with
    # correct ownership before the container starts. /home/dev/.cache
    # already exists (uv + HF cache are populated by previous installs),
    # but /home/dev/.cache/huggingface may not — the existing venv
    # install uses HF_HOME=/home/dev/.cache/huggingface (default).
    - name: Ensure MinerU HF cache directory exists
      file:
        path: "{{ mineru_hf_cache }}"
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    # Pre-create /run/mineru for the container's UDS bind-mount.
    # mineru-api inside the container binds /run/mineru/mineru.sock;
    # with --network=none there is no TCP listener — a host socat
    # process (mineru-podman-proxy.service) bridges host TCP:8000 to
    # this UDS. Owned by `dev` (UID 1002) because the container runs
    # mineru-api as dev via --userns=keep-id and creates the socket
    # file in this directory. /run is tmpfs — recreated on every
    # boot, so this task must run on every install (not idempotent
    # via creates; that's fine — it's cheap).
    - name: Ensure MinerU UDS directory exists
      file:
        path: "{{ mineru_uds_dir }}"
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    # Stage the Containerfile on the host. The build context is the
    # directory containing the Containerfile; buildah reads it
    # locally (no daemon). We build from /home/dev/.mineru-build so
    # the build context is small and self-contained.
    - name: Stage Containerfile for buildah
      copy:
        src: "{{ mineru_containerfile_src }}"
        dest: "{{ mineru_containerfile_dest }}"
        owner: dev
        group: dev
        mode: '0644'

    # Stage the UDS wrapper alongside the Containerfile. The
    # Containerfile does `COPY run-mineru-uds.py /usr/local/bin/...`,
    # so the wrapper must be in the build context directory. Mode
    # 0755 here is irrelevant (the Containerfile's RUN chmod is what
    # sets the in-image mode); we just need the file present.
    - name: Stage UDS wrapper for buildah
      copy:
        src: "{{ mineru_uds_wrapper_src }}"
        dest: "{{ mineru_uds_wrapper_dest }}"
        owner: dev
        group: dev
        mode: '0755'

    # Build the image only if the registry doesn't already have
    # this tag. The registry is the source of truth — once an
    # image is pushed, all subsequent runs on this host (and other
    # Nvidia hosts) just pull from there. Skipping the build+push
    # when the registry has the tag is what makes this idempotent.
    #
    # `buildah bud` runs as root because dev's CLONE_NEWUSER is
    # blocked on this kernel/buildah combo; root's buildah storage
    # is at /var/lib/containers/storage. The push is also as root
    # (same storage). dev's podman storage at
    # /home/dev/.local/share/containers/storage is populated by
    # the explicit `podman pull` below, which the service uses.
    #
    # ~10 min on a cold cache (uv pip install of mineru[all] +
    # torchvision + vllm pulls ~5 GB of wheels). Subsequent runs
    # are no-ops unless the Containerfile or VERSION changes.
    - name: Check if mineru image is already in registry
      # buildah pushes OCI manifests by default (Content-Type
      # application/vnd.oci.image.manifest.v1+json). A bare HEAD
      # without Accept returns 404 because the registry can't pick
      # a manifest format to return. List both formats in Accept
      # so the check matches either buildah or skopeo/docker pushes.
      uri:
        url: "http://registry.xc:5000/v2/mineru/manifests/{{ mineru_image_tag }}"
        method: HEAD
        headers:
          Accept: "application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json"
        status_code: 200
        timeout: 10
      register: mineru_registry_exists
      failed_when: false

    - name: Build mineru image with buildah (root)
      command: buildah bud --layers -f {{ mineru_containerfile_dest }} -t {{ mineru_image_local }} /home/dev/.mineru-build
      when: mineru_registry_exists.status != 200
      # ~10 min cold. Skipped on subsequent runs when the registry
      # already has the tag.
      # `--layers` keeps each Containerfile step as a separate OCI
      # layer (buildah 1.33 squashes by default → one giant final
      # layer of ~11 GB that gets re-uploaded on every wrapper /
      # Containerfile tweak). With --layers, the wrapper COPY at
      # the end of the Containerfile is its own ~5 KB layer, so a
      # wrapper change pushes just that layer + a new manifest
      # instead of the whole 11 GB tarball.

    - name: Push mineru image to cluster registry (root)
      command: buildah push {{ mineru_image_local }} {{ mineru_image_registry }}
      when: mineru_registry_exists.status != 200
      # First-time push can take ~1-2 min (the image is ~10 GB and
      # the registry has no auth but the upload is non-trivial).
      # Skipped on subsequent runs.

    # The mineru-podman.service does `podman pull` as part of its
    # ExecStartPre (under User=dev — the only context where
    # CLONE_NEWUSER is allowed on this kernel/buildah combo).
    # Pulling from the playbook via become_user: dev fails with
    # "cannot re-exec process" because sudo strips CLONE_NEWUSER,
    # so the pull is delegated to systemd. ~5 s on a warm cache.

    # Warmup: trigger paddle/VLM weight download into the bind-
    # mounted cache. mineru-models-download prompts interactively
    # for source + model_type; pipe `auto\nall\n` (the defaults)
    # so the playbook stays non-interactive. `auto` tries HuggingFace
    # first, falls back to ModelScope.
    #
    # The CLI downloads both VLM (~2.2 GB) and pipeline (~2.5 GB)
    # weights into the bind-mounted HF cache. Idempotent: skips if
    # the VLM model is already cached. Subsequent boots use
    # MINERU_MODEL_SOURCE=local to skip the network re-check.
    #
    # First-time downloads can take ~30 min (cold cache + slow link).
    # Skipped on subsequent runs.
    - name: Check if MinerU VLM model is already cached
      stat:
        path: "{{ mineru_hf_cache }}/hub/models--opendatalab--MinerU2.5-Pro-2605-1.2B"
      register: mineru_vlm_cache

    # mineru-models-download needs to run inside the container so
    # the resolved snapshot paths in mineru.json match the in-
    # container HF_HOME layout. Use the same image + bind-mounts
    # the service uses, but with --rm and the download CLI as the
    # command override.
    #
    # Warmup deliberately does NOT pass --network=none: it needs
    # to reach HF/ModelScope to fetch the weights on first install.
    # The hardened --network=none mode is only applied to the
    # long-running mineru-podman.service; the warmup is a one-shot
    # CLI run, no AF_INET socket is bound, and no SSRF surface is
    # exposed to network input.
    - name: Pre-download MinerU weights via container warmup
      command: >-
        podman run --rm --userns=keep-id
        -v {{ mineru_hf_cache }}:{{ mineru_hf_cache }}
        -e HF_HOME={{ mineru_hf_cache }}
        {{ mineru_image_registry }}
        bash -c 'printf "auto\nall\n" | mineru-models-download'
      become_user: dev
      when: not mineru_vlm_cache.stat.exists
      # Long-running on cold cache; skipped when VLM is already
      # cached. ~22 GB total downloaded into the bind-mounted cache.

    - name: Install mineru-podman systemd unit
      copy:
        src: "{{ mineru_service_unit_src }}"
        dest: "{{ mineru_service_unit_dest }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart mineru-podman service

    # The proxy unit bridges host TCP:{{ mineru_port }} to the
    # container's Unix socket at {{ mineru_uds_path }} — see the
    # unit file for the rationale (the container runs under
    # --network=none, so we need a host-side bridge for the API to
    # be reachable on its usual port). Started before
    # mineru-podman.service in the dependency chain is fine because
    # socat's `fork` mode retries per-client on ECONNREFUSED.
    - name: Install mineru-podman-proxy systemd unit
      copy:
        src: "{{ mineru_proxy_unit_src }}"
        dest: "{{ mineru_proxy_unit_dest }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart mineru-podman-proxy service

    # Tear down the old venv-based mineru.service. The unit file
    # and the venv are left on disk for one-command rollback (see
    # the design doc). Stop and disable — don't delete.
    - name: Stop and disable old venv-based mineru.service
      systemd:
        name: mineru.service
        state: stopped
        enabled: no
      failed_when: false
      # Old service may already be inactive on a fresh host — don't
      # fail the playbook if it is.

    - name: Enable and start mineru-podman service
      systemd:
        name: mineru-podman.service
        enabled: yes
        state: started
        daemon_reload: yes

    # The proxy is a thin bridge — start it before the container so
    # socat is already listening by the time mineru-podman.service
    # creates the UDS. Health-check below hits TCP:{{ mineru_port }}
    # (the proxy port), so the proxy needs to be up first.
    - name: Enable and start mineru-podman-proxy service
      systemd:
        name: mineru-podman-proxy.service
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Wait for MinerU /health to return ok
      uri:
        url: "http://127.0.0.1:{{ mineru_port }}/health"
        status_code: 200
        timeout: 30
      register: mineru_health
      until: mineru_health.status == 200
      retries: 30
      delay: 10

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart mineru-podman service
      service:
        name: mineru-podman.service
        state: restarted

    - name: restart mineru-podman-proxy service
      service:
        name: mineru-podman-proxy.service
        state: restarted
