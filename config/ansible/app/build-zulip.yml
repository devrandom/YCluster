---
# Build the Zulip server image in-cluster from the official docker-zulip
# repo (this repo's Dockerfile builds the zulip-server image from the
# upstream Zulip git tree). The cluster's third-party-binary rule
# (AGENTS.md) forbids pulling Zulip's published `ghcr.io/zulip/zulip-server`
# image, so we build + push to the cluster registry instead.
#
# Same shape as build-open-webui.yml: run on localhost so import_playbook
# can resolve `hosts` statically; every task delegates to the buildhost
# (s1, via group_vars).
#   docker-zulip release tag: 12.1-0  ->  ZULIP_GIT_REF=12.1
#     (docker-zulip's 12.1-0 release corresponds to Zulip server 12.1,
#      which is the Dockerfile's default ZULIP_GIT_REF pin.)
#
# The docker-zulip Dockerfile runs apt dist-upgrade and clones the upstream
# Zulip repo, so the build needs the cluster proxy:
#   --build-arg http_proxy=http://10.0.0.254:3128
- name: Build Zulip container image in-cluster
  hosts: localhost
  gather_facts: false
  vars:
    zulip_repo: "https://github.com/zulip/docker-zulip.git"
    zulip_version: "12.1-0"
    zulip_image_name: registry.xc:5000/zulip
    build_dir: /opt/src/zulip-build
  tasks:
    - block:
        - name: Verify registry is ready for push operations
          uri:
            url: "http://registry.xc:5000/v2/_catalog"
            method: GET
            timeout: 10
          register: registry_catalog
          failed_when: registry_catalog.status != 200

        - name: Create build directory
          file:
            path: "{{ build_dir }}/docker-zulip"
            state: directory
            mode: '0755'

        - name: Check out docker-zulip at the pinned release tag
          git:
            repo: "{{ zulip_repo }}"
            dest: "{{ build_dir }}/docker-zulip"
            version: "{{ zulip_version }}"
            force: yes

        - name: Check out upstream Zulip source for the home-button overlay
          git:
            repo: "https://github.com/zulip/zulip.git"
            dest: "{{ build_dir }}/zulip-src"
            version: "12.1"
            depth: 1
            force: yes

        - name: Copy Zulip YCluster home-button index.html patch
          copy:
            src: files/zulip-home-icon.patch
            dest: "{{ build_dir }}/zulip-home-icon.patch"
            mode: '0644'

        # Applies an additive patch to Zulip 12.1's index.html that injects a
        # nonce'd inline script adding a Y home icon to the top-right navbar.
        # custom_zulip_files is copied over the release tree by the docker-zulip
        # Dockerfile, so a runtime-served Django template like index.html takes
        # effect on the next container deploy without forking the upstream
        # Dockerfile or rebuilding the webpack bundle. Idempotent: git apply
        # --check fails once applied, so stage rebuilds don't re-apply.
        - name: Apply Zulip YCluster home-button index.html patch
          shell: |
            if git apply --check ../zulip-home-icon.patch 2>/dev/null; then
              git apply ../zulip-home-icon.patch
            fi
          args:
            chdir: "{{ build_dir }}/zulip-src"

        - name: Create custom_zulip_files overlay directory for the home-button patch
          file:
            path: "{{ build_dir }}/docker-zulip/custom_zulip_files/templates/zerver/app"
            state: directory
            mode: '0755'

        - name: Stage patched Zulip index.html into custom_zulip_files
          copy:
            src: "{{ build_dir }}/zulip-src/templates/zerver/app/index.html"
            dest: "{{ build_dir }}/docker-zulip/custom_zulip_files/templates/zerver/app/index.html"
            mode: '0644'
            remote_src: yes

        - name: Build and push Zulip image with buildx using registry cache
          shell: |
            docker buildx build \
              --build-arg http_proxy=http://10.0.0.254:3128 \
              --build-arg ZULIP_GIT_REF=12.1 \
              --cache-from type=registry,ref={{ zulip_image_name }}:cache \
              --cache-to type=registry,ref={{ zulip_image_name }}:cache,mode=max \
              --progress plain \
              --tag {{ zulip_image_name }}:{{ zulip_version }} \
              --push \
              . | tee /tmp/build-zulip.log 2>&1
          args:
            chdir: "{{ build_dir }}/docker-zulip"
          no_log: false

        - name: Display build completion message
          debug:
            msg: "Zulip image {{ zulip_image_name }}:{{ zulip_version }} built and pushed to registry successfully"
      delegate_to: "{{ buildhost }}"
