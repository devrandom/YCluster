# Zulip location bodies. Included by zulip.conf.j2, whose one server block
# serves both the plain :443/:80 listener and the frp tunnel landing
# (127.0.0.2:17443 with proxy_protocol) from the same include.
# The `(( port ))` marker is substituted by install-zulip.yml with the Zulip
# container's host loopback port.
#
# The interactive web surface (everything except /api/) is edge-gated by the
# cluster IdP embedded-outpost forward-auth (auth_request before any bytes
# reach the app — same boundary as ComfyUI / admin-api), not just by Zulip's
# app-level SAML-only login. The outpost plumbing (login redirect, OAuth
# callback, auth subrequest) is included by the parent server block via
# admin-api-authentik-outpost.conf. Zulip's websockets / long-polling
# connections survive the gate: auth_request runs on the request, then the
# proxied connection keeps its upgrade.
#
# /api/ is intentionally NOT edge-gated: Zulip's external API (mobile/desktop
# apps, bots, integrations, zulip-send) authenticates with Zulip API keys /
# HTTP basic auth, not an authentik session cookie, so it must not 401 to the
# IdP. Zulip is its own credential gate here — this is a pre-auth surface and
# tiers Zulip P0-U (see perimeter_software.yml). No proxy_pass URI so the
# /api/... path is preserved to the backend.
location /api/ {
    proxy_pass http://127.0.0.1:(( port ));
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/v1/events is long-polled by mobile clients; keep the connection
    # alive and unbuffered like the gated `/` below.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
}

location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @authentik_signin;
    auth_request_set $authentik_email  $upstream_http_x_authentik_email;
    auth_request_set $authentik_uid    $upstream_http_x_authentik_uid;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;

    proxy_pass http://127.0.0.1:(( port ))/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Authentik-Email  $authentik_email;
    proxy_set_header X-Authentik-UID    $authentik_uid;
    proxy_set_header X-Authentik-Groups $authentik_groups;

    # Zulip keeps long-lived connections for real-time message delivery
    # (long-polling + websockets).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
}
