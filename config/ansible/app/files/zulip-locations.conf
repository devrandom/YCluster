# Zulip location bodies. Included by zulip.conf.j2, whose one server block
# serves both the plain :443/:80 listener and the frp tunnel landing
# (127.0.0.2:17443 with proxy_protocol) from the same include.
# The `(( port ))` marker is substituted by install-zulip.yml with the Zulip
# container's host loopback port.
location / {
    proxy_pass http://127.0.0.1:(( port ))/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Zulip keeps long-lived connections for real-time message delivery
    # (long-polling + websockets).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
}
