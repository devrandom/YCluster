# Reference reverse-proxy rule for the ComfyUI web UI (HTTP + WebSocket).
#
# ComfyUI is a device-bound, non-OpenAI service: it is NOT routed through the
# local-ai-proxy OpenAI gateway. Expose it via the frontend / frp reverse
# proxy, forwarding both plain HTTP and the WebSocket upgrade path (/ws) that
# the UI and the workflow-submission channel (/prompt) use.
#
# This is a reference snippet for step 8 of docs/design/comfyui-h3.md. The
# concrete server block lives on the frontend/nginx node — this file is not
# wired into any nginx include in this repo on purpose, because the external
# exposure path is still an open design TODO (confirm the /ws passthrough).
# Cluster-internal host front: http://<comfyui-host>.xc:8188.
#
# If TLS terminates at the frontend, also set:
#   proxy_set_header X-Forwarded-Proto $scheme;
# Authentication (if any) belongs at the edge, reusing the cluster's existing
# user-facing auth (e.g. auth_request) — keep ComfyUI itself unauthenticated.

location / {
    proxy_pass http://<comfyui-host>.xc:8188;
    proxy_http_version 1.1;
    # WebSocket upgrade for /ws (UI + workflow submission).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Video generation + VAE decode can take minutes; don't let nginx kill
    # long-polling / WS requests while a workflow is queued.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
