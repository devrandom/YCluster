# CrowdSec parser for sshd logs (Debian/Ubuntu /var/log/auth.log).
# Stage: s01-parse (CrowdSec derives the pipeline stage from the path).
# Identity metadata (name/author/description) is required for the node to be
# loaded at all.
# One broad node with an expression-classified log_type: splitting success and
# failure across nodes makes the parser fail when the later node's filter does
# not match, and structured groks around "for" miss the trailing key
# comment on accepted logins.
# Note: the hub is empty in this local-only deployment, so there is no base
# syslog stage: grok runs on the raw line, which on current Debian/Ubuntu
# carries an ISO-8601 timestamp and hostname prefix.
name: ycluster/sshd-logs
author: ycluster
description: "Parse sshd auth.log lines (no hub: groks the raw line)"
onsuccess: continue
nodes:
  - filter: "evt.Line.Raw contains 'sshd['"
    grok:
      pattern: 'sshd\[\d+\]: %{DATA:sshd_event} from %{IPORHOST:source_ip} port \d+ ssh2'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        # Classify from the start of the message, not a substring: the
        # username is attacker-controlled, so a failed login for a user
        # named "Accepted" must not become a success.
        expression: 'evt.Parsed.sshd_event startsWith "Accepted " ? "ssh_success" : (evt.Parsed.sshd_event startsWith "Failed password" or evt.Parsed.sshd_event startsWith "Invalid user" ? "ssh_failed-auth" : "ssh_other")'
      - meta: source_ip
        expression: evt.Parsed.source_ip
      - parsed: sshd_event
        expression: evt.Parsed.sshd_event
