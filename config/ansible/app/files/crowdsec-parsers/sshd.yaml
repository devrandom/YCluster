# CrowdSec parser for sshd logs (Debian/Ubuntu /var/log/auth.log).
# Stage: s01-parse (CrowdSec derives the pipeline stage from the path).
# Identity metadata (name/author/description) is required for the node
# to be loaded at all.
# Extracts source_ip for the ssh-bf leaky bucket; target_user kept for
# triage though unused by scenarios today.
# Note: the hub is empty in this local-only deployment, so there is no
# base syslog stage: grok runs on the raw line, which on current
# Debian/Ubuntu carries an ISO-8601 timestamp and hostname prefix.
name: ycluster/sshd-logs
author: ycluster
description: "Parse sshd auth.log lines (no hub: groks the raw line)"
onsuccess: continue
nodes:
  - filter: "evt.Line.Raw contains 'sshd['"
    grok:
      pattern: 'sshd\[\d+\]: %{DATA:sshd_event} from %{IPORHOST:source_ip} port \d+ ssh2'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: ssh_failed-auth
      - meta: source_ip
        expression: evt.Parsed.source_ip
      - parsed: target_user
        expression: evt.Parsed.sshd_event
  - filter: "evt.Line.Raw contains 'sshd[' and (evt.Line.Raw contains 'Failed password' or evt.Line.Raw contains 'Invalid user')"
    grok:
      pattern: 'sshd\[\d+\]: %{DATA:sshd_event} for %{DATA:target_user} from %{IPORHOST:source_ip} port \d+ ssh2'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: ssh_failed-auth
      - meta: source_ip
        expression: evt.Parsed.source_ip
      - parsed: target_user
        expression: evt.Parsed.target_user
