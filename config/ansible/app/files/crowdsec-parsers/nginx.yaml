# CrowdSec parser for nginx access logs (combined format).
# Stage: s01-parse. Uses evt.Line.Labels.type (set by acquisition)
# rather than evt.Parsed.program, which a file source does not set.
name: ycluster/nginx-logs
author: ycluster
description: "Parse nginx combined-format access logs into http_access-log events"
filter: "evt.Line.Labels.type == 'nginx'"
onsuccess: continue
nodes:
  - grok:
      pattern: '%{IPORHOST:source_ip} - %{NOTSPACE:target_user} \[%{HTTPDATE:time}\] "%{WORD:verb} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:bytes} "%{DATA:referer}" "%{DATA:user_agent}"'
      apply_on: Line.Raw
    statics:
      - meta: log_type
        value: http_access-log
      - meta: source_ip
        expression: evt.Parsed.source_ip
      - target: evt.StrTime
        expression: evt.Parsed.time
      - parsed: status
        expression: evt.Parsed.status
      - parsed: verb
        expression: evt.Parsed.verb
      - parsed: file_name
        expression: "split(evt.Parsed.request, '?')[0]"
      - parsed: static_ressource
        # Use the path without the query string and a set of known static
        # roots. An arbitrary dynamic route must not become static just
        # because the client appended an asset suffix. A response content
        # type would be stronger; the combined log format does not carry one.
        expression: '((not (evt.Parsed.file_name contains "..")) and (not (evt.Parsed.file_name contains "%2e")) and (not (evt.Parsed.file_name contains "%2E")) and (evt.Parsed.file_name startsWith "/static/" or evt.Parsed.file_name startsWith "/staticfiles/" or evt.Parsed.file_name startsWith "/assets/" or evt.Parsed.file_name startsWith "/media/" or evt.Parsed.file_name startsWith "/_next/static/" or evt.Parsed.file_name == "/favicon.ico")) ? "true" : "false"'
