# Privilege escalation, capability change, and kernel-module tracing.
# These events are the high-signal core of the IDS: unexpected sudo,
# setuid transitions, capability changes, and module loads are the
# classic escalation paths after initial access.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: privilege-and-capability-changes
spec:
  kprobes:
    - call: "security_capset"
      syscall: false
      args:
        - index: 0
          type: "cred"
      selectors:
        - matchActions:
            - action: Post
    - call: "security_kernel_module_request"
      syscall: false
      args:
        - index: 0
          type: "string"
      selectors:
        - matchActions:
            - action: Post
    - call: "security_kernel_read_file"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              operator: "MatchPathSuffix"
              values:
                - ".ko"
          matchActions:
            - action: Post
    - call: "commit_creds"
      syscall: false
      args:
        - index: 0
          type: "cred"
      selectors:
        - matchActions:
            - action: Post
