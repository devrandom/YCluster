# Process execution and file-watch tracing policy for Tetragon.
# Pinned from docs/design/intrusion-detection.md "Detection content".
#
# Observe-only: every hook uses `post` (no `notifyEnforcer`).
# Scope: writes to /etc and systemd unit paths. Shell and
# package-manager execs are already exported as process_exec events by
# the base sensor; the forwarder filters on binary names there
# (`exec` is not a valid TracingPolicy field in v1.7.1).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-and-sensitive-file-writes
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"
      selectors:
          # MAY_WRITE (2) must be set in the permission mask: without
          # this the hook fires on every read of /etc (health checks
          # read /etc every second -> hundreds of thousands of events).
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/"
            - index: 1
              operator: "Mask"
              values:
                - "2"
          matchActions:
            - action: Post
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/usr/lib/systemd/system/"
            - index: 1
              operator: "Mask"
              values:
                - "2"
          matchActions:
            - action: Post
