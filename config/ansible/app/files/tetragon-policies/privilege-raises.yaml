# Targeted privilege raising: capability gains and transitions to uid/gid 0.
# Generic commit_creds/security_capset hooks are deliberately not used:
# they fire for normal credential commits on every exec and carry no
# old-versus-new comparison, producing far more volume than signal.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: privilege-raises
spec:
  kprobes:
    - call: "security_capset"
      syscall: false
      args:
        # Tetragon allows at most five inspected arguments. Compare the
        # effective and permitted sets; inheritable-only gains are omitted
        # to keep this kernel hook within that limit.
        - index: 1
          type: "cap_effective"
          resolve: "cap_effective"
        - index: 2
          type: "cap_effective"
        - index: 1
          type: "cap_permitted"
          resolve: "cap_permitted"
        - index: 4
          type: "cap_permitted"
      selectors:
        - matchArgs:
            - args: [0, 1]
              operator: "CapabilitiesGained"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - args: [2, 3]
              operator: "CapabilitiesGained"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setuid"
      syscall: false
      args:
        - index: 0
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setgid"
      syscall: false
      args:
        - index: 0
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setreuid"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - index: 1
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setregid"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - index: 1
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setresuid"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "int"
        - index: 2
          type: "int"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - index: 2
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setresgid"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "int"
        - index: 2
          type: "int"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
        - matchArgs:
            - index: 2
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setfsuid"
      syscall: false
      args:
        - index: 0
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
    - call: "__sys_setfsgid"
      syscall: false
      args:
        - index: 0
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
