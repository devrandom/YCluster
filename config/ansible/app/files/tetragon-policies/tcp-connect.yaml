# Non-loopback TCP connects with process context. tcp_connect exposes the
# socket fields needed for NotDAddr; security_socket_connect's sockaddr
# argument does not support destination-address operators.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tcp-connect
spec:
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotDAddr"
              values:
                - "127.0.0.0/8"
                - "::1/128"
          matchActions:
            - action: Post
              rateLimit: "1m"
              rateLimitScope: "process"
