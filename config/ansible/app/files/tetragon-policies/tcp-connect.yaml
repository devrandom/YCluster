# Network connect tracing policy: every TCP connect with process
# context, so unexpected destinations can be correlated to the process
# that opened them. This is metadata only — no payload capture.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tcp-connect
spec:
  kprobes:
    - call: "security_socket_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
        - index: 1
          type: "sockaddr"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotDAddr"
              values:
                - "127.0.0.0/8"
                - "::1/128"
          matchActions:
            - action: Post
