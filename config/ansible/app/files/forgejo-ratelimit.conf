# Connection-limit zone for the public Forgejo vhost.
#
# Only write requests are counted. GET/HEAD/OPTIONS are left out of the
# key (nginx does not account requests with an empty key), so normal web
# UI and asset loading are unaffected. git push uses POST and Git LFS
# object uploads use PUT; both share the per-client-IP cap.
map $request_method $forgejo_conn_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

limit_conn_zone $forgejo_conn_key zone=forgejo_write_conn:10m;
