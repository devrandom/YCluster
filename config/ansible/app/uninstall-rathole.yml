---
# One-shot cleanup: remove the dormant rathole binary, /etc/rathole config,
# and any leftover rathole systemd units from nodes that previously ran it.
# rathole is fully retired on cluster nodes (frp migration, see
# docs/design/frp-migration.md step 6): no cluster service runs it anymore,
# so this only scrubs the installed artifacts. Safe to re-run (idempotent).
# Frontend nodes are deliberately excluded: they still serve rathole to a
# few external admin machines that have rathole clients.
- name: Uninstall rathole leftovers
  hosts: managed
  become: yes
  tasks:
    - name: Remove rathole binaries
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/rathole
        - /usr/bin/rathole

    - name: Remove rathole config tree
      file:
        path: /etc/rathole
        state: absent

    - name: Remove leftover rathole systemd units
      file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - rathole.service
        - rathole-ssh.service
        - rathole-bastion.service

    - name: Reload systemd after removing units
      systemd:
        daemon_reload: yes
