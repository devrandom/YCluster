# Frontend VM NAT gateway (docs/design/vm-frontend-nat.md)
#
# Opt-in: only frontend hosts with `vm_frontend_nat_enabled: true` in
# their host_vars get the agent and base firewall table. The play is a
# no-op (with a notice) on every other frontend.
#
# Installs on participating frontend nodes:
#   - a base deny-all nftables table (fail-closed at boot, before the
#     nat-reconciler's first successful apply)
#   - the nat-reconciler agent + systemd timer
#   - an env file with the frontend's public IP and interface names
#   - mTLS client material for the admin-API pull
#
# The transit bridge (transit0) is created on COMPUTE hosts by
# admin/install-incus.yml, not here — a frontend is a router for the
# transit subnet, not an Incus host.
#
# Requires for participating hosts: nat_public_ip (plus optional
# nat_wan_iface / nat_transit_iface) in host_vars. All mTLS material
# (CA, client cert, client key) is fetched from etcd under
# /cluster/config/frontend-nat/ — seed it with setup-frontend-nat-ca.yml.

- hosts: frontend
  become: true
  vars:
    nat_ca_etcd_prefix: /cluster/config/frontend-nat
  tasks:
    - name: Skip non-participating frontends
      debug:
        msg: >-
          vm_frontend_nat_enabled is not true for {{ inventory_hostname }};
          skipping frontend NAT gateway install.
      when: not vm_frontend_nat_enabled | default(false)

    - name: Create ycluster lib directory
      when: vm_frontend_nat_enabled | default(false)
      file:
        path: /usr/local/lib/ycluster
        state: directory
        mode: '0755'
    - name: Create ycluster etc directory
      when: vm_frontend_nat_enabled | default(false)
      file:
        path: /etc/ycluster
        state: directory
        mode: '0755'

    - name: Install nat-reconciler agent
      when: vm_frontend_nat_enabled | default(false)
      copy:
        src: nat-reconciler
        dest: /usr/local/lib/ycluster/nat-reconciler
        mode: '0755'
        owner: root
        group: root

    - name: Install standalone renderer module
      when: vm_frontend_nat_enabled | default(false)
      copy:
        src: "{{ playbook_dir }}/../admin/files/ycluster/ycluster/utils/nat_render.py"
        dest: /usr/local/lib/ycluster/nat_render.py
        mode: '0644'
        owner: root
        group: root

    - name: Fetch NAT mTLS material from etcd
      run_once: true
      delegate_to: "{{ groups['storage'] | first }}"
      command:
        cmd: etcdctl get {{ nat_ca_etcd_prefix }}/{{ item }} --print-value-only
      environment: "{{ etcd_client_env }}"
      loop: [ca.crt, client.crt, client.key]
      register: nat_mtls_material
      changed_when: false
      no_log: true

    - name: Install mTLS CA certificate (from etcd)
      when: vm_frontend_nat_enabled | default(false)
      copy:
        content: "{{ nat_mtls_material.results[0].stdout }}"
        dest: /etc/ycluster/nat-ca.crt
        mode: '0644'

    - name: Install mTLS client certificate (from etcd)
      when: vm_frontend_nat_enabled | default(false)
      copy:
        content: "{{ nat_mtls_material.results[1].stdout }}"
        dest: /etc/ycluster/nat-client.crt
        mode: '0644'

    - name: Install mTLS client key (from etcd)
      when: vm_frontend_nat_enabled | default(false)
      copy:
        content: "{{ nat_mtls_material.results[2].stdout }}"
        dest: /etc/ycluster/nat-client.key
        mode: '0600'
      no_log: true

    - name: Fail if mTLS material is missing
      when: vm_frontend_nat_enabled | default(false) and
            (nat_mtls_material.results | map(attribute='stdout') | map('trim') | select('equalto', '') | list | length > 0)
      fail:
        msg: >-
          NAT mTLS material missing from etcd ({{ nat_ca_etcd_prefix }})
          — run setup-frontend-nat-ca.yml to seed it. The agent refuses to
          pull without mTLS (fail-closed).

    - name: Create nftables.d include directory
      when: vm_frontend_nat_enabled | default(false)
      file:
        path: /etc/nftables.d
        state: directory
        mode: '0755'

    - name: Include nftables.d from nftables.conf
      when: vm_frontend_nat_enabled | default(false)
      lineinfile:
        path: /etc/nftables.conf
        line: 'include "/etc/nftables.d/*.nft"'
        insertafter: EOF
        state: present
      notify: reload nftables

    - name: Install base deny-all nftables table
      when: vm_frontend_nat_enabled | default(false)
      copy:
        src: templates/nat-reconciler-base.nft
        dest: /etc/nftables.d/ycluster-vm-nat.nft
        mode: '0644'
      notify: reload nftables

    - name: Install nat-reconciler units
      when: vm_frontend_nat_enabled | default(false)
      copy:
        src: "nat-reconciler.{{ item }}"
        dest: "/etc/systemd/system/nat-reconciler.{{ item }}"
        mode: '0644'
      loop: [service, timer]
      register: nat_units

    - name: Install nat-reconciler env file
      when: vm_frontend_nat_enabled | default(false)
      copy:
        content: |
          NAT_PUBLIC_IP={{ nat_public_ip }}
          NAT_WAN_IFACE={{ nat_wan_iface | default('eth0') }}
          NAT_TRANSIT_IFACE={{ nat_transit_iface | default('wg-vm-nat') }}
          NAT_RULES_URL={{ nat_rules_url | default('https://127.0.0.1/api/frontend/nat-rules') }}
          NAT_CLIENT_CERT=/etc/ycluster/nat-client.crt
          NAT_CLIENT_KEY=/etc/ycluster/nat-client.key
          NAT_CA_CERT=/etc/ycluster/nat-ca.crt
        dest: /etc/ycluster/nat-reconciler.env
        mode: '0600'
      notify: restart nat-reconciler

    - name: Enable and start nat-reconciler timer
      when: vm_frontend_nat_enabled | default(false)
      systemd:
        name: nat-reconciler.timer
        enabled: yes
        state: started
        daemon_reload: "{{ nat_units.changed }}"

  handlers:
    - name: reload nftables
      command: nft -f /etc/nftables.d/ycluster-vm-nat.nft
    - name: restart nat-reconciler
      systemd:
        name: nat-reconciler.service
        state: restarted
        daemon_reload: yes
