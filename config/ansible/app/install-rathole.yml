---
- name: Install rathole configuration and service
  hosts: core
  # No `become` for compatibility with unprivileged controller user (the
  # delegate_to: localhost stat must run as the controller, not sudo).
  vars:
    rathole_binary_path: "/usr/local/bin/rathole"
    # Binary stays in the cargo build output dir (see build-rathole.yml).
    rathole_binary_src: "/opt/src/rathole/target/release/rathole"

  tasks:
    - name: Check if rathole binary exists on buildhost
      stat:
        path: "{{ rathole_binary_src }}"
      register: rathole_binary_buildhost
      delegate_to: "{{ buildhost }}"

    - name: Fail if rathole binary not found
      fail:
        msg: "Rathole binary not found at {{ rathole_binary_src }} on {{ buildhost }}. Please run build-rathole.yml first."
      when: not rathole_binary_buildhost.stat.exists

    - name: Fetch rathole binary from buildhost to controller
      fetch:
        src: "{{ rathole_binary_src }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Copy rathole binary to target
      copy:
        src: "{{ build_cache_dir }}/{{ rathole_binary_src | basename }}"
        dest: "{{ rathole_binary_path }}"
        mode: '0755'
        owner: root
        group: root

    - name: Create rathole config directory
      file:
        path: /etc/rathole
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Install rathole client config template
      copy:
        src: rathole-client-config.toml.j2
        dest: /etc/rathole/client-config.toml.j2
        mode: '0644'
        owner: root
        group: root

    - name: Install rathole SSH client config template
      copy:
        src: rathole-ssh-client-config.toml.j2
        dest: /etc/rathole/ssh-client-config.toml.j2
        mode: '0644'
        owner: root
        group: root

    - name: Create rathole client startup script
      copy:
        src: rathole-client-start
        dest: /usr/local/bin/rathole-client-start
        mode: '0755'
        owner: root
        group: root

    - name: Create rathole SSH client startup script
      copy:
        src: rathole-ssh-client-start
        dest: /usr/local/bin/rathole-ssh-client-start
        mode: '0755'
        owner: root
        group: root

    - name: Create rathole systemd service
      copy:
        src: rathole.service
        dest: /etc/systemd/system/rathole.service
        mode: '0644'
        owner: root
        group: root
      notify: reload systemd

    - name: Create rathole SSH systemd service
      copy:
        src: rathole-ssh.service
        dest: /etc/systemd/system/rathole-ssh.service
        mode: '0644'
        owner: root
        group: root
      notify: reload systemd

    - name: rathole service is controlled by storage leader election
      systemd:
        name: rathole
        enabled: no
        daemon_reload: yes

    # Per-core SSH moved to frp (frpc-ssh, 17200+idx); the rathole-ssh
    # client for the retired 2200+idx band is disabled here.
    - name: Disable and stop rathole SSH service
      systemd:
        name: rathole-ssh
        enabled: no
        state: stopped
        daemon_reload: yes

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
