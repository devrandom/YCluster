---
# ROCm AMD compute nodes
# ======================

# Pin kernel version compatible with amdgpu DKMS.
# amdgpu-dkms only builds for one series: HWE 6.17+ and GA 6.8.0-147+ both
# fail, and a failed build leaves linux-image/linux-headers half-configured
# and blocks every later apt run. The kernel-pin block in
# admin/install-rocm.yml keeps no other series installed, so 6.14 is the
# default for the fleet. Override per-host (e.g. host_vars/c3.yml) where a
# newer kernel is required.
rocm_kernel_version: "6.14.0-37-generic"
