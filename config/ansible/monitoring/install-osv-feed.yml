---
# Install and wire the local OSV CVE feed (osv-feed) on a single collector
# node. The mirror writes Debian/Ubuntu/Go + EPSS into a local SQLite store on
# the node's disk (SQLite over a network share is fragile), then a publish
# job snapshots that store to the shared /near1 dir; the collector matches
# the snapshot read-only and writes CVE state to the node_exporter textfile
# directory.
#
# Single writer: the daily mirror (which owns <db_dir>'s cursors,
# first-seen state and the writable SQLite store) lives on one designated
# node; readers only ever open the published snapshot with --db-immutable,
# so the writable DB never has concurrent writers.
#
# Usage:
#   ./run-playbook.sh monitoring/install-osv-feed.yml
#   # override the collector node (must mount /near1 and have outbound access):
#   ./run-playbook.sh monitoring/install-osv-feed.yml -e osv_feed_collector=storage-1
#
# See docs/design/osv-feed.md for the deployment plan and
# docs/design/perimeter-software-tracking.md for the alert/SLA context.
- name: Install osv-feed mirror and textfile collector
  hosts: "{{ osv_feed_collector | default('core[0]') }}"
  become: yes
  # Tracked package lists are derived from the single source of truth,
  # config/ansible/perimeter_software.yml (docs/design/perimeter-software-tracking.md),
  # so the inventory and the collector config cannot drift.
  vars_files:
    - ../perimeter_software.yml
  vars:
    osv_feed_install_dir: /opt/osv-feed
    osv_feed_collector_path: /usr/local/lib/cluster/osv-feed-collector
    osv_feed_publish_path: /usr/local/lib/cluster/osv-feed-publish
    osv_feed_source_dir: "{{ playbook_dir }}/../../../osv-feed"
    # The writable SQLite store + cursors + first-seen state live on the
    # node's local disk; only a read-only snapshot is published to the
    # shared dir (see docs/design/osv-feed.md).
    osv_feed_db_dir: /var/lib/osv-feed/db
    osv_feed_snapshot_dir: /near1/osv-feed
    osv_feed_ack_db: /near1/osv-feed/acks.json
    osv_feed_ecosystem: Ubuntu
    osv_feed_match_interval_sec: 900
    # Derived from perimeter_software.yml entries whose `osv_category` matches
    # each osv-feed tracking table. `osv_packages` holds the exact match
    # strings; entries without one (containers -> manifests, Incus not yet
    # tracked) contribute nothing here.
    osv_feed_perimeter_packages: "{{ perimeter_software | selectattr('osv_category', 'eq', 'perimeter') | map(attribute='osv_packages') | select('defined') | flatten | unique | list }}"
    osv_feed_perimeter_severity: high
    osv_feed_network_packages: "{{ perimeter_software | selectattr('osv_category', 'eq', 'network') | map(attribute='osv_packages') | select('defined') | flatten | unique | list }}"
    osv_feed_runtimes_packages: "{{ perimeter_software | selectattr('osv_category', 'eq', 'runtimes') | map(attribute='osv_packages') | select('defined') | flatten | unique | list }}"
    # Self-built Go binaries we ship from source pins (see app/build-frp.yml),
    # tracked against the OSV Go ecosystem. The `name=version` form pins the
    # version we build, so no dpkg resolution is needed on the collector node.
    osv_feed_selfbuilt_ecosystem: Go
    osv_feed_selfbuilt_packages: "{{ perimeter_software | selectattr('osv_category', 'eq', 'selfbuilt') | map(attribute='osv_packages') | select('defined') | flatten | unique | list }}"
    osv_feed_selfbuilt_severity: high
    # Container image CVE manifests (container/*.manifest) live on the shared
    # snapshot dir; the collector passes this to `match --container-dir`.
    osv_feed_container_dir: "{{ osv_feed_snapshot_dir }}/container"
    osv_feed_container_severity: high

  tasks:
    - name: Ensure local feed DB directory exists
      file:
        path: "{{ osv_feed_db_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # /near1 is an automounted NAS share; a `file` task that creates the
    # child path triggers the mount on first use.
    - name: Ensure snapshot directory exists on the shared mount
      file:
        path: "{{ osv_feed_snapshot_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure container manifest directory exists on the shared mount
      file:
        path: "{{ osv_feed_container_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure osv-feed install directory exists
      file:
        path: "{{ osv_feed_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Push osv-feed package to the collector node
      synchronize:
        src: "{{ osv_feed_source_dir }}/osv_feed/"
        dest: "{{ osv_feed_install_dir }}/osv_feed/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=__pycache__/"
          - "--exclude=*.pyc"

    - name: Install osv-feed wrapper
      template:
        src: osv-feed-wrapper.j2
        dest: /usr/local/bin/osv-feed
        owner: root
        group: root
        mode: '0755'

    - name: Push container image manifests to the shared snapshot dir
      synchronize:
        # Manifests are deployment-owned (not part of the general osv-feed
        # tool); they pin exact image versions/digests and live next to this
        # playbook under container-manifests/.
        src: "{{ playbook_dir }}/container-manifests/"
        dest: "{{ osv_feed_container_dir }}/"
        delete: yes
        recursive: yes
      # The collector matches them from the read-only snapshot
      # (see docs/design/container-image-tracking.md).

    - name: Ensure osv-feed config directory exists
      file:
        path: /etc/osv-feed
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure cluster lib directory exists
      file:
        path: "{{ osv_feed_collector_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install osv-feed config
      template:
        src: osv-feed-config.toml.j2
        dest: /etc/osv-feed/config.toml
        owner: root
        group: root
        mode: '0644'

    - name: Install osv-feed collector script
      copy:
        src: files/osv-feed-collector.py
        dest: "{{ osv_feed_collector_path }}"
        owner: root
        group: root
        mode: '0755'

    - name: Install osv-feed publish script
      copy:
        src: files/osv-feed-publish.py
        dest: "{{ osv_feed_publish_path }}"
        owner: root
        group: root
        mode: '0755'

    - name: Create systemd service for daily mirror
      copy:
        dest: /etc/systemd/system/osv-feed-mirror.service
        content: |
          [Unit]
          Description=Mirror OSV vulnerability feeds (osv-feed)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/osv-feed mirror --ecosystem Debian --ecosystem Ubuntu --ecosystem Go --ecosystem PyPI
          # Publish the read-only snapshot to the shared dir only once the
          # local writable store is fully written and closed.
          ExecStartPost=/usr/bin/python3 {{ osv_feed_publish_path }}
          User=root
          Environment=OSV_FEED_DB_DIR={{ osv_feed_db_dir }}
          Environment=OSV_FEED_SNAPSHOT_DIR={{ osv_feed_snapshot_dir }}
          # ProtectSystem=full keeps /usr,/boot,/etc read-only while leaving
          # /var (local DB) and the /near1 NAS mount writable (no
          # ReadWritePaths gymnastics for an automounted share).
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true
          NoNewPrivileges=true
          TimeoutStartSec=3600
        mode: '0644'
      notify: reload systemd

    - name: Create timer for daily mirror
      copy:
        dest: /etc/systemd/system/osv-feed-mirror.timer
        content: |
          [Unit]
          Description=Daily OSV feed mirror (osv-feed)

          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
        mode: '0644'
      notify: reload systemd

    - name: Create systemd service for textfile collector
      copy:
        dest: /etc/systemd/system/osv-feed-collector.service
        content: |
          [Unit]
          Description=Collect osv-feed CVE metrics for node_exporter
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 {{ osv_feed_collector_path }}
          User=root
          # Match against the published read-only snapshot on the shared
          # mount; first-seen state stays on the local writable DB dir.
          Environment=OSV_FEED_DB_DIR={{ osv_feed_snapshot_dir }}
          Environment=OSV_FEED_STATE_DIR={{ osv_feed_db_dir }}
          Environment=OSV_FEED_CONTAINER_DIR={{ osv_feed_container_dir }}
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true
          NoNewPrivileges=true
          TimeoutStartSec=700
        mode: '0644'
      notify: reload systemd

    - name: Create timer for textfile collector
      copy:
        dest: /etc/systemd/system/osv-feed-collector.timer
        content: |
          [Unit]
          Description=Collect osv-feed CVE metrics every {{ osv_feed_match_interval_sec }}s

          [Timer]
          OnBootSec=60s
          OnUnitActiveSec={{ osv_feed_match_interval_sec }}s
          AccuracySec=60s

          [Install]
          WantedBy=timers.target
        mode: '0644'
      notify: reload systemd

    - name: Ensure node_exporter textfile directory exists
      file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Enable and start mirror timer
      systemd:
        name: osv-feed-mirror.timer
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Enable and start collector timer
      systemd:
        name: osv-feed-collector.timer
        enabled: yes
        state: started
        daemon_reload: yes

    # First data instead of waiting up to a day for the timer; tolerated if
    # the initial download needs a retry (the daily timer keeps retrying).
    # Mirror then publish, so the shared snapshot exists before collecting.
    - name: Run the initial mirror and publish so the feed exists before matching
      shell: |
        /usr/local/bin/osv-feed mirror --ecosystem Debian --ecosystem Ubuntu --ecosystem Go --ecosystem PyPI \
          && /usr/bin/python3 {{ osv_feed_publish_path }}
      environment:
        OSV_FEED_DB_DIR: "{{ osv_feed_db_dir }}"
        OSV_FEED_SNAPSHOT_DIR: "{{ osv_feed_snapshot_dir }}"
      changed_when: false
      failed_when: false

    - name: Run an initial collection so metrics appear immediately
      command: /usr/bin/python3 {{ osv_feed_collector_path }}
      environment:
        OSV_FEED_DB_DIR: "{{ osv_feed_snapshot_dir }}"
        OSV_FEED_STATE_DIR: "{{ osv_feed_db_dir }}"
        OSV_FEED_CONTAINER_DIR: "{{ osv_feed_container_dir }}"
      changed_when: false
      failed_when: false

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
