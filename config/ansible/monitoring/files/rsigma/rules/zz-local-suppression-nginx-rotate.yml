title: Suppress the nginx logrotate rotate hook
id: 7866bbb6-76a6-4d0e-b391-4877111be81c
description: |
  Local tuning for the IDS pilot. logrotate's nginx postrotate runs
  `/etc/init.d/nginx rotate`, which reads /proc/cmdline and the server config
  with `cat`. The upstream Linux Webshell Indicators rule looks for a `cat`
  under a process named nginx, so every host running nginx fires it twice a
  night. The rule keeps its value for real web-server children: only the
  rotate hook is excluded.
author: YCluster IDS pilot
logsource:
    product: linux
    category: process_creation
filter:
    rules:
        - 818f7b24-0fba-4c49-a073-8b755573b9c7
    nginx_rotate:
        ParentImage: '/etc/init.d/nginx'
        ParentCommandLine|endswith: 'rotate'
        Image|endswith: '/cat'
        Layer: host
    condition: not nginx_rotate
