title: Suppress PCP log rotation cleanup
id: f3981d6d-acc5-44d7-81c9-c50950970a4f
description: |
  Local tuning for the IDS pilot. PCP's pmlogger/pmie janitors remove their
  own rotated logs under /var/log/pcp every 30 minutes, which the upstream
  Linux Logs Clearing Attempts rule flags as log tampering.
author: YCluster IDS pilot
logsource:
    product: linux
    category: process_creation
filter:
    rules:
        - 80915f59-9b56-4616-9de0-fd0dea6c12fe
    pcp_cleanup:
        Image|endswith: '/rm'
        # PCP keeps one directory per host under pmlogger/, so allow one
        # optional subdirectory. Every component must start with a
        # non-dot character, so a `..` traversal cannot borrow the path.
        CommandLine|re: '^/(usr/)?bin/rm -f( --)? /var/log/pcp/(pmlogger|pmie)/[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*( /var/log/pcp/(pmlogger|pmie)/[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*)*$'
        Layer: host
    condition: not pcp_cleanup
