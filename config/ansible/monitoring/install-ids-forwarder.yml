---
# Install the ids-forwarder on every managed node: it tails the local
# Tetragon event log and posts to Alertmanager over WireGuard. The
# binary is built by app/build-ids-forwarder.yml on the buildhost.
# Tetragon/CrowdSec deployment is tracked separately in
# todo/security/intrusion-detection.md.
- name: Install ids-forwarder
  hosts: "{{ ids_forwarder_target | default('managed') }}"
  become: yes
  vars:
    ids_forwarder_buildhost_path: /opt/src/ids-forwarder/ids-forwarder
    # Alertmanager runs on every core node. Non-core hosts cannot reach
    # their own localhost, so target all core instances; the forwarder
    # tries each URL in order and the first reachable one wins.
    ids_forwarder_alertmanager_url: "{{ groups['core'] | map('extract', hostvars, ['ansible_host']) | map('regex_replace', '^(.*)$', 'http://\\1:9093') | join(',') }}"
    ids_forwarder_tetragon_log: "/var/log/tetragon/tetragon.log"
    # process_kprobe covers policy hits (file writes, cap changes,
    # connects); process_exec is high-volume and is filtered by binary
    # in the forwarder.
    ids_forwarder_events: "process_kprobe,process_exec"
    ids_forwarder_exec_binaries: "bash,sh,dash,zsh,fish,sudo,su,apt,apt-get,dpkg,snap,curl,wget"
    # Loopback receiver for CrowdSec notification-http POSTs.
    ids_forwarder_http_listen: "127.0.0.1:9201"
    ids_forwarder_metrics_listen: "127.0.0.1:2113"
    # Durable replay and outbound queue. The spool holds redacted alerts,
    # not raw events; Tetragon's retained event files remain the upstream
    # buffer. The byte cap applies backpressure instead of dropping.
    ids_forwarder_state_dir: /var/lib/ids-forwarder
    ids_forwarder_cursor_file: "{{ ids_forwarder_state_dir }}/cursor.json"
    ids_forwarder_spool_file: "{{ ids_forwarder_state_dir }}/spool.jsonl"
    ids_forwarder_spool_max_bytes: 104857600
    ids_forwarder_max_event_age: 24h
    ids_forwarder_startup_grace: 1m
    ids_metrics_textfile_dir: /var/lib/prometheus/node-exporter
  tasks:
    - name: Check whether the tetragon group exists
      command:
        cmd: getent group tetragon
      register: ids_tetragon_group
      failed_when: false
      changed_when: false

    - name: Set tetragon group fact
      set_fact:
        ids_forwarder_tetragon_group_exists: "{{ ids_tetragon_group.rc == 0 }}"

    - name: Create ids-forwarder system group
      group:
        name: ids-forwarder
        system: yes

    - name: Create ids-forwarder system user
      user:
        name: ids-forwarder
        group: ids-forwarder
        system: yes
        shell: /usr/sbin/nologin
        home: /var/lib/ids-forwarder
        create_home: no
        # The Tetragon deb ships a `tetragon` group with read access to
        # /var/log/tetragon; join it when present so the forwarder can
        # tail the event log without root.
        groups: "{{ 'tetragon' if ids_forwarder_tetragon_group_exists else omit }}"

    - name: Ensure ids-forwarder state directory exists
      file:
        path: "{{ ids_forwarder_state_dir }}"
        state: directory
        owner: ids-forwarder
        group: ids-forwarder
        mode: '0750'

    - name: Check for binary on buildhost
      stat:
        path: "{{ ids_forwarder_buildhost_path }}"
      register: ids_binary_buildhost
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Fail if binary not found on buildhost
      fail:
        msg: "ids-forwarder binary not found at {{ ids_forwarder_buildhost_path }} on {{ buildhost }}. Run app/build-ids-forwarder.yml first."
      when: not ids_binary_buildhost.stat.exists

    - name: Fetch binary from buildhost to controller
      fetch:
        src: "{{ ids_forwarder_buildhost_path }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Install binary
      copy:
        src: "{{ build_cache_dir }}/ids-forwarder"
        dest: /usr/local/bin/ids-forwarder
        owner: root
        group: root
        mode: '0755'
      notify: restart ids-forwarder

    - name: Install systemd unit
      template:
        src: ids-forwarder.service.j2
        dest: /etc/systemd/system/ids-forwarder.service
        mode: '0644'
      notify: restart ids-forwarder

    - name: Enable and start ids-forwarder
      systemd:
        name: ids-forwarder
        enabled: yes
        state: started
        daemon_reload: yes

    # Textfile collector: the IDS metrics endpoints are loopback-only, and
    # core Prometheus already scrapes node_exporter on every managed node.
    # Publishing ids_component_up keeps coverage alerts working everywhere
    # without opening another listener.
    - name: Install IDS metrics collector script
      copy:
        src: files/ids-metrics-collector.py
        dest: /usr/local/lib/cluster/ids-metrics-collector
        owner: root
        group: root
        mode: '0755'

    - name: Ensure node_exporter textfile directory exists
      file:
        path: "{{ ids_metrics_textfile_dir }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Install IDS metrics collector service
      copy:
        dest: /etc/systemd/system/ids-metrics-collector.service
        content: |
          [Unit]
          Description=Collect IDS component health for node_exporter
          After=ids-forwarder.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /usr/local/lib/cluster/ids-metrics-collector
          User=root
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          NoNewPrivileges=true
          ReadWritePaths={{ ids_metrics_textfile_dir }}
        mode: '0644'
      notify: reload systemd ids

    - name: Install IDS metrics collector timer
      copy:
        dest: /etc/systemd/system/ids-metrics-collector.timer
        content: |
          [Unit]
          Description=Collect IDS component health every minute

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          AccuracySec=15s

          [Install]
          WantedBy=timers.target
        mode: '0644'
      notify: reload systemd ids

    - name: Enable and start IDS metrics collector timer
      systemd:
        name: ids-metrics-collector.timer
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Publish IDS metrics immediately
      systemd:
        name: ids-metrics-collector.service
        state: started

  handlers:
    - name: restart ids-forwarder
      systemd:
        name: ids-forwarder
        state: restarted
        daemon_reload: yes

    - name: reload systemd ids
      systemd:
        daemon_reload: yes
