---
# Install CrowdSec in local-only mode on every Linux cluster node.
#
# Requires app/build-crowdsec.yml to have run on the buildhost.
#
# Local-only posture (docs/design/intrusion-detection.md):
#   - Local API bound to 127.0.0.1:{{ crowdsec_lapi_port }}; no public listener.
#   - No console enrollment, no Central API, no community blocklist.
#   - No bouncers: the IDS is alert-only.
#   - Local DB retention capped at the access-log window via flush.max_age.
#
# Detection sources: sshd, nginx access logs, Authentik logs. Alerts are
# delivered to ids-forwarder's localhost HTTP receiver via the
# notification-http plugin.
- name: Install CrowdSec
  hosts: "{{ crowdsec_target | default('managed') }}"
  become: yes
  vars:
    crowdsec_buildhost_path: /opt/src/crowdsec
    crowdsec_config_dir: /etc/crowdsec
    crowdsec_data_dir: /var/lib/crowdsec/data
    crowdsec_log_retention_days: 7
    # 8080 collides with llama-server on compute/nvidia nodes.
    crowdsec_lapi_port: 8085
  tasks:
    - name: Create crowdsec system group
      group:
        name: crowdsec
        system: yes

    - name: Create crowdsec system user
      user:
        name: crowdsec
        group: crowdsec
        groups: adm
        append: yes
        system: yes
        shell: /usr/sbin/nologin
        home: /var/lib/crowdsec
        create_home: no

    - name: Check for built binaries on the buildhost
      stat:
        path: "{{ crowdsec_buildhost_path }}/cmd/crowdsec/crowdsec"
      register: build_artifacts
      delegate_to: "{{ buildhost }}"
      run_once: true

    - name: Fail if binaries missing on buildhost
      fail:
        msg: "CrowdSec binaries not found under {{ crowdsec_buildhost_path }} on {{ buildhost }}. Run app/build-crowdsec.yml first."
      when: not build_artifacts.stat.exists

    - name: Fetch binaries from buildhost
      fetch:
        src: "{{ crowdsec_buildhost_path }}/{{ item }}"
        dest: "{{ build_cache_dir }}/"
        flat: yes
      delegate_to: "{{ buildhost }}"
      run_once: true
      loop:
        - cmd/crowdsec/crowdsec
        - cmd/crowdsec-cli/cscli
        - cmd/notification-http/notification-http

    - name: Install crowdsec binary
      copy:
        src: "{{ build_cache_dir }}/crowdsec"
        dest: /usr/local/bin/crowdsec
        owner: root
        group: root
        mode: '0755'
      notify: restart crowdsec

    - name: Install cscli binary
      copy:
        src: "{{ build_cache_dir }}/cscli"
        dest: /usr/local/bin/cscli
        owner: root
        group: root
        mode: '0755'

    - name: Create plugin directory
      file:
        path: /usr/local/lib/crowdsec/plugins
        state: directory
        owner: crowdsec
        group: crowdsec
        mode: '0755'

    - name: Install notification-http plugin
      copy:
        src: "{{ build_cache_dir }}/notification-http"
        dest: /usr/local/lib/crowdsec/plugins/notification-http
        owner: crowdsec
        group: crowdsec
        mode: '0755'
      notify: restart crowdsec

    - name: Create config directory
      file:
        path: "{{ crowdsec_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create data directory
      file:
        path: "{{ crowdsec_data_dir }}"
        state: directory
        owner: crowdsec
        group: crowdsec
        mode: '0750'

    - name: Create empty simulation file
      # crowdsec fails to start if simulation_path is missing.
      copy:
        content: "{}\n"
        dest: "{{ crowdsec_config_dir }}/simulation.yaml"
        owner: crowdsec
        group: crowdsec
        mode: '0644'

    - name: Create notification config directory
      file:
        path: "{{ crowdsec_config_dir }}/notifications"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Render main config
      template:
        src: crowdsec-config.yaml.j2
        dest: "{{ crowdsec_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Render acquisition config
      template:
        src: crowdsec-acquis.yaml.j2
        dest: "{{ crowdsec_config_dir }}/acquis.yaml"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Render notification profile
      template:
        src: crowdsec-notifications-http.yaml.j2
        dest: "{{ crowdsec_config_dir }}/notifications/http.yaml"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Render notification routing profile
      template:
        src: crowdsec-profiles.yaml.j2
        dest: "{{ crowdsec_config_dir }}/profiles.yaml"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Install pinned scenarios
      copy:
        src: "{{ playbook_dir }}/../app/files/crowdsec-scenarios/"
        dest: "{{ crowdsec_config_dir }}/scenarios/"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Install pinned parsers (s01-parse stage)
      copy:
        src: "{{ playbook_dir }}/../app/files/crowdsec-parsers/"
        dest: "{{ crowdsec_config_dir }}/parsers/s01-parse/"
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Create patterns directory (crowdsec reads it during parser init)
      file:
        path: "{{ crowdsec_config_dir }}/patterns"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create hub directory
      file:
        path: "{{ crowdsec_config_dir }}/hub"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install minimal hub index (local-only; no hub download)
      copy:
        content: "{}\n"
        dest: "{{ crowdsec_config_dir }}/hub/.index.json"
        owner: root
        group: root
        mode: '0644'

    - name: Install systemd unit
      copy:
        src: "{{ playbook_dir }}/../app/files/crowdsec/crowdsec.service"
        dest: /etc/systemd/system/crowdsec.service
        owner: root
        group: root
        mode: '0644'
      notify: restart crowdsec

    - name: Register the local agent with the LAPI
      # Runs before the service starts: cscli talks to the database
      # directly and writes local_api_credentials.yaml, so the agent
      # finds valid credentials on its first start.
      command:
        cmd: "cscli machines add {{ inventory_hostname }}-local --auto -u http://127.0.0.1:{{ crowdsec_lapi_port }} -f {{ crowdsec_config_dir }}/local_api_credentials.yaml"
        creates: "{{ crowdsec_config_dir }}/local_api_credentials.yaml"

    - name: Point existing credentials at the configured LAPI port
      # Nodes registered before the port variable existed still have
      # :8080 in local_api_credentials.yaml.
      lineinfile:
        path: "{{ crowdsec_config_dir }}/local_api_credentials.yaml"
        regexp: '^url:'
        line: "url: http://127.0.0.1:{{ crowdsec_lapi_port }}"

    - name: Fix ownership of agent credentials
      file:
        path: "{{ crowdsec_config_dir }}/local_api_credentials.yaml"
        owner: crowdsec
        group: crowdsec
        mode: '0640'

    - name: Fix ownership of agent state
      file:
        path: /var/lib/crowdsec/data
        owner: crowdsec
        group: crowdsec
        recurse: yes

    - name: Enable and start crowdsec
      systemd:
        name: crowdsec
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart crowdsec
      systemd:
        name: crowdsec
        state: restarted
        daemon_reload: yes
