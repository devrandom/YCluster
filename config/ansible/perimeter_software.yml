---
# Perimeter software inventory (docs/design/perimeter-software-tracking.md,
# Phase 1). Version-controlled, single source of truth for what sits on (or
# near) the external boundary and how it is tracked/updated.
#
# Tiers (tier = the component's own internet-reachable surface before a
# credential gate, not its blast radius if compromised):
#   P0-U  externally reachable before any credential gate (login/pre-auth, TLS
#   P0-A  externally reachable but behind a credential/key gate
#   P0 guardrail  not itself a vulnerable surface; a guardrail that gates P0
#   P1    remote-trust / reachable-but-gated tier (VPN, DNS, jump, gateway)
#   P2    interior runtimes / host base, or non-listening tooling (probes,
#         renewal clients, libraries)
#
# Multi-surface components (e.g. authentik, frpc) are tiered by their worst
# exposure; the narrower surface is noted on the entry.
#
# Fields vs. comments: only `name`, `tier`, `osv_category`, `osv_packages`, and
# `untracked` are data consumed by automation/tests. Everything else about a
# component (package/bin name, pin source, manifest path) is written as a
# comment for human reference — it deliberately is not a field, so YAML keys
# are never mistaken for machine inputs.
#
# osv-feed matches this software via the tracking categories in
# monitoring/install-osv-feed.yml, which loads THIS FILE (vars_files) and
# derives its [tracking.*] package lists from the per-entry `category` +
# `osv_packages` fields below. Keep `osv_packages` in sync with the
# pin/package a component ships so the collector tracks what actually runs.
perimeter_software:

  # --- Self-built source pins (osv-feed Go ecosystem via [tracking.selfbuilt]) ---
  - name: frps
    tier: P0-U
    osv_category: selfbuilt
    osv_packages: ["github.com/fatedier/frp=0.70.1"]   # osv-feed [tracking.selfbuilt], Go
    # package: github.com/fatedier/frp (Go)
    # pin_source: app/build-frp.yml frp_repo_sha (frp v0.70.1 = ebe707da...)
  - name: frpc (public HTTP/HTTPS + control channel)
    # Carries the P0-U public HTTP/HTTPS tunnel; the frp control channel /
    # tunnel-registration token path on top is P0-A. Tier by worst exposure.
    tier: P0-U
    osv_category: selfbuilt
    osv_packages: ["github.com/fatedier/frp=0.70.1"]   # osv-feed [tracking.selfbuilt], Go; same pin as frps
    # package: github.com/fatedier/frp (Go)
    # pin_source: app/build-frp.yml frp_repo_sha (frp v0.70.1)

  # --- apt / distro perimeter packages (osv-feed [tracking.perimeter]) ---
  - name: openssh-server
    # sshd's pre-auth surface (wire protocol, KEX, auth negotiation) is
    # internet-reachable before a credential, so it tiers P0-U like any login
    # page; only the authenticated admin session behind it is P0-A.
    tier: P0-U
    osv_category: perimeter
    osv_packages: ["openssh"]   # osv-feed [tracking.perimeter]
    # package: openssh
    # pin_source: apt (unattended-upgrades); tracked via monitoring/install-osv-feed.yml
  - name: openssl / libssl
    tier: P2
    osv_category: perimeter
    osv_packages: ["openssl"]   # osv-feed [tracking.perimeter]; P2 exposure but apt-tracked with the perimeter set
    # package: openssl
    # pin_source: apt (unattended-upgrades)
  - name: nginx
    tier: P0-U
    osv_category: perimeter
    osv_packages: ["nginx"]   # osv-feed [tracking.perimeter]
    # package: nginx
    # pin_source: apt; certbot-manager rendered sites
  - name: certbot + python3-certbot-nginx
    # ACME HTTP-01 challenge is served by nginx (the P0-U surface); certbot
    # itself is an outbound renewal client, so it tiers at P1, not P0-U.
    tier: P1
    osv_category: perimeter
    osv_packages: ["certbot", "python3-certbot-nginx"]   # osv-feed [tracking.perimeter]
    # package: certbot, python3-certbot-nginx
    # pin_source: apt
  - name: frontend host firewall
    tier: "P0 guardrail"
    osv_category: perimeter
    osv_packages: ["ufw", "iptables"]   # osv-feed [tracking.perimeter]; P0 guardrail
    # package: ufw, iptables
    # pin_source: apt; frp-server/monitoring playbooks

  # --- network-side packages (osv-feed [tracking.network], P1) ---
  - name: keepalived
    tier: P1
    osv_category: network
    osv_packages: ["keepalived"]   # osv-feed [tracking.network]
    # package: keepalived
    # pin_source: apt
  - name: dnsmasq & squid
    tier: P1
    osv_category: network
    osv_packages: ["dnsmasq", "squid"]   # osv-feed [tracking.network]
    # package: dnsmasq, squid
    # pin_source: apt
  - name: wireguard / wireguard-tools
    # The wireguard endpoint listens on a public UDP port and its handshake is
    # processed before a key is established, so it tiers P0-U by exposure.
    # wireguard-tools (wg/wg-quick) is non-listening config tooling (P2).
    tier: P0-U
    osv_category: network
    osv_packages: ["wireguard", "wireguard-tools"]   # osv-feed [tracking.network]
    # package: wireguard, wireguard-tools
    # pin_source: apt
  - name: prometheus-blackbox-exporter
    # Outbound prober / scrape target: no external ingress surface, so it
    # tiers at P2 like the other monitoring tooling rather than P1.
    tier: P2
    osv_category: network
    osv_packages: ["prometheus-blackbox-exporter"]   # osv-feed [tracking.network]
    # package: prometheus-blackbox-exporter
    # pin_source: apt

  # --- host runtimes (osv-feed [tracking.runtimes], P2) ---
  - name: docker / containerd / runc / podman
    tier: P2
    osv_category: runtimes
    osv_packages: ["docker.io", "containerd", "runc", "podman"]   # osv-feed [tracking.runtimes]
    # package: docker.io, containerd, runc, podman
    # pin_source: apt
  - name: Incus / LXC / QEMU
    tier: P2
    osv_category: runtimes
    # not yet in osv-feed [tracking.runtimes] (feed categories cover docker/containerd/runc/podman only) (untracked today)
    osv_packages: []
    # package: incus, lxc, qemu
    # pin_source: apt/snaps

  # --- Public container images (osv-feed [tracking.container], manifests) ---
  - name: open-webui
    # chat.<domain>. Edge-gated by the IdP: nginx `auth_request
    # /outpost.goauthentik.io/auth/nginx` forward-auth on `location /` (same
    # boundary as ComfyUI / admin-api) keeps unauthenticated pre-auth bytes off
    # the whole vhost — the gate is the boundary, not a disabled login form.
    # App-level login stays OIDC-via-authentik with local signup / password
    # form disabled (ENABLE_SIGNUP=False / ENABLE_LOGIN_FORM=False). The
    # inference API (/v1/) and its /healthz liveness probe are served at
    # the root <domain> vhost, not on chat.<domain>.
    tier: P0-A
    osv_category: container
    # osv-feed [tracking.container]; manifest-driven, no packages list
    osv_packages: []
    # package: container image (PyPI manifest)
    # pin_source: app/build-open-webui.yml webui_repo_sha 91ea4e34... (v0.12.3 + mobile-upload/pillow/certifi/Brotli patches); plugins 746f4b2f...
    # manifest: config/ansible/monitoring/container-manifests/open-webui.manifest (built image pip list, 317 pkgs)
  - name: zulip
    # zulip.<domain>. The interactive web surface (everything except /api/)
    # is edge-gated by the IdP: nginx `auth_request
    # /outpost.goauthentik.io/auth/nginx` forward-auth on the external
    # zulip.<domain> vhost's `location /` (same boundary as ComfyUI /
    # admin-api); app-level login is SAML-only
    # (zulip_auth_backends: SAMLAuthBackend, local password login disabled).
    # But /api/ is a pre-auth surface: non-browser clients (apps, bots,
    # zulip-send) use Zulip API keys / basic auth, not an authentik cookie,
    # so Zulip itself processes untrusted pre-auth bytes there — tiered
    # P0-U by its worst exposure (the edge gate is the P0-A sub-surface).
    tier: P0-U
    osv_category: container
    # osv-feed [tracking.container]; manifest-driven, no packages list
    osv_packages: []
    # package: container image (PyPI manifest)
    # pin_source: app/build-zulip.yml zulip v12.1-0 (docker-zulip 9a0bd360..., src 7d85fc15...)
    # manifest: config/ansible/monitoring/container-manifests/zulip.manifest (--uv-select prod, 182 pkgs)
  - name: comfyui
    # comfy.<domain>. Gated by the IdP edge forward-auth (auth_request
    # /outpost.goauthentik.io/auth/nginx in comfyui-locations.conf); the app
    # itself is unauthenticated and would be P0-U without that gate, so it is
    # tiered P0-A by its actual boundary. Not yet scanned by osv-feed: no
    # container/*.manifest is generated for the GPU-host image (untracked today).
    tier: P0-A
    osv_category: container
    osv_packages: []
    untracked: true
    # package: container image (Python/uv deps)
    # pin_source: app/install-comfyui.yml comfyui_image_tag 0.30.0 (buildah from source)
    # manifest: none yet — no container manifest generated for comfyui (untracked today)
  - name: authentik (server + worker)
    # Login/registration and the pre-auth session surface are P0-U (no
    # credential gate); only the authenticated admin endpoints behind
    # forward-auth are P0-A. Tier by the worst exposure.
    tier: P0-U
    osv_category: container
    # osv-feed [tracking.container]; manifest-driven, no packages list
    osv_packages: []
    # package: container image (PyPI manifest, digest-pinned)
    # pin_source: app/install-authentik.yml authentik_image @sha256:5a77d345... (2026.5.6)
    # manifest: config/ansible/monitoring/container-manifests/authentik.manifest (--uv-select base, 158 pkgs)
  - name: forgejo
    # git.<domain>. No edge forward-auth: git clients and API tokens are
    # not Authentik sessions, so Forgejo itself is the auth boundary. The
    # web login is OIDC via Authentik. Tier P0-U by the pre-auth git/API
    # surface.
    tier: P0-U
    osv_category: container
    osv_packages: []
    # package: container image (Alpine source packages + Forgejo Go modules)
    # pin_source: app/build-forgejo.yml (upstream @sha256:c6931ca... 17.0.0
    #             + brotli/expat/zlib security bumps)
    # manifest: config/ansible/monitoring/container-manifests/forgejo.manifest
    # (Alpine apk source origins + linked Go module buildinfo, 280 specs)
  - name: vikunja
    # tasks.<domain>. No edge forward-auth: the web UI logs in through OIDC
    # and API/CalDAV clients use Vikunja tokens, not an Authentik session.
    # Vikunja is the auth boundary; tier P0-U by the pre-auth login/API
    # surface.
    tier: P0-U
    osv_category: container
    osv_packages: []
    # package: container image (distroless/scratch, Go module buildinfo)
    # pin_source: app/install-vikunja.yml vikunja_upstream_image
    #             (upstream 2.7.1 amd64 @sha256:3a848c83404d...; index
    #             @sha256:f7dc8428d10a...)
    # manifest: config/ansible/monitoring/container-manifests/vikunja.manifest
    # (Go module buildinfo, 159 specs)
